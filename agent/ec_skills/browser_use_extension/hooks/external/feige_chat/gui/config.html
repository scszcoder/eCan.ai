<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>feige_chat — config</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Only the controls theme.css does not already cover. */
    .row select {
      background: var(--input-bg, transparent);
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font: inherit;
    }
    .row label.check { display: flex; align-items: center; gap: 6px; color: inherit; font-size: 13px; }
    .row label.check input { width: auto; }
    .muted-block { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Feige Chat — Global Config</h2>
    <p class="hint">Settings here apply to every node that uses this plugin.</p>

    <div class="row">
      <label for="cooldown">Cooldown (ms)</label>
      <input id="cooldown" type="number" min="0" step="100" />
    </div>

    <div class="row">
      <label for="sendAction">Send action name</label>
      <input id="sendAction" type="text" />
    </div>

    <div class="row">
      <label>Quick replies</label>
      <div id="quickReplies" class="kv"></div>
      <button id="addQR" class="ghost">+ add reply</button>
    </div>

    <div class="footer">
      <button id="save" class="primary">Save</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div class="card">
    <h2>过渡话术 / Stand-by reply</h2>
    <p class="hint">
      真实回复较慢时，先给顾客发一句话，避免平台判定「未回复」。
      A short line typed while the real answer is still being written.
    </p>

    <div class="row">
      <label for="storeSel">店铺 / Store</label>
      <select id="storeSel"></select>
    </div>

    <div class="row" id="inheritRow" hidden>
      <label class="check">
        <input type="checkbox" id="inherit" />
        跟随默认设置 / Use the account default
      </label>
    </div>

    <div id="phFields">
      <div class="row">
        <label class="check">
          <input type="checkbox" id="phEnabled" />
          启用过渡话术 / Enabled
        </label>
      </div>

      <div class="row">
        <label for="phTimeout">触发等待（秒） / Trigger after (seconds)</label>
        <input id="phTimeout" type="number" min="0" step="1" />
      </div>

      <div class="row">
        <label>话术（最多 5 条，按顺序使用） / Lines (max 5, used in order)</label>
        <div id="phTexts" class="kv"></div>
        <button id="addText" class="ghost">+ 添加一条 / add line</button>
      </div>
    </div>

    <p class="hint" id="phEnvNote" hidden></p>
    <p class="hint" id="phLegacyNote" hidden>
      以上话术来自旧的配置文件（placeholder_texts.json），点「保存」后由本界面接管。
    </p>
    <p class="hint">空行与重复行会被自动忽略；界面设置优先于环境变量。</p>

    <div class="footer">
      <button id="phSave" class="primary">保存 / Save</button>
      <span id="phStatus" class="status"></span>
    </div>
  </div>

  <script src="bridge.js"></script>
  <script src="config.js"></script>
</body>
</html>
