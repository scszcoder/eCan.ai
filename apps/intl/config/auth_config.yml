  KEY_ID: ""             # 从环境变量 ECAN_APPLE_KEY_ID 读取
  PRIVATE_KEY_PATH: ""   # 从环境变量 ECAN_APPLE_PRIVATE_KEY_PATH 读取

SMS:
  provider: "aws_ses"
  region: "us-east-1"
  from_address: "noreply@ecan.ai"

EMAIL:
  provider: "aws_ses"
  region: "us-east-1"
  from_address: "noreply@ecan.ai"
