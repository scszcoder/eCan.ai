# Authentication Configuration - CN App
# 腾讯云 CloudBase (TCB) 认证配置
# 与 intl 版本同构，业务接口 (signInWithEmail/Phone/Wechat 等) 完全一致

CLOUDBASE:
  ENV_ID: ""                       # CloudBase 环境 ID（从 ECAN_TENCENT_CLOUDBASE_ENV_ID 读取）
  SECRET_ID: ""                    # 腾讯云 API SecretId（从 ECAN_TENCENT_SECRET_ID 读取）
  SECRET_KEY: ""                   # 腾讯云 API SecretKey（从 ECAN_TENCENT_SECRET_KEY 读取）
  REGION: "ap-guangzhou"

  # 登录方式开关
  ENABLE_EMAIL_LOGIN: true
  ENABLE_PHONE_LOGIN: true
  ENABLE_WECHAT_LOGIN: true
  ENABLE_SIGNUP: true
  ENABLE_ANONYMOUS_LOGIN: false

# JWT Token 配置（应用内部 Token）
JWT:
  SECRET: ""                       # JWT 签名密钥（从 ECAN_JWT_SECRET 读取），至少 32 字符
  EXPIRES_IN: 86400                # Token 有效期（秒），默认 24 小时

# 短信服务 (替代 AWS SES)
SMS:
  provider: "tcb_sms"              # 腾讯云短信
  sdk_app_id: ""                   # 短信应用 SDK AppID（从 ECAN_TENCENT_SMS_SDK_APP_ID 读取）
  template_id: ""                  # 验证码模板 ID（从 ECAN_TENCENT_SMS_TEMPLATE_ID 读取）
  sign_name: "eCan"                # 短信签名
  region: "ap-guangzhou"

# 邮件服务 (替代 AWS SES)
EMAIL:
  provider: "tcb_email"            # 腾讯云 SES
  from_address: "noreply@fastprecisiontech.com"
  region: "ap-guangzhou"

# 微信登录
WECHAT:
  APP_ID: ""                       # 微信公众号/小程序 ID（从 ECAN_WECHAT_APP_ID 读取）
  APP_SECRET: ""                   # 微信 AppSecret（从 ECAN_WECHAT_APP_SECRET 读取）
  CALLBACK_URL: "https://www.fastprecisiontech.com/auth/wechat/callback"
  SCOPE: "snsapi_userinfo"         # 授权作用域

# 与 intl 对齐的字段 (统一前端接口)
COGNITO:
  # CN 版本不使用 Cognito，保留字段以保持与 intl 配置结构一致
  ENABLED: false

GOOGLE:
  ENABLED: false                   # CN 版本暂不启用 Google 登录

APPLE:
  ENABLED: false                   # CN 版本暂不启用 Apple 登录

# 验证码存储（开发环境使用内存，生产环境应替换为 Redis）
CODE_STORE:
  TTL_SECONDS: 300                 # 验证码有效期（秒），默认 5 分钟
  COOLDOWN_SECONDS: 60             # 发送冷却时间（秒），默认 60 秒
  MAX_ATTEMPTS: 5                  # 最大验证尝试次数
