# eCan.ai CN 版本 - CloudBase 配置
# =============================================================================

# ---------- CloudBase 认证配置 ----------
CLOUDBASE:
  # 环境标识（公开资源 ID）
  ENV_ID: "sccb0-d0gc5398xf028be6a"

  # 区域（必须与 ENV_ID 创建时选择的区域一致）
  # 可选: ap-shanghai, ap-guangzhou, ap-beijing, ap-nanjing, ap-hongkong
  REGION: "ap-shanghai"

  # 微信 AppID（用于微信登录）
  WECHAT_APP_ID: ""

  # 短信验证码配置
  SMS_ENABLED: false
  SMS_APP_ID: ""
  SMS_APP_KEY: ""
  SMS_SIGN_NAME: "eCan"
  SMS_TEMPLATE_CODE: ""

# ---------- CN AppSync 兼容端点 ----------
# 与 Intl 的 APPSYNC.* 字段对应,CN 用 TCB 实现
APPSYNC:
  # HTTP GraphQL 端点
  # 部署后由 deploy.sh 自动回写(scripts/update_auth_config.py)
  # 格式: https://{env_id}.service.tcloudbase.com/api/graphql
  GRAPHQL_ENDPOINT: "https://sccb0-d0gc5398xf028be6a.service.tcloudbase.com/api/graphql"
  # WebSocket 实时订阅端点
  # 部署后由 deploy.sh 自动回写
  # 格式: wss://{env_id}.service.tcloudbase.com/ws
  WS_ENDPOINT: "wss://sccb0-d0gc5398xf028be6a.service.tcloudbase.com/ws"
  # API Key(可选)
  API_KEY: ""

# ---------- CN 版本功能开关 ----------
FEATURES:
  # 是否启用 CloudBase 云端功能
  ENABLE_CLOUDBASE: true

  # 是否启用微信登录
  ENABLE_WECHAT_LOGIN: false

  # 是否启用短信登录
  ENABLE_SMS_LOGIN: false
