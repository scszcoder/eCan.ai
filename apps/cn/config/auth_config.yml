# Authentication Configuration - CN App
# 腾讯云 CAM 认证配置

CAM:
  SECRET_ID: ""          # 从环境变量 ECAN_TENCENT_SECRET_ID 读取
  SECRET_KEY: ""         # 从环境变量 ECAN_TENCENT_SECRET_KEY 读取
  APP_ID: "125xxxxxxx"   # 腾讯云 App ID，从环境变量 ECAN_TENCENT_APP_ID 读取
  REGION: "ap-guangzhou"

WECHAT:
  APP_ID: ""             # 微信开放平台 AppID，从环境变量 ECAN_WECHAT_APP_ID 读取
  APP_SECRET: ""         # 微信开放平台 AppSecret，从环境变量 ECAN_WECHAT_APP_SECRET 读取
  CALLBACK_URL: "http://localhost:9382/callback"

SMS:
  provider: "tencent"    # 腾讯云短信
  region: "ap-guangzhou"
  sdk_app_id: ""         # 从环境变量 ECAN_TENCENT_SMS_SDK_APP_ID 读取
  sign_name: "eCan"      # 短信签名

EMAIL:
  provider: "tencent"    # 腾讯云邮件
  region: "ap-guangzhou"
  from_address: "noreply@fastprecisiontech.com"
