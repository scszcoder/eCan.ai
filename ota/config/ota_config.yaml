# ============================================
# eCan OTA Configuration
# ============================================
#
# ============================================
# BUCKET NAMING — READ THIS FIRST
# ============================================
# There are TWO separate buckets per app, owned by different code paths:
#
#   OTA bucket (THIS FILE)
#     intl: ecan-releases                       (S3,  owned by upload_to_s3.py + this script)
#     cn:   ecan-releases-1251680599            (COS, owned by upload_to_cos.py + this script)
#     Reads: released desktop clients checking for updates
#
#   Runtime app-storage bucket (apps/{cn,intl}/config/cloud_endpoints.json)
#     intl: ecan-skills                         (S3,  owned by utils.storage.get_storage_provider)
#     cn:   ecan-skills-1251680599              (COS, owned by utils.storage.get_storage_provider)
#     Reads: end users via CDN, for avatars / exports / uploads
#
# They MUST stay separate. An OTA artifact accidentally written to the
# runtime bucket will silently work and then break update checks for
# every user — there is no validation that catches this at upload time.
#
# ============================================
# OTA Feature Toggle
# Set to false to completely disable OTA functionality
# ============================================
ota_enabled: true

# ============================================
# Current Environment
# Valid values: simulation, development, test, staging, production
# Note: This value should be set during build time, do not modify manually
#
# Active value: ``test`` — dev clients point at the remote TEST bucket
# so end-to-end OTA behavior can be validated against the same code path
# as a real user (S3/COS, signed URLs, channels/.../appcast-*.xml), with
# the test bucket acting as a sandbox. Switch back to ``development``
# only when iterating locally against the in-tree OTA test server.
# ============================================
environment: test

# ============================================
# Common Configuration
# ============================================
common:
  app_name: "eCan"
  
  # AWS S3 (Intl app)
  s3_bucket: "ecan-releases"
  s3_region: "us-east-1"
  
  # Tencent Cloud COS (CN app)
  cos_bucket: "ecan-releases-1251680599"
  cos_region: "ap-shanghai"
  
  # S3 base path (optional, defaults to empty)
  s3_base_path: ""
  
  # Supported platforms
  platforms:
    - macos
    - windows
    - linux
  
  # Supported architectures
  architectures:
    macos:
      - aarch64
      - amd64
    windows:
      - amd64
    linux:
      - amd64

# ============================================
# Environment Configuration
# ============================================
environments:
  # ------------------------------------------
  # Development Environment
  # ------------------------------------------
  development:
    # S3 path prefix (Intl app)
    s3_prefix: "dev"
    # COS path prefix (CN app)
    cos_prefix: "dev"
    
    # Release channel
    channel: "dev"

    # Appcast base URL (development environment uses local server)
    appcast_base: "http://127.0.0.1:8080"
    # CN app: COS-based appcast base URL. Dev points at the local
    # OTA test server (same host:port as intl); production-shaped
    # environments override with an accelerated COS URL below.
    appcast_base_cos: "http://127.0.0.1:8080"
    
    # Signature verification (disabled by default for key security)
    # To enable signature verification:
    # 1. Ensure private key exists: build_system/certificates/ed25519_private_key.pem
    # 2. Ensure public key exists: ota/certificates/ed25519_public_key.pem
    # 3. Set both options below to true
    signature_required: false
    signature_verification: false
    
    # Automatic updates
    auto_check: true
    check_interval: 300  # 5 minutes (seconds)
    auto_check_initial_delay: 5  # Delay after startup (seconds) - fast check for dev environment
    silent_mode: false
    
    # Development environment OTA check toggle
    # Even if ota_enabled is true, this switch can independently control OTA checks in dev environment
    dev_ota_check_enabled: false
    
    # Security settings
    allow_http: true
    
    # Development mode
    dev_mode: true
  
  # ------------------------------------------
  # Test Environment
  # ------------------------------------------
  test:
    # S3 path prefix (Intl app)
    s3_prefix: "test"
    # COS path prefix (CN app)
    cos_prefix: "test"
    
    # Release channel
    channel: "beta"

    # Appcast base URL (read from S3)
    appcast_base: "https://ecan-releases.s3.us-east-1.amazonaws.com/test"
    # CN app: COS-based appcast base URL
    appcast_base_cos: "https://ecan-releases-1251680599.cos.ap-shanghai.myqcloud.com/test"
    
    # Signature verification (required for test environment)
    signature_required: true
    signature_verification: true
    
    # Automatic updates
    auto_check: true
    check_interval: 1800  # 30 minutes (seconds)
    auto_check_initial_delay: 120  # Delay after startup (seconds) - 2 minutes
    silent_mode: false
    
    # Security settings
    allow_http: true
    
    # Development mode
    dev_mode: false
  
  # ------------------------------------------
  # Staging Environment
  # ------------------------------------------
  staging:
    # S3 path prefix (Intl app)
    s3_prefix: "staging"
    # COS path prefix (CN app)
    cos_prefix: "staging"
    
    # Release channel
    channel: "stable"

    # Appcast base URL (read from S3)
    appcast_base: "https://ecan-releases.s3.us-east-1.amazonaws.com/staging"
    # CN app: COS-based appcast base URL
    appcast_base_cos: "https://ecan-releases-1251680599.cos.ap-shanghai.myqcloud.com/staging"
    
    # Signature verification (required for staging)
    signature_required: true
    signature_verification: true
    
    # Automatic updates
    auto_check: true
    check_interval: 3600  # 1 hour (seconds)
    auto_check_initial_delay: 120  # Delay after startup (seconds) - 2 minutes
    silent_mode: false
    
    # Security settings
    allow_http: false
    
    # Development mode
    dev_mode: false
  
  # ------------------------------------------
  # Simulation Environment (for testing release workflow)
  # ------------------------------------------
  simulation:
    # S3 path prefix (Intl app)
    s3_prefix: "simulation"
    # COS path prefix (CN app)
    cos_prefix: "simulation"
    
    # Release channel (isolated simulation channel)
    channel: "simulation"

    # Appcast base URL (isolated S3 path)
    appcast_base: "https://ecan-releases.s3.us-east-1.amazonaws.com/simulation"
    # CN app: COS-based appcast base URL
    appcast_base_cos: "https://ecan-releases-1251680599.cos.ap-shanghai.myqcloud.com/simulation"
    
    # Signature verification (same as production for testing)
    signature_required: true
    signature_verification: true
    
    # Automatic updates (disabled for simulation)
    auto_check: false
    check_interval: 86400  # 24 hours (seconds)
    auto_check_initial_delay: 300  # 5 minutes
    silent_mode: false
    
    # Security settings
    allow_http: false
    
    # Development mode (false to use platform-specific updater)
    dev_mode: false
    
    # Force use of platform-specific updater (not generic)
    force_generic_updater_in_dev: false
  
  # ------------------------------------------
  # Production Environment
  # ------------------------------------------
  production:
    # S3 path prefix (Intl app)
    s3_prefix: "production"
    # COS path prefix (CN app)
    cos_prefix: "production"
    
    # Release channel
    channel: "stable"

    # Appcast base URL (read from S3)
    appcast_base: "https://ecan-releases.s3.us-east-1.amazonaws.com/production"
    # CN app: COS-based appcast base URL
    appcast_base_cos: "https://ecan-releases-1251680599.cos.ap-shanghai.myqcloud.com/production"
    
    # Signature verification (required for production)
    signature_required: true
    signature_verification: true
    
    # Automatic updates
    auto_check: true
    check_interval: 14400  # 4 hours (seconds)
    auto_check_initial_delay: 120  # Delay after startup (seconds) - 2 minutes
    silent_mode: true
    
    # Security settings
    allow_http: false
    
    # Development mode
    dev_mode: false

# ============================================
# Advanced Configuration (Optional)
# ============================================
advanced:
  # Download path (leave empty to use default)
  download_path: null
  
  # Backup settings
  backup_enabled: true
  
  # Public key path (for signature verification)
  public_key_path: null
  
  # UI update behavior
  # Valid values: notification, dialog, badge, notification+badge
  ui_update_behavior: "notification"
  
  # macOS DMG installation target directory
  dmg_target_dir: "/Applications"
  
  # Development environment installer settings
  dev_installer_enabled: false
  dev_installer_quiet: true
