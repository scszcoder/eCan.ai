[pytest]
testpaths = tests/unit tests/integration tests/smoke
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    unit: Unit tests for pure functions with no I/O
    integration: Integration tests with mocked external dependencies
    smoke: Smoke tests for critical paths (core features must pass)
    e2e: End-to-end tests via WebSocket or full app startup
    slow: Tests that take longer than 10 seconds
    cloud: Tests that hit the real cloud API (opt-in, skipped by default)
    browser: Tests requiring browser automation (playwright)

addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=5
    --color=yes
    -p no:rerunfailures

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
branch = True
source = agent,utils,gui,config,common
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
