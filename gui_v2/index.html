<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logoWhite22.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eCan.ai</title>
    <style>
      /* 预加载占位主题：先用与最终主题一致的背景，避免加载瞬间的白/黑闪烁。
         主题由 theme-init 脚本（下方）根据 localStorage 设定 data-theme。 */
      html, body {
        background-color: var(--preload-bg, #0f172a);
        color: var(--preload-fg, #f8fafc);
        margin: 0;
        padding: 0;
        /* MUST stay in sync with --font-family in src/styles/global.css.
           'Inter' was never loaded (no @font-face / webfont link), so declaring
           it first only guaranteed a fallback mismatch between preload chrome
           and the app. CJK families are named explicitly so Chinese text never
           falls back per-element. */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
      }
      #root {
        background-color: var(--preload-bg, #0f172a);
        min-height: 100vh;
      }
      /* 加载动画样式 */
      .initial-loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: transparent;
        color: var(--preload-fg, #f8fafc);
        font-size: 16px;
      }
      .loading-spinner {
        border: 3px solid #334155;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loading">
        <div class="loading-spinner"></div>
        <span id="loading-text">Loading...</span>
      </div>
    </div>
    <script>
      // 在首帧之前解析主题，避免加载瞬间的白/黑闪烁（FOUC）。
      // 与 src/contexts/ThemeContext.tsx 的 localStorage key 保持一致。
      (function() {
        try {
          var stored = localStorage.getItem('theme') || 'dark';
          var resolved = stored;
          if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (resolved !== 'light' && resolved !== 'dark') resolved = 'dark';
          document.documentElement.setAttribute('data-theme', resolved);
          document.addEventListener('DOMContentLoaded', function() {
            document.body.className = resolved;
          });
          var light = resolved === 'light';
          /* MUST match --bg-primary in styles/global.css `body.light`
             (#eef2f7); this is the pre-paint background, so a stale value
             here shows up as a colour shift on first paint. */
          document.documentElement.style.setProperty('--preload-bg', light ? '#eef2f7' : '#0f172a');
          document.documentElement.style.setProperty('--preload-fg', light ? '#0f172a' : '#f8fafc');
        } catch (e) { /* 私密模式等场景下忽略 */ }
      })();
    </script>
    <script>
      // 根据系统语言设置加载文本
      (function() {
        const getLoadingText = () => {
          // 首先检查 localStorage 中保存的语言设置
          const savedLanguage = localStorage.getItem('i18nextLng');
          if (savedLanguage) {
            return savedLanguage === 'zh-CN' ? '加载中...' : 'Loading...';
          }

          // 如果没有保存的语言设置，检查浏览器语言
          const browserLanguage = navigator.language || navigator.languages[0];

          // 检查是否为中文
          if (browserLanguage.startsWith('zh')) {
            return '加载中...';
          }

          // 默认返回英文
          return 'Loading...';
        };

        // 设置加载文本
        const loadingTextElement = document.getElementById('loading-text');
        if (loadingTextElement) {
          loadingTextElement.textContent = getLoadingText();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
