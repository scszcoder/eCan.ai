type Subscription {
  onA2AMessageReceived(channelId: String!): A2AMessage
  onAgentSceneEvent(acctSiteID: String!, agent_id: String!): Scene @aws_subscribe(mutations : ["updateScene"])
  onMessageReceived(chatID: String!): WanChatMessage
  onAccountNotification(owner: ID!): AccountNotification! @aws_subscribe(mutations: ["publishAccountNotification"])
  onPuzzleReceived(solver: ID!): Puzzle @aws_subscribe(mutations : ["sendPuzzle"])
  onPuzzleResultReceived(owner: ID!): PuzzleSolution @aws_subscribe(mutations : ["sendPuzzleSolution"])
  onSceneComplete(acctSiteID: String!): SceneResult @aws_subscribe(mutations : ["publishSceneResult"])
  onStoryUpdate(acctSiteID: String!): Story @aws_subscribe(mutations : ["updateStory"])
  onLongLLMTaskComplete(acctSiteID: String!): Story @aws_subscribe(mutations : ["EndLongLLMTask"])
}

