name: 'Setup Python Environment'
description: 'Setup Python environment with virtual environment and dependencies'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  requirements-file:
    description: 'Requirements file to install'
    required: false
    default: 'requirements-base.txt'
  platform:
    description: 'Platform (windows, macos, linux)'
    required: true
  install-pyinstaller:
    description: 'Whether to install PyInstaller'
    required: false
    default: 'true'
  pyinstaller-version:
    description: 'PyInstaller version to install'
    required: false
    default: '6.18.0'
  extra-packages:
    description: 'Extra packages to install (comma-separated)'
    required: false
    default: ''
  architecture:
    description: 'Python architecture (x64, arm64, auto)'
    required: false
    default: 'auto'

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      # Self-hosted runners (ecan-macos-aarch64, ecan-windows-amd64, ...) are
      # expected to pre-install the matching Python version once at provisioning
      # time. actions/setup-python@v6 writes to a hardcoded default toolcache
      # directory that the runner service user (e.g. `xinhu` on macOS) cannot
      # create (e.g. `/Users/runner/hostedtoolcache`), failing with:
      #   Error: mkdir: /Users/runner: Permission denied
      #   Error: The process '/bin/bash' failed with exit code 1
      # GitHub-hosted runners are disposable and re-install per job, so the
      # action still runs there. Same gating pattern as the Linux sudo fix
      # (0052b0e26).
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.architecture }}

    - name: Cache virtual environment
      id: cache-venv
      # A venv contains absolute interpreter/workspace paths. Reuse it only on
      # disposable GitHub-hosted runners, matching the existing hosted flow.
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/cache@v5
      with:
        path: .venv
        # Use runner.arch (actual runner architecture) to prevent cross-arch cache pollution
        # runner.arch returns X64, ARM64, etc.
        # Include app-specific requirements so cache busts when CN/Intl extras change.
        key: ${{ inputs.platform }}-${{ runner.arch }}-${{ env.ECAN_APP_ID }}-venv-py${{ inputs.python-version }}-${{ hashFiles(inputs.requirements-file, 'requirements-cn.txt', 'requirements-intl.txt') }}-${{ inputs.extra-packages }}

    - name: Configure pip download cache
      shell: bash
      run: |
        echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"

    - name: Cache pip dependencies
      # Mirror the venv cache above: pip download cache saves happen in the
      # post phase and are wasteful on self-hosted runners that already keep
      # `$RUNNER_TEMP/pip-cache` on local disk. GitHub-hosted runners are
      # disposable and still benefit from this cache.
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/cache@v5
      with:
        # An explicit runner-temp path works consistently on Windows, macOS,
        # and Linux; actions/cache restores it for both hosted runner types.
        path: ${{ runner.temp }}/pip-cache
        # Use runner.arch to prevent cross-arch cache pollution.
        # Include app-specific requirements in cache key so per-app dep changes bust the cache.
        key: ${{ inputs.platform }}-${{ runner.arch }}-pip-${{ inputs.python-version }}-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ inputs.platform }}-${{ runner.arch }}-pip-${{ inputs.python-version }}-

    - name: Create and activate virtual environment
      shell: bash
      run: |
        echo "=== Creating Virtual Environment ==="
        # `actions/setup-python@v6` is gated to github-hosted (see the step
        # above), so on macOS / Linux self-hosted runners nothing has added a
        # `python` symlink to PATH. Homebrew's `brew install python@3.12`
        # only installs `python3` / `python3.12`, never a bare `python`.
        #
        # Critically, we don't just check `command -v` — we also verify the
        # candidate can actually import `_ctypes`. On self-hosted Linux
        # runners there's been at least one case where a non-standard
        # Python installation at
        #   /home/ecan/actions-runner/_work/_tool/Python/3.12.14/x64/
        # shadowed the apt-installed /usr/bin/python3.12 and got picked
        # up first by `python3`. That Python's _ctypes.so was built
        # against an older Python (or otherwise corrupted) and is missing
        # `_PyErr_SetLocaleString`, so every PyInstaller subprocess
        # crashed at import time with:
        #   ImportError: undefined symbol: _PyErr_SetLocaleString
        # Probing the actual import (the real contract we care about)
        # rejects the broken interpreter before it can poison the venv.
        #
        # Probe order: prefer explicit /usr/bin/python3.12 (apt-installed,
        # matches requirements) and /usr/bin/python3.13 (newer apt),
        # then PATH-default `python` / `python3` as fallback.
        PY=""
        for candidate in python3.12 /usr/bin/python3.12 python3.13 /usr/bin/python3.13 python python3; do
          if command -v "$candidate" >/dev/null 2>&1; then
            if "$candidate" -c "import _ctypes, ctypes.util" 2>/dev/null; then
              PY="$candidate"
              break
            else
              echo "[INFO] $candidate resolves to a working interpreter but _ctypes import failed; trying next candidate"
            fi
          fi
        done
        if [ -z "$PY" ]; then
          echo "::error::No working Python 3.12 found on PATH (every candidate either missing or has a broken _ctypes). Tried: python3.12, /usr/bin/python3.12, python3.13, /usr/bin/python3.13, python, python3. Probe was 'import _ctypes, ctypes.util'. On self-hosted Linux runners, install via 'sudo apt install python3.12 python3.12-venv' (see docs/DEPLOYMENT_UBUNTU.md). On self-hosted macOS, install via 'brew install python@3.12'."
          exit 1
        fi
        echo "Using Python launcher: $PY ($("$PY" -V 2>&1))"

        if [ "${{ inputs.platform }}" = "windows" ]; then
          VENV_PYTHON=".venv/Scripts/python.exe"
        else
          VENV_PYTHON=".venv/bin/python"
        fi

        # On self-hosted runners the venv cache step is gated to
        # github-hosted, so any pre-existing `.venv` here is leftover
        # workspace state from a previous job (the runner image
        # persists across jobs). That venv was created by whatever
        # launcher was on PATH at the time — which, on the Linux
        # runner that hit the original `_ctypes` crash, was the
        # broken tool-cache Python. A naive reuse would skip the
        # `$PY -m venv` step, leaving the poisoned venv to crash
        # PyInstaller on the very first subprocess. Probe the
        # venv's interpreter with the same contract as the launcher
        # probe above; if the import fails, drop the venv and
        # recreate from the now-verified `$PY`.
        if [ -d ".venv" ] && [ -f "$VENV_PYTHON" ] \
            && "$VENV_PYTHON" -c "import _ctypes, ctypes.util" 2>/dev/null; then
          echo "Existing virtual environment has working _ctypes; reusing .venv"
        else
          if [ -d ".venv" ] && [ -f "$VENV_PYTHON" ]; then
            echo "Existing virtual environment has broken _ctypes (likely from a previous job on this self-hosted runner); recreating with verified launcher $PY"
          else
            echo "No usable venv found; creating fresh .venv"
          fi
          rm -rf .venv
          # Venv creation can fail on self-hosted Linux runners that
          # were provisioned without `python3.12-venv` — the apt
          # package that ships the vensurepip module. Without it,
          # `python3.12 -m venv` exits with:
          #   The virtual environment was not created successfully
          #   because ensurepip is not available. ... apt install
          #   python3.12-venv
          # This surfaces specifically because the venv-reuse probe
          # above now drops the (poisoned) pre-existing `.venv` and
          # forces a recreate; before the probe, the broken venv
          # was silently reused and the missing-venv-module symptom
          # never appeared (the previous PyInstaller crash was the
          # only failure visible to CI). Self-heal: when the failure
          # is the specific ensurepip-missing message AND sudo is
          # available non-interactively, apt-install
          # `python3.12-venv` once and retry. Sudo is gated to the
          # `linux` platform only — the analogous failure on macOS
          # (no `venv` for Homebrew Python) requires the operator
          # to `brew install python@3.12` at provisioning time.
          "$PY" -m venv .venv 2>/tmp/ecan-venv-err.log
          venv_status=$?
          if [ $venv_status -ne 0 ]; then
            venv_err="$(cat /tmp/ecan-venv-err.log)"
            if [ "${{ inputs.platform }}" = "linux" ] \
                && command -v sudo >/dev/null 2>&1 \
                && sudo -n true 2>/dev/null \
                && printf '%s' "$venv_err" | grep -q "ensurepip is not available"; then
              echo "[INFO] venv creation failed (ensurepip unavailable); self-heal via 'sudo apt install python3.12-venv'"
              if sudo -n apt-get install -y -qq python3.12-venv; then
                "$PY" -m venv .venv 2>/tmp/ecan-venv-err2.log
                venv_status=$?
                if [ $venv_status -ne 0 ]; then
                  echo "::error::venv creation still failing after 'sudo apt install python3.12-venv'. First error: $(cat /tmp/ecan-venv-err.log). Second error: $(cat /tmp/ecan-venv-err2.log). On self-hosted Linux runners, install python3.12-venv at provisioning time: 'sudo apt install python3.12 python3.12-venv' (see docs/DEPLOYMENT_UBUNTU.md)."
                  exit 1
                fi
              else
                echo "::error::venv creation failed and self-heal 'sudo apt install python3.12-venv' also failed. Original error: $venv_err. On self-hosted Linux runners, install python3.12-venv at provisioning time: 'sudo apt install python3.12 python3.12-venv' (see docs/DEPLOYMENT_UBUNTU.md)."
                exit 1
              fi
            else
              if [ "${{ inputs.platform }}" = "linux" ]; then
                echo "::error::venv creation failed: $venv_err. On self-hosted Linux runners, ensure python3.12-venv is installed (either pre-provision with 'sudo apt install python3.12 python3.12-venv' or grant passwordless sudo — see docs/DEPLOYMENT_UBUNTU.md)."
              else
                echo "::error::venv creation failed: $venv_err"
              fi
              exit 1
            fi
          fi
        fi

        if [ "${{ inputs.platform }}" = "windows" ]; then
          VENV_DIR_WIN="$(cygpath -w "$PWD/.venv")"
          echo "$VENV_DIR_WIN\\Scripts" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VENV_DIR_WIN" >> $GITHUB_ENV
        else
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
        fi
        echo "Virtual environment created and added to PATH"

    - name: Install Python dependencies
      shell: bash
      run: |
        # Ensure we're using the virtual environment
        if [ "${{ inputs.platform }}" = "windows" ]; then
          export PATH="$PWD/.venv/Scripts:$PATH"
          PYTHON_EXE="$PWD/.venv/Scripts/python.exe"
        else
          export PATH="$PWD/.venv/bin:$PATH"
          PYTHON_EXE="$PWD/.venv/bin/python"
        fi

        echo "=== Python/Pip Info ==="
        "$PYTHON_EXE" -c "import sys; print('Python version:', sys.version); print('Python executable:', sys.executable)"
        "$PYTHON_EXE" -m pip -V

        echo "=== Installing Python Dependencies ==="
        "$PYTHON_EXE" -m pip install --upgrade pip

        # Install base requirements
        if [ -f "${{ inputs.requirements-file }}" ]; then
          echo "Installing requirements from: ${{ inputs.requirements-file }}"
          "$PYTHON_EXE" -m pip install -r "${{ inputs.requirements-file }}"
        fi

        # Install PyInstaller if requested
        if [ "${{ inputs.install-pyinstaller }}" = "true" ]; then
          "$PYTHON_EXE" -m pip install "pyinstaller==${{ inputs.pyinstaller-version }}"
          echo "=== Verifying PyInstaller installation ==="
          "$PYTHON_EXE" -c "import PyInstaller; print('PyInstaller installed successfully')"
        fi

        # Install extra packages if specified
        if [ -n "${{ inputs.extra-packages }}" ]; then
          IFS=',' read -ra PACKAGES <<< "${{ inputs.extra-packages }}"
          for package in "${PACKAGES[@]}"; do
            if [ -n "$package" ]; then
              echo "Installing extra package: $package"
              "$PYTHON_EXE" -m pip install "$package"
            fi
          done
        fi

        echo "=== Verifying key dependencies ==="
        "$PYTHON_EXE" -c "
        import sys
        # Only verify packages that should be installed at this stage
        # playwright is installed separately by setup-playwright action
        packages = ['PyInstaller', 'PySide6', 'requests', 'colorlog']
        for pkg in packages:
            try:
                __import__(pkg)
                print(f'[OK] {pkg} installed successfully')
            except ImportError as e:
                print(f'[WARNING] {pkg} not found: {e}')
        print('Core dependencies verification completed')
        "

    - name: Uninstall pathlib if present
      shell: bash
      run: |
        # Same `python` / `python3` probe as Create-and-activate: macOS
        # self-hosted runners don't ship a `python` symlink. Note that after
        # the venv step, `.venv/bin` is on PATH via $GITHUB_PATH and the venv
        # has its own `python` symlink, so this would normally resolve fine;
        # the explicit probe is defensive in case GITHUB_PATH propagation ever
        # changes.
        if command -v python >/dev/null 2>&1; then
          PY=python
        else
          PY=python3
        fi
        "$PY" -m pip uninstall -y pathlib || true
