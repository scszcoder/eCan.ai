name: 'Setup Node.js Environment'
description: 'Setup Node.js environment and install frontend dependencies'
inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '20'
  frontend-dir:
    description: 'Frontend directory path'
    required: false
    default: 'gui_v2'
  install-command:
    description: 'Install command to use'
    required: false
    default: 'npm install --legacy-peer-deps'
  prefer-system-node:
    description: |
      If true and the host already has a compatible node on PATH (e.g.
      self-hosted runner with Node pre-installed), use it directly and
      skip actions/setup-node@v6 download. Default true on self-hosted
      runners, false on github-hosted.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Probe existing Node.js (self-hosted fast path)
      id: probe-node
      shell: bash
      run: |
        # On self-hosted runners the operator may have installed Node.js
        # system-wide; in that case `node` is already on PATH and the
        # ~30-60s actions/setup-node@v6 download is pure waste. Probe
        # first; fall back to the action if missing.
        #
        # Honor inputs.prefer-system-node when set; otherwise auto-detect
        # from $RUNNER_NAME (self-hosted runners' env includes it).
        PREFER=""
        if [ -n "${{ inputs.prefer-system-node }}" ]; then
          PREFER="${{ inputs.prefer-system-node }}"
        elif [ -n "${RUNNER_NAME:-}" ] && echo "$RUNNER_NAME" | grep -qiE 'self-hosted'; then
          PREFER="true"
        fi

        if [ "$PREFER" = "true" ]; then
          if command -v node >/dev/null 2>&1; then
            EXISTING_NODE="$(node --version 2>/dev/null || true)"
            if [ -n "$EXISTING_NODE" ]; then
              echo "[OK] Using system Node.js: $EXISTING_NODE (skipping actions/setup-node download)" >&2
              echo "have-system-node=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "[INFO] prefer-system-node=true but no node on PATH; falling back to actions/setup-node" >&2
          echo "have-system-node=false" >> "$GITHUB_OUTPUT"
        else
          echo "[INFO] prefer-system-node not set; using actions/setup-node" >&2
          echo "have-system-node=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js ${{ inputs.node-version }}
      if: steps.probe-node.outputs.have-system-node != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache npm download cache
      uses: actions/cache@v5
      with:
        # Cache downloaded package archives only. Never cache node_modules,
        # which may contain platform-specific native binaries.
        path: ${{ runner.temp }}/npm-cache
        key: ${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-npm-${{ hashFiles(format('{0}/package-lock.json', inputs.frontend-dir)) }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node-version }}-npm-

    - name: Install frontend dependencies
      working-directory: ${{ inputs.frontend-dir }}
      shell: bash
      env:
        npm_config_cache: ${{ runner.temp }}/npm-cache
      run: |
        echo "=== Installing Frontend Dependencies ==="

        # Frontend node_modules is intentionally never cached or reused.
        # npm ci removes it before recreating the exact lock-file dependency tree.
        if [ -f "package-lock.json" ]; then
          npm ci --legacy-peer-deps
        else
          rm -rf node_modules
          ${{ inputs.install-command }}
        fi

        echo "=== Verifying Rollup Installation ==="
        if node -e "require('rollup')" 2>/dev/null; then
          echo "✅ Rollup verification passed"
        else
          echo "❌ Rollup verification failed after clean install"
          exit 1
        fi
