# ============================================================================
# Reusable Workflow: Download Links Generation
# ============================================================================
# This reusable workflow generates user-friendly download links for release
# artifacts hosted on AWS S3. It creates both GitHub Actions Summary output
# and a downloadable text file with all URLs.
#
# Features:
#   - Generates download links for Windows and macOS installers
#   - Provides both standard and accelerated S3 URLs
#   - Creates GitHub Actions Summary with formatted links
#   - Generates downloadable text file with all URLs
#   - Supports architecture detection and labeling
#
# Bucket resolution (single source of truth):
#   The OTA bucket / region / prefix are resolved from `ota/config/ota_config.yaml`
#   by `build_system/scripts/resolve_ota_bucket.py`. This is the SAME source
#   that `upload_to_s3.py` reads, so the download-links summary can never
#   drift from where artifacts were actually uploaded.
#
#   Previously this workflow read `secrets.S3_BUCKET` / `secrets.AWS_REGION`
#   / `secrets.S3_BASE_PATH`. The secrets were used to gate the steps
#   (`if: env.S3_BUCKET != 'NOT_SET'`). When any secret was missing the
#   corresponding step was silently skipped, producing a blank
#   download-links panel in the GitHub run UI. Routing the read through
#   `ota_config.yaml` removes that silent failure mode.
#
# Secrets (inherited):
#   - AWS_ACCESS_KEY_ID: only used by `upload_to_s3.py` (not consumed here).
# ============================================================================

name: Shared Download Links Generation

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string for the release'
        required: true
        type: string
      environment:
        description: 'Target environment (development/test/staging/production)'
        required: true
        type: string
      channel:
        description: 'Release channel (dev/beta/stable)'
        required: true
        type: string
      user-prefix:
        description: >-
          Optional lowercase user prefix for per-user preview builds
          (e.g. 'songc' produces `songc_v<version>` S3 prefixes). When
          non-empty, the rendered URLs and S3 size probes target
          `<prefix>/releases/<user_prefix>_v<version>/...` to mirror
          where `upload_to_s3.py` actually wrote the artifacts. Must
          be empty for normal semver / branch builds.
        required: false
        type: string
        default: ''
      windows-build-result:
        description: 'Result of Windows build job (success/skipped/failure)'
        required: true
        type: string
      windows-direct-upload:
        description: >-
          When 'true', the Windows build job uploaded to S3 directly
          (the direct-upload fast path is in effect). In that case no
          `*-installer` artifact is in GHA artifact store; download-links
          synthesises the expected installer filename from `version` /
          `app-name` and lists the S3 URL without a size column.
        required: false
        type: boolean
        default: false
      app-name:
        description: >-
          The DIST_APP / installer prefix (e.g. 'eCan' for intl,
          'eCan.cn' for CN). Used to construct the installer filename
          when the build job took the direct-upload fast path and the
          `*-installer` artifact is absent.
        required: false
        type: string
        default: 'eCan'
      macos-build-result:
        description: 'Result of macOS build job (success/skipped/failure)'
        required: true
        type: string
      linux-result:
        description: 'Result of Linux build job (success/skipped/failure)'
        required: false
        type: string
        default: 'skipped'
      macos-built-amd64:
        description: 'Whether macOS amd64 artifacts were built in this run'
        required: false
        type: boolean
        default: true
      macos-built-aarch64:
        description: 'Whether macOS aarch64 artifacts were built in this run'
        required: false
        type: boolean
        default: true

jobs:
  generate-links:
    name: Generate Download Links
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'NOT_SET' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'NOT_SET' }}
      VERSION: ${{ inputs.version }}
      ENVIRONMENT: ${{ inputs.environment }}
      CHANNEL: ${{ inputs.channel }}
      USER_PREFIX:           ${{ inputs.user-prefix }}
      APP_NAME:                ${{ inputs.app-name }}
      WINDOWS_BUILD_RESULT:    ${{ inputs.windows-build-result }}
      MACOS_BUILD_RESULT:      ${{ inputs.macos-build-result }}
      LINUX_RESULT:            ${{ inputs.linux-result }}
      WINDOWS_DIRECT_UPLOAD:   ${{ inputs.windows-direct-upload && 'true' || 'false' }}
      MACOS_BUILT_AMD64:       ${{ inputs.macos-built-amd64 && 'true' || 'false' }}
      MACOS_BUILT_AARCH64:     ${{ inputs.macos-built-aarch64 && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # resolve_ota_bucket.py reads ota_config.yaml (pyyaml only).
          # No cloud SDK needed — no boto3, no cos-python-sdk-v5.
          cache-dependency-path: 'build_system/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r build_system/scripts/requirements.txt

      - name: Resolve OTA bucket from config
        id: resolve
        run: |
          # Read the bucket / region / prefix from ota/config/ota_config.yaml
          # — same source upload_to_s3.py reads — and export to env.
          #
          # Render-side variables (BUCKET_NAME / BUCKET_REGION) are the
          # ones render_download_links.py reads directly, so we re-export
          # them here too. They cannot live in jobs.<id>.env: because
          # GHA's schema lint resolves `env.X` against the static
          # job-env dict before any step runs, so a `BUCKET_NAME:
          # ${{ env.OTA_BUCKET }}` line there would always trip
          # "Unrecognized named-value: 'env'". Teeing the aliases into
          # $GITHUB_ENV lets the step-scoped env (and the Python
          # script) see them, and keeps `ota_config.yaml` as the
          # single source of truth on both sides.
          python3 build_system/scripts/resolve_ota_bucket.py \
            --app intl \
            --env "${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "BUCKET_NAME=${OTA_BUCKET}" >> "$GITHUB_ENV"
          echo "BUCKET_REGION=${OTA_REGION}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------------
      # Step Group 1: Download Artifacts
      # ------------------------------------------------------------------------
      - name: Download Windows artifacts
        if: inputs.windows-build-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET'
        uses: actions/download-artifact@v7
        with:
          name: eCan-windows-amd64-${{ inputs.version }}-installer
          path: windows-artifacts
        continue-on-error: true

      # Direct-upload fast path: when the build job uploaded to S3 directly
      # (no `*-installer` artifact in GHA artifact store), fall back to
      # synthesising the expected installer filename from `version` +
      # `app-name`. The bucket URL is still constructed from the same
      # `{prefix}/releases/v{ver}/...` template the upload script uses,
      # so the resulting link is byte-identical to what the
      # GHA-artifact-store path would have produced. We only lose the
      # file-size column (which is not authoritative anyway — the S3
      # object metadata is the source of truth).
      - name: Synthesize Windows installer filename (direct-upload fallback)
        if: >-
          inputs.windows-build-result == 'success' &&
          inputs.windows-direct-upload == true
        shell: bash
        env:
          VERSION:  ${{ inputs.version }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          mkdir -p windows-artifacts
          # build.py's installer filename template is
          # `<APP_NAME>-{version}-windows-amd64-Setup.exe` (see
          # build_system/ecan_build.py:installer_filename). Touch an
          # empty stub file with that name so the downstream
          # `for file in windows-artifacts/*.exe` loop finds it; the
          # Size column will be empty because we don't have the actual
          # file, which the loop already handles (`du -sh` returns
          # `0K` for an empty file).
          installer="${APP_NAME}-${VERSION}-windows-amd64-Setup.exe"
          : > "windows-artifacts/${installer}"
          echo "[INFO] Synthesized direct-upload fallback: ${installer}"


      - name: Download macOS amd64 artifacts
        if: inputs.macos-build-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET' && inputs.macos-built-amd64 == true
        uses: actions/download-artifact@v7
        with:
          name: eCan-macos-amd64-${{ inputs.version }}-installer
          path: macos-amd64-artifacts
        continue-on-error: true

      - name: Download macOS aarch64 artifacts
        if: inputs.macos-build-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET' && inputs.macos-built-aarch64 == true
        uses: actions/download-artifact@v7
        with:
          name: eCan-macos-aarch64-${{ inputs.version }}-installer
          path: macos-aarch64-artifacts
        continue-on-error: true

      - name: Download Linux artifacts
        if: inputs.linux-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET'
        uses: actions/download-artifact@v7
        with:
          name: eCan-linux-amd64-${{ inputs.version }}-installer
          path: linux-artifacts
        continue-on-error: true

      - name: Merge macOS artifacts
        if: inputs.macos-build-result == 'success'
        run: |
          mkdir -p macos-artifacts
          for d in macos-amd64-artifacts macos-aarch64-artifacts; do
            if [ -d "$d" ]; then
              cp "$d"/* macos-artifacts/ 2>/dev/null || true
            fi
          done

      # S3 mirror of the COS size-resolver step. The S3 HeadObject
      # response is cheaper than downloading the installer just to read
      # its byte count, and is authoritative for objects the build job
      # uploaded directly (bypassing the GHA artifact store). Failure
      # here is non-fatal: the renderer will fall back to local-file
      # sizes / "missing" markers.
      - name: Resolve S3 object sizes (direct-upload fallback)
        id: s3-sizes
        if: >-
          (inputs.windows-build-result == 'success' && inputs.windows-direct-upload == true)
        env:
          EXPECTED: >-
            windows/amd64/${{ inputs.app-name }}-${{ inputs.version }}-windows-amd64-Setup.exe
        run: |
          set -euo pipefail
          S3_PREFIX="${OTA_PREFIX}"
          case "${ENVIRONMENT}" in
            development) S3_PREFIX="${S3_PREFIX:-dev}" ;;
            test)        S3_PREFIX="${S3_PREFIX:-test}" ;;
            staging)     S3_PREFIX="${S3_PREFIX:-staging}" ;;
            production)  S3_PREFIX="${S3_PREFIX:-production}" ;;
            *)           S3_PREFIX="${S3_PREFIX:-${ENVIRONMENT}}" ;;
          esac
          # shellcheck disable=SC2086
          python3 build_system/scripts/resolve_s3_sizes.py \
            --bucket   "${OTA_BUCKET}" \
            --region   "${OTA_REGION}" \
            --env-prefix "${S3_PREFIX}" \
            --version  "${VERSION}" \
            --user-prefix "${USER_PREFIX}" \
            --expected ${EXPECTED} \
            --out      s3-sizes.env \
          || echo "[WARN] S3 size resolution failed; summary will show 'missing' for direct-uploaded rows." >&2
          echo "S3_SIZES_FILE=${GITHUB_WORKSPACE}/s3-sizes.env" >> "$GITHUB_ENV"

      - name: Render download links summary
        env:
          S3_SIZES_FILE: ${{ env.S3_SIZES_FILE }}
        run: |
          set -euo pipefail
          S3_PREFIX="${OTA_PREFIX}"
          case "${ENVIRONMENT}" in
            development) S3_PREFIX="${S3_PREFIX:-dev}" ;;
            test)        S3_PREFIX="${S3_PREFIX:-test}" ;;
            staging)     S3_PREFIX="${S3_PREFIX:-staging}" ;;
            production)  S3_PREFIX="${S3_PREFIX:-production}" ;;
            *)           S3_PREFIX="${S3_PREFIX:-${ENVIRONMENT}}" ;;
          esac

          python3 build_system/scripts/render_download_links.py \
            --scheme      s3 \
            --summary-out download-links-summary.md \
            --text-out    "download-links-${VERSION}.txt" \
            --url-pattern "https://{bucket}.s3.{region}.amazonaws.com/{env}/releases/v{ver}/{platform}/{arch}/{file} (also: https://{bucket}.s3-accelerate.amazonaws.com/...)" \
            --workflow-name "release-intl.yml / shared-download-links.yml"

      - name: Append Markdown summary to step summary
        if: always()
        run: |
          if [ -f download-links-summary.md ]; then
            cat download-links-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Download-links summary was not generated (renderer failed)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload download links document artifact
        uses: actions/upload-artifact@v6
        with:
          name: download-links-${{ inputs.version }}
          path: download-links-${{ inputs.version }}.txt
          if-no-files-found: warn
