# ============================================================================
# Reusable Workflow: Download Links Generation
# ============================================================================
# This reusable workflow generates user-friendly download links for release
# artifacts hosted on AWS S3. It creates both GitHub Actions Summary output
# and a downloadable text file with all URLs.
#
# Features:
#   - Generates download links for Windows and macOS installers
#   - Provides both standard and accelerated S3 URLs
#   - Creates GitHub Actions Summary with formatted links
#   - Generates downloadable text file with all URLs
#   - Supports architecture detection and labeling
#
# Bucket resolution (single source of truth):
#   The OTA bucket / region / prefix are resolved from `ota/config/ota_config.yaml`
#   by `build_system/scripts/resolve_ota_bucket.py`. This is the SAME source
#   that `upload_to_s3.py` reads, so the download-links summary can never
#   drift from where artifacts were actually uploaded.
#
#   Previously this workflow read `secrets.S3_BUCKET` / `secrets.AWS_REGION`
#   / `secrets.S3_BASE_PATH`. The secrets were used to gate the steps
#   (`if: env.S3_BUCKET != 'NOT_SET'`). When any secret was missing the
#   corresponding step was silently skipped, producing a blank
#   download-links panel in the GitHub run UI. Routing the read through
#   `ota_config.yaml` removes that silent failure mode.
#
# Secrets (inherited):
#   - AWS_ACCESS_KEY_ID: only used by `upload_to_s3.py` (not consumed here).
# ============================================================================

name: Shared Download Links Generation

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string for the release'
        required: true
        type: string
      environment:
        description: 'Target environment (development/test/staging/production)'
        required: true
        type: string
      channel:
        description: 'Release channel (dev/beta/stable)'
        required: true
        type: string
      windows-build-result:
        description: 'Result of Windows build job (success/skipped/failure)'
        required: true
        type: string
      macos-build-result:
        description: 'Result of macOS build job (success/skipped/failure)'
        required: true
        type: string
      linux-result:
        description: 'Result of Linux build job (success/skipped/failure)'
        required: false
        type: string
        default: 'skipped'
      macos-built-amd64:
        description: 'Whether macOS amd64 artifacts were built in this run'
        required: false
        type: boolean
        default: true
      macos-built-aarch64:
        description: 'Whether macOS aarch64 artifacts were built in this run'
        required: false
        type: boolean
        default: true

jobs:
  generate-links:
    name: Generate Download Links
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'NOT_SET' }}
      VERSION: ${{ inputs.version }}
      ENVIRONMENT: ${{ inputs.environment }}
      CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # resolve_ota_bucket.py reads ota_config.yaml (pyyaml only).
          # No cloud SDK needed — no boto3, no cos-python-sdk-v5.
          cache-dependency-path: 'build_system/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r build_system/scripts/requirements.txt

      - name: Resolve OTA bucket from config
        id: resolve
        run: |
          # Read the bucket / region / prefix from ota/config/ota_config.yaml
          # — same source upload_to_s3.py reads — and export to env.
          python3 build_system/scripts/resolve_ota_bucket.py \
            --app intl \
            --env "${ENVIRONMENT}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------------
      # Step Group 1: Download Artifacts
      # ------------------------------------------------------------------------
      - name: Download Windows artifacts
        if: inputs.windows-build-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET'
        uses: actions/download-artifact@v7
        with:
          name: eCan-windows-amd64-${{ inputs.version }}-installer
          path: windows-artifacts
        continue-on-error: true

      - name: Download macOS amd64 artifacts
        if: inputs.macos-build-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET' && inputs.macos-built-amd64 == true
        uses: actions/download-artifact@v7
        with:
          name: eCan-macos-amd64-${{ inputs.version }}-installer
          path: macos-amd64-artifacts
        continue-on-error: true

      - name: Download macOS aarch64 artifacts
        if: inputs.macos-build-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET' && inputs.macos-built-aarch64 == true
        uses: actions/download-artifact@v7
        with:
          name: eCan-macos-aarch64-${{ inputs.version }}-installer
          path: macos-aarch64-artifacts
        continue-on-error: true

      - name: Download Linux artifacts
        if: inputs.linux-result == 'success' && env.AWS_ACCESS_KEY_ID != 'NOT_SET'
        uses: actions/download-artifact@v7
        with:
          name: eCan-linux-amd64-${{ inputs.version }}-installer
          path: linux-artifacts
        continue-on-error: true

      - name: Merge macOS artifacts
        if: inputs.macos-build-result == 'success'
        run: |
          mkdir -p macos-artifacts
          for d in macos-amd64-artifacts macos-aarch64-artifacts; do
            if [ -d "$d" ]; then
              cp "$d"/* macos-artifacts/ 2>/dev/null || true
            fi
          done

      # ------------------------------------------------------------------------
      # Step Group 2: Generate GitHub Actions Summary
      # ------------------------------------------------------------------------
      - name: Generate S3 download links summary
        env:
          BUCKET_NAME: ${{ env.OTA_BUCKET }}
          BUCKET_REGION: ${{ env.OTA_REGION }}
        run: |
          echo "=== Generating S3 Download Links ==="
          echo ""

          # Map environment to S3 prefix (mirrors the s3_prefix field in
          # ota_config.yaml; resolve_ota_bucket.py already exported it as
          # OTA_PREFIX, but we keep the case here as a defensive fallback).
          S3_PREFIX="${OTA_PREFIX}"
          case "${ENVIRONMENT}" in
            development) S3_PREFIX="${S3_PREFIX:-dev}" ;;
            test)        S3_PREFIX="${S3_PREFIX:-test}" ;;
            staging)     S3_PREFIX="${S3_PREFIX:-staging}" ;;
            production)  S3_PREFIX="${S3_PREFIX:-production}" ;;
            *)           S3_PREFIX="${S3_PREFIX:-${ENVIRONMENT}}" ;;
          esac
          
          echo "Environment: ${ENVIRONMENT}"
          echo "Channel: ${CHANNEL}"
          echo "S3 Prefix: ${S3_PREFIX}"
          echo ""
          
          # Display in GitHub Actions Summary
          echo "## 📦 Download Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${VERSION}**" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **${ENVIRONMENT}**" >> $GITHUB_STEP_SUMMARY
          echo "Channel: **${CHANNEL}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Windows Installers
          echo "### Windows Installers (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "windows-artifacts" ] && [ "$(ls -A windows-artifacts 2>/dev/null)" ]; then
            for file in windows-artifacts/*.exe windows-artifacts/*.msi; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                size=$(du -sh "$file" | cut -f1)
                
                # Standard S3 URL with environment prefix
                standard_url="https://${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/windows/amd64/${filename}"
                
                # S3 Transfer Acceleration URL
                accelerate_url="https://${BUCKET_NAME}.s3-accelerate.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/windows/amd64/${filename}"
                
                echo "#### ${filename}" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "- **Size**: ${size}" >> $GITHUB_STEP_SUMMARY
                echo "- **Standard URL**: [Download](${standard_url})" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "  ${standard_url}" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "- **Accelerated URL** (faster for global users): [Download](${accelerate_url})" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "  ${accelerate_url}" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "_No Windows installers available_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # macOS Installers
          echo "### macOS Installers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "macos-artifacts" ] && [ "$(ls -A macos-artifacts 2>/dev/null)" ]; then
            for file in macos-artifacts/*.pkg macos-artifacts/*.zip; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                size=$(du -sh "$file" | cut -f1)
                
                # Determine architecture from filename
                if [[ "$filename" == *"amd64"* ]] || [[ "$filename" == *"x86_64"* ]]; then
                  arch_label="Intel (x86_64)"
                  arch_path="amd64"
                elif [[ "$filename" == *"aarch64"* ]]; then
                  arch_label="Apple Silicon (ARM64)"
                  arch_path="aarch64"
                else
                  arch_label="Universal"
                  arch_path="universal"
                fi
                
                # Standard S3 URL with environment prefix
                standard_url="https://${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/macos/${arch_path}/${filename}"
                
                # S3 Transfer Acceleration URL
                accelerate_url="https://${BUCKET_NAME}.s3-accelerate.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/macos/${arch_path}/${filename}"
                
                echo "#### ${filename}" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "- **Architecture**: ${arch_label}" >> $GITHUB_STEP_SUMMARY
                echo "- **Size**: ${size}" >> $GITHUB_STEP_SUMMARY
                echo "- **Standard URL**: [Download](${standard_url})" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "  ${standard_url}" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "- **Accelerated URL** (faster for global users): [Download](${accelerate_url})" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "  ${accelerate_url}" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "_No macOS installers available_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Linux Packages
          echo "### Linux Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "linux-artifacts" ] && [ "$(ls -A linux-artifacts 2>/dev/null)" ]; then
            for file in linux-artifacts/*.AppImage linux-artifacts/*.deb; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                size=$(du -sh "$file" | cut -f1)
                
                # Determine architecture from filename
                if [[ "$filename" == *"aarch64"* ]] || [[ "$filename" == *"arm64"* ]]; then
                  arch_label="ARM64"
                  arch_path="aarch64"
                else
                  arch_label="x86_64"
                  arch_path="amd64"
                fi
                
                # Determine package type
                if [[ "$filename" == *.AppImage ]]; then
                  pkg_type="AppImage"
                elif [[ "$filename" == *.deb ]]; then
                  pkg_type="DEB Package"
                else
                  pkg_type="Package"
                fi
                
                # Standard S3 URL with environment prefix
                standard_url="https://${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/linux/${arch_path}/${filename}"
                
                # S3 Transfer Acceleration URL
                accelerate_url="https://${BUCKET_NAME}.s3-accelerate.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/linux/${arch_path}/${filename}"
                
                echo "#### ${filename}" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "- **Type**: ${pkg_type}" >> $GITHUB_STEP_SUMMARY
                echo "- **Architecture**: ${arch_label}" >> $GITHUB_STEP_SUMMARY
                echo "- **Size**: ${size}" >> $GITHUB_STEP_SUMMARY
                echo "- **Standard URL**: [Download](${standard_url})" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "  ${standard_url}" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "- **Accelerated URL** (faster for global users): [Download](${accelerate_url})" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "  ${accelerate_url}" >> $GITHUB_STEP_SUMMARY
                echo "  \`\`\`" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "_No Linux packages available_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Documentation section
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Download Information" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### URL Types" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Standard URL**: Direct S3 access from the bucket's region" >> $GITHUB_STEP_SUMMARY
          echo "  - Best for: Users in the same AWS region" >> $GITHUB_STEP_SUMMARY
          echo "  - Format: \`https://{bucket}.s3.{region}.amazonaws.com/{path}/{file}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Accelerated URL**: Uses AWS S3 Transfer Acceleration" >> $GITHUB_STEP_SUMMARY
          echo "  - Best for: Global users, faster downloads worldwide" >> $GITHUB_STEP_SUMMARY
          echo "  - Format: \`https://{bucket}.s3-accelerate.amazonaws.com/{path}/{file}\`" >> $GITHUB_STEP_SUMMARY
          echo "  - Requires: Transfer Acceleration enabled on S3 bucket" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Platform Support" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows**: x86_64 (64-bit) only" >> $GITHUB_STEP_SUMMARY
          echo "  - \`.exe\`: Inno Setup installer (recommended)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`.msi\`: Windows Installer package" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS**: Intel and Apple Silicon" >> $GITHUB_STEP_SUMMARY
          echo "  - \`amd64\`: Intel processors (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`aarch64\`: Apple Silicon (M1/M2/M3)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux**: x86_64 (64-bit)" >> $GITHUB_STEP_SUMMARY
          echo "  - \`.deb\`: Debian/Ubuntu package (recommended)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------------
      # Step Group 3: Generate Text File
      # ------------------------------------------------------------------------
      - name: Generate download links text artifact
        env:
          BUCKET_NAME: ${{ env.OTA_BUCKET }}
          BUCKET_REGION: ${{ env.OTA_REGION }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="download-links-${VERSION}.txt"

          # Map environment to S3 prefix (mirrors the s3_prefix field in
          # ota_config.yaml; resolve_ota_bucket.py already exported it as
          # OTA_PREFIX, but we keep the case here as a defensive fallback).
          S3_PREFIX="${OTA_PREFIX}"
          case "${ENVIRONMENT}" in
            development) S3_PREFIX="${S3_PREFIX:-dev}" ;;
            test)        S3_PREFIX="${S3_PREFIX:-test}" ;;
            staging)     S3_PREFIX="${S3_PREFIX:-staging}" ;;
            production)  S3_PREFIX="${S3_PREFIX:-production}" ;;
            *)           S3_PREFIX="${S3_PREFIX:-${ENVIRONMENT}}" ;;
          esac

          echo "eCan Download Links" > "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"
          echo "Version: ${VERSION}" >> "$OUTPUT_FILE"
          echo "Environment: ${ENVIRONMENT}" >> "$OUTPUT_FILE"
          echo "Channel: ${CHANNEL}" >> "$OUTPUT_FILE"
          echo "" >> "$OUTPUT_FILE"

          # Windows section
          if [ -d "windows-artifacts" ] && [ "$(ls -A windows-artifacts 2>/dev/null)" ]; then
            echo "[Windows]" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"

            for file in windows-artifacts/*.exe windows-artifacts/*.msi; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                size=$(du -sh "$file" | cut -f1)
                standard_url="https://${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/windows/amd64/${filename}"
                accelerate_url="https://${BUCKET_NAME}.s3-accelerate.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/windows/amd64/${filename}"

                echo "${filename}" >> "$OUTPUT_FILE"
                echo "  Size:       ${size}" >> "$OUTPUT_FILE"
                echo "  Standard:   ${standard_url}" >> "$OUTPUT_FILE"
                echo "  Accelerate: ${accelerate_url}" >> "$OUTPUT_FILE"
                echo "" >> "$OUTPUT_FILE"
              fi
            done
            echo "" >> "$OUTPUT_FILE"
          else
            echo "[Windows]" >> "$OUTPUT_FILE"
            echo "  No Windows installers available" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
          fi

          # macOS section
          if [ -d "macos-artifacts" ] && [ "$(ls -A macos-artifacts 2>/dev/null)" ]; then
            echo "[macOS]" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"

            for file in macos-artifacts/*.pkg macos-artifacts/*.zip; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                size=$(du -sh "$file" | cut -f1)
                if [[ "$filename" == *"amd64"* ]] || [[ "$filename" == *"x86_64"* ]]; then
                  arch_label="Intel (x86_64)"
                  arch_path="amd64"
                elif [[ "$filename" == *"aarch64"* ]]; then
                  arch_label="Apple Silicon (ARM64)"
                  arch_path="aarch64"
                else
                  arch_label="Universal"
                  arch_path="universal"
                fi

                standard_url="https://${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/macos/${arch_path}/${filename}"
                accelerate_url="https://${BUCKET_NAME}.s3-accelerate.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/macos/${arch_path}/${filename}"

                echo "${filename}" >> "$OUTPUT_FILE"
                echo "  Arch:       ${arch_label}" >> "$OUTPUT_FILE"
                echo "  Size:       ${size}" >> "$OUTPUT_FILE"
                echo "  Standard:   ${standard_url}" >> "$OUTPUT_FILE"
                echo "  Accelerate: ${accelerate_url}" >> "$OUTPUT_FILE"
                echo "" >> "$OUTPUT_FILE"
              fi
            done
            echo "" >> "$OUTPUT_FILE"
          else
            echo "[macOS]" >> "$OUTPUT_FILE"
            echo "  No macOS installers available" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
          fi

          # Linux section
          if [ -d "linux-artifacts" ] && [ "$(ls -A linux-artifacts 2>/dev/null)" ]; then
            echo "[Linux]" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"

            for file in linux-artifacts/*.AppImage linux-artifacts/*.deb; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                size=$(du -sh "$file" | cut -f1)
                if [[ "$filename" == *"aarch64"* ]] || [[ "$filename" == *"arm64"* ]]; then
                  arch_label="ARM64"
                  arch_path="aarch64"
                else
                  arch_label="x86_64"
                  arch_path="amd64"
                fi
                
                if [[ "$filename" == *.AppImage ]]; then
                  pkg_type="AppImage"
                elif [[ "$filename" == *.deb ]]; then
                  pkg_type="DEB Package"
                else
                  pkg_type="Package"
                fi

                standard_url="https://${BUCKET_NAME}.s3.${BUCKET_REGION}.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/linux/${arch_path}/${filename}"
                accelerate_url="https://${BUCKET_NAME}.s3-accelerate.amazonaws.com/${S3_PREFIX}/releases/v${VERSION}/linux/${arch_path}/${filename}"

                echo "${filename}" >> "$OUTPUT_FILE"
                echo "  Type:       ${pkg_type}" >> "$OUTPUT_FILE"
                echo "  Arch:       ${arch_label}" >> "$OUTPUT_FILE"
                echo "  Size:       ${size}" >> "$OUTPUT_FILE"
                echo "  Standard:   ${standard_url}" >> "$OUTPUT_FILE"
                echo "  Accelerate: ${accelerate_url}" >> "$OUTPUT_FILE"
                echo "" >> "$OUTPUT_FILE"
              fi
            done
            echo "" >> "$OUTPUT_FILE"
          else
            echo "[Linux]" >> "$OUTPUT_FILE"
            echo "  No Linux packages available" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
          fi

          echo "---" >> "$OUTPUT_FILE"
          echo "This file contains all download URLs for this build." >> "$OUTPUT_FILE"
          echo "Generated by the release workflow at $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$OUTPUT_FILE"

          echo "Download links document generated: ${OUTPUT_FILE}"

      - name: Upload download links document artifact
        uses: actions/upload-artifact@v6
        with:
          name: download-links-${{ inputs.version }}
          path: download-links-${{ inputs.version }}.txt
          if-no-files-found: warn
