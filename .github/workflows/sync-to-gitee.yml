# ============================================================================
# GitHub Actions Workflow: Auto-sync GitHub → Gitee (incremental)
# ============================================================================
#
# Maintains a real-time mirror of this repository at
#   https://gitee.com/songszchen/eCan.ai
#
# Strategy: incremental fetch + selective push.
#
#   push  ─►  actions/cache restores last-run bare clone (~431MB pack)
#           ─►  git fetch --prune origin          (Δ objects only)
#           ─►  git push --mirror --force --prune --tags (refs only)
#
# Compared to a full `git clone --bare` on every run, this is:
#   * First run:        ~35s clone + push  (no cache yet)
#   * Subsequent runs:  ~3-8s fetch + push  (cache hit, only new commits)
#   * Cache miss:       ~35s (re-clone; cache is keyed by lockfile SHA)
#
# Compared to `Yikun/hub-mirror-action`, this workflow removes:
#   * `docker build` cold-start (~40s)
#   * `pip install` cold-start (~11s)
#   * Third-party supply-chain dependency
#
# No external services are used. The cache lives in GitHub's own
# artifact storage and is bounded (~2GB per repo free).
#
# Required GitHub repository secrets (Settings → Secrets and variables
# → Actions → New repository secret):
#
#   * GITEE_TOKEN — a Gitee **private access token** (Gitee → Settings →
#     Personal access tokens → Generate new token; **required scopes**:
#     `projects`, `pull_requests`, `issues`). The `projects` scope is
#     what the workflow uses to auto-create the mirror repo on first
#     run (see step "Ensure Gitee mirror exists"). Pasting the token
#     into the remote URL as `https://oauth2:${TOKEN}@gitee.com/...`
#     authenticates `git push` without any SSH key plumbing.
#
#     Generate one at:
#       https://gitee.com/profile/personal_access_tokens
#     Then copy the token into:
#       https://github.com/scszcoder/eCan.ai/settings/secrets/actions
#       → New repository secret → name: GITEE_TOKEN → value: <token>.
#
#   * (deprecated) GITEE_SSH_KEY — older revisions used an SSH keypair
#     for `git@gitee.com:...`. The HTTPS path is simpler (no ssh-agent,
#     no known_hosts, no BOM-stripping) and is the path the rest of
#     this org uses (see release-cn.yml, which also authenticates
#     to Gitee via GITEE_TOKEN). The SSH key, if still configured,
#     is now ignored.
# ============================================================================

name: Sync to Gitee

# Cancel-in-progress is OFF. Incremental runs are fast (~3-8s on
# cache hit); queueing two is cheaper than killing an in-flight push,
# which can leave Gitee with a partially-updated ref set.
concurrency:
  group: sync-to-gitee
  cancel-in-progress: false

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  schedule:
    # Every 6 hours. Safety net for:
    #   * cache eviction (GitHub LRU-evicts action caches ~7d unused)
    #   * Gitee-side ref drift from a transient 5xx during push
    #   * force-push races where the push event raced Actions
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Mirror GitHub → Gitee
    runs-on: ubuntu-latest
    # Only clones the source repo (read) and pushes to Gitee via
    # HTTPS + GITEE_TOKEN. No write to this repo.
    permissions:
      contents: read
    env:
      SRC_REPO: 'https://github.com/${{ github.repository }}.git'
      # Gitee HTTPS push URL is set per-push by the sync step (no
      # token embedded; auth goes through a temporary `GIT_ASKPASS`
      # helper that reads `$GITEE_TOKEN` directly from the env
      # where GitHub Actions has it masked).
    steps:
      - name: Validate Gitee credentials
        # Diagnostic guard for the 'could not read Username for
        # https://gitee.com' / 'authentication failed' / 'terminal
        # prompts disabled' failures. If GITEE_TOKEN is unset, the
        # push step below silently asks for credentials via the
        # terminal — which is disabled in CI — and fails with an
        # opaque exit-128. This step fails earlier with a precise
        # message pointing at Settings → Secrets → GITEE_TOKEN.
        #
        # Same pattern as release-cn.yml's 'Validate Gitee
        # credentials' steps; kept consistent so operators see one
        # uniform diagnostic surface.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::secrets.GITEE_TOKEN is empty or unset. The sync-to-gitee workflow pushes to https://gitee.com/songszchen/eCan.ai.git via HTTPS Basic auth (username 'oauth2', password = the token), which requires a valid Gitee private access token. Configure it at https://github.com/scszcoder/eCan.ai/settings/secrets/actions → New repository secret → name: GITEE_TOKEN → value: <token from https://gitee.com/profile/personal_access_tokens>. Without it, git push fails with 'fatal: could not read Username for https://gitee.com: terminal prompts disabled' — the very symptom this step is meant to replace."
            exit 1
          fi
          TOKEN_LEN=$(printf '%s' "$GITEE_TOKEN" | wc -c | tr -d ' ')
          echo "[OK] GITEE_TOKEN present (length=${TOKEN_LEN} bytes)"

      - name: Ensure Gitee mirror exists
        # Auto-bootstrap: if the Gitee mirror doesn't exist yet
        # (HTTP 404 from /api/v5/repos/...), create it via
        # POST /api/v5/user/repos with `name=eCan.ai`, then wait a
        # few seconds for Gitee's Git backend to provision before
        # the push step hits it. Idempotent: a 422 "name has already
        # been taken" on the second run is treated as success (a
        # race with a previous bootstrap).
        #
        # Why: sync-to-gitee is a self-healing pipeline. The mirror
        # is a 1:1 copy of this repo; the workflow should not
        # require an out-of-band "go create the Gitee repo" step
        # before the first push can ever happen. release-cn.yml
        # *also* depends on this repo existing, so creating it
        # here unlocks both workflows at once.
        #
        # Required scope: `projects` (personal access token). If the
        # operator's GITEE_TOKEN was generated without that scope,
        # this step fails with a precise diagnostic pointing at the
        # scope to enable on the next token.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: songszchen
          GITEE_REPO: eCan.ai
        run: |
          set -euo pipefail

          PROBE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}")
          if [ "$PROBE" = "200" ]; then
            echo "[OK] Gitee mirror already exists"
            exit 0
          fi

          echo "[INFO] Mirror not found (HTTP $PROBE). Attempting bootstrap create."
          CREATE=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${GITEE_REPO}\",\"description\":\"Mirror of github.com/${GITHUB_REPOSITORY} (auto-synced by sync-to-gitee.yml)\",\"private\":true,\"has_issues\":false,\"has_wiki\":false}" \
            "https://gitee.com/api/v5/user/repos")

          case "$CREATE" in
            201)
              echo "[OK] Created Gitee mirror ${GITEE_OWNER}/${GITEE_REPO}"
              # Gitee's Git backend needs a brief moment to finish
              # provisioning before the first push can land. 5s is
              # empirically enough; if the push below fails with
              # "repository not found", this gap is the likely
              # culprit and should be widened.
              sleep 5
              ;;
            422)
              # Race: someone (or a previous run that we lost the
              # idempotency race to) created it between the probe
              # and the create. Acceptable.
              echo "[OK] Race lost — mirror exists now"
              ;;
            401)
              echo "::error::GITEE_TOKEN is unauthorized to create repositories on this account. The token needs scope 'projects' enabled. Regenerate at https://gitee.com/profile/personal_access_tokens with 'projects' checked, then update the GitHub secret."
              cat /tmp/create.json
              exit 1
              ;;
            *)
              echo "::error::Failed to create Gitee mirror ${GITEE_OWNER}/${GITEE_REPO}: HTTP $CREATE"
              cat /tmp/create.json
              exit 1
              ;;
          esac

      - name: Restore cached bare clone
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eCan.ai.git
          # Single shared cache key per repo. Rationale:
          #   * eCan.ai has ~27 master commits/day. Per-commit cache
          #     keys would write ~200 versions/week, blowing past
          #     GitHub's 10GB cache ceiling and causing LRU thrashing.
          #   * A repo-wide key yields 1 active version per repo at
          #     a time. Even if 5 old versions linger in storage
          #     before eviction, worst case is ~5GB used.
          #   * `restore-keys` (empty value) acts as a wildcard,
          #     restoring any older version if the latest is missing
          #     or evicted. `git fetch --prune` then catches up the
          #     delta regardless of which snapshot we restored.
          #
          # Trade-off: every run overwrites the cache. Cache-restore
          # on the next run still finds a fresh-enough version to
          # skip the 30s clone and only do the ~3-8s fetch.
          key: bare-clone-${{ github.repository }}
          restore-keys: |
            bare-clone-${{ github.repository }}-

      - name: Incremental fetch + sync
        env:
          CACHE_DIR: ${{ runner.temp }}/eCan.ai.git
          # GITEE_TOKEN is also exposed via env so the credential
          # helper below can read it without ever putting the raw
          # token into the remote URL (which would leak it into
          # `git push --verbose` / `ps` listings if any sub-step
          # ever inspected the URL).
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Ensure we have a bare clone. Cache miss → fresh clone
          #    (~35s for 431MB pack). Cache hit → `cd` into restored
          #    directory and skip this branch entirely.
          if [ ! -d "$CACHE_DIR" ]; then
            echo "Cache miss: full clone" >&2
            git clone --bare "$SRC_REPO" "$CACHE_DIR"
          else
            echo "Cache hit: incremental fetch" >&2
          fi
          cd "$CACHE_DIR"

          # 2. Always fetch latest + prune deleted refs. Cheap on
          #    cache hit (Δ objects only); effectively a no-op
          #    when source hasn't moved since last push.
          git fetch --prune --tags origin

          # 3. Re-target the push remote to Gitee (without embedding
          #    the token into the URL). Auth happens via a temporary
          #    credential helper that returns the username/password
          #    pair git asks for when it connects. The token still
          #    lives in $GITEE_TOKEN (masked by GitHub Actions) and
          #    is never written to the remote URL on disk or in
          #    `git remote -v` output.
          git remote set-url --push origin 'https://gitee.com/songszchen/eCan.ai.git'

          # Inline credential helper: when git asks for credentials
          # for gitee.com, return the token as the password.
          GIT_ASKPASS=$(mktemp)
          cat > "$GIT_ASKPASS" <<'EOF'
          #!/bin/sh
          case "$1" in
            Username*) echo 'oauth2' ;;
            Password*) printf '%s' "$GITEE_TOKEN" ;;
            *) echo ;;
          esac
          EOF
          chmod 700 "$GIT_ASKPASS"

          # 4. Mirror-push every ref with --force. `--mirror` is
          #    shorthand for `--tags --prune --prune-tags
          #    --force refs/*:refs/*`, so we must not pass those
          #    flags explicitly (git rejects the combination).
          #    `--force` is redundant under --mirror but kept for
          #    defense-in-depth reading.
          #
          #    `git push --mirror` only sends ref updates; it does
          #    not re-send objects (objects already exist on Gitee
          #    from prior syncs). So even with --force, this is
          #    cheap on cache hit.
          GIT_ASKPASS="$GIT_ASKPASS" git push \
            --mirror \
            --force

          rm -f "$GIT_ASKPASS"