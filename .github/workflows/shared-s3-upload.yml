# ============================================================================
# Reusable Workflow: S3 Upload (Single Bucket Design)
# ============================================================================
# This workflow uploads build artifacts to S3 using the single bucket design
# with environment-based path prefixes.
#
# Path Structure:
#   s3://ecan-updates/{environment}/releases/v{version}/{platform}/{arch}/
#
# Usage:
#   jobs:
#     upload:
#       uses: ./.github/workflows/shared-s3-upload-v2.yml
#       with:
#         version: "1.0.0"
#         environment: "production"
#       secrets: inherit
# ============================================================================

name: S3 Upload (Single Bucket)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g., 1.0.0, 1.0.0-rc.1)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev/test/staging/production)'
        required: true
        type: string
      user-prefix:
        description: |
          Optional per-user release prefix (lowercase). When non-empty, the
          upload script lays the S3 directory out as
          `releases/<prefix>_v<version>/...` instead of the default
          `releases/v<version>/...`. Used for user-targeted preview builds
          (see ota/docs/multi_version_picker.md).
        required: false
        type: string
        default: ''
      windows-build-result:
        description: 'Result of Windows build job'
        required: false
        type: string
        default: 'success'
      macos-build-result:
        description: 'Result of macOS build job'
        required: false
        type: string
        default: 'success'
      linux-build-result:
        description: 'Result of Linux build job'
        required: false
        type: string
        default: 'success'
    outputs:
      upload-success:
        description: 'Whether upload was successful'
        value: ${{ jobs.upload.outputs.success }}

jobs:
  upload:
    name: Upload to S3 (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.upload.outputs.success }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'build_system/scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_system/scripts/requirements.txt
      
      - name: Download all artifacts for S3 transfer
        uses: actions/download-artifact@v7
        with:
          pattern: '*-s3-transfer'
          path: dist/
          merge-multiple: true
      
      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -lh dist/ || echo "No artifacts found"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      
      - name: Upload to S3
        id: upload
        # Tolerate upload failures: when S3 is unreachable or auth is
        # expired, the build artifacts are still safely in GHA's
        # artifact store from the build jobs' `actions/upload-artifact`
        # step, so we want the caller to surface a GHA-artifact
        # fallback download URL instead of hard-failing the whole
        # release. We DO record the actual outcome in the `success`
        # output so downstream jobs (appcast generation, download-
        # links, latest.json) can still gate on whether the public
        # CDN actually got the files.
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          USER_PREFIX: ${{ inputs.user-prefix }}
        run: |
          echo "=== Uploading to S3 ==="
          echo "Version: $VERSION"
          echo "Environment: $ENVIRONMENT"
          echo "User Prefix: ${USER_PREFIX:-<none>}"

          # Build optional --user-prefix arg only when set so existing
          # semver tags hit the exact same code path they always have.
          PREFIX_ARG=()
          if [ -n "$USER_PREFIX" ]; then
            PREFIX_ARG=(--user-prefix "$USER_PREFIX")
          fi

          python3 build_system/scripts/upload_to_s3.py \
            --version "$VERSION" \
            --env "$ENVIRONMENT" \
            "${PREFIX_ARG[@]}"

          rc=$?
          if [ $rc -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            # S3 upload failed (auth error, network, SDK error, etc.).
            # With continue-on-error set above, the caller job will
            # still report success at the job level — but we record
            # the real outcome so downstream jobs (appcast,
            # download-links, latest.json) can gate on whether the
            # public CDN actually has the files.
            echo "::warning::S3 upload failed (rc=$rc); falling back to GHA artifact URLs. See previous logs."
            echo "success=false" >> $GITHUB_OUTPUT
            # Note: with continue-on-error, the step is allowed to exit
            # non-zero without failing the job, but we deliberately
            # exit 0 here so the step itself reports green and the
            # `success=false` output is what callers check.
            exit 0
          fi
