# ============================================================================
# Reusable Workflow: S3 Upload (Single Bucket Design)
# ============================================================================
# This workflow uploads build artifacts to S3 using the single bucket design
# with environment-based path prefixes.
#
# Path Structure:
#   s3://ecan-updates/{environment}/releases/v{version}/{platform}/{arch}/
#
# Usage:
#   jobs:
#     upload:
#       uses: ./.github/workflows/shared-s3-upload-v2.yml
#       with:
#         version: "1.0.0"
#         environment: "production"
#       secrets: inherit
# ============================================================================

name: S3 Upload (Single Bucket)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g., 1.0.0, 1.0.0-rc.1)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev/test/staging/production)'
        required: true
        type: string
      user-prefix:
        description: |
          Optional per-user release prefix (lowercase). When non-empty, the
          upload script lays the S3 directory out as
          `releases/<prefix>_v<version>/...` instead of the default
          `releases/v<version>/...`. Used for user-targeted preview builds
          (see ota/docs/multi_version_picker.md).
        required: false
        type: string
        default: ''
      windows-build-result:
        description: 'Result of Windows build job'
        required: false
        type: string
        default: 'success'
      macos-build-result:
        description: 'Result of macOS build job'
        required: false
        type: string
        default: 'success'
      linux-build-result:
        description: 'Result of Linux build job'
        required: false
        type: string
        default: 'success'
    outputs:
      upload-success:
        description: 'Whether upload was successful'
        value: ${{ jobs.upload.outputs.success }}

jobs:
  upload:
    name: Upload to S3 (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.upload.outputs.success }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'build_system/scripts/requirements.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_system/scripts/requirements.txt
      
      - name: Download all artifacts for S3 transfer
        uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: dist/
          merge-multiple: true
      
      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -lh dist/ || echo "No artifacts found"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      
      - name: Upload to S3
        id: upload
        # Tolerate upload failures: when S3 is unreachable or auth is
        # expired, the build artifacts are still safely in GHA's
        # artifact store from the build jobs' `actions/upload-artifact`
        # step, so we want the caller to surface a GHA-artifact
        # fallback download URL instead of hard-failing the whole
        # release. We DO record the actual outcome in the `success`
        # output so downstream jobs (appcast generation, download-
        # links, latest.json) can still gate on whether the public
        # CDN actually got the files.
        #
        # Two exit-code tiers from upload_to_s3.py:
        #   rc=2  hard precondition failure (missing dist, no
        #         artifacts matched). Every build job either failed
        #         or produced no installable artifacts before we
        #         even got a chance to upload. The wrapper renders
        #         this as a red `::error::` annotation so the
        #         failure is visible in the GitHub UI rather than
        #         buried under a yellow warning.
        #   rc=1  soft runtime failure (S3 unreachable, auth
        #         expired, SDK error). Downstream problem — the
        #         build itself is fine, the CDN is just unhappy.
        #         The wrapper turns this into a `::warning::` plus
        #         a GHA artifact fallback URL.
        # `continue-on-error: true` covers both tiers so the job
        # itself still reports success and the downstream
        # `print-gha-fallback-downloads` job can run; the
        # `success` output is what callers actually check.
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          USER_PREFIX: ${{ inputs.user-prefix }}
        run: |
          echo "=== Uploading to S3 ==="
          echo "Version: $VERSION"
          echo "Environment: $ENVIRONMENT"
          echo "User Prefix: ${USER_PREFIX:-<none>}"

          # Build optional --user-prefix arg only when set so existing
          # semver tags hit the exact same code path they always have.
          PREFIX_ARG=()
          if [ -n "$USER_PREFIX" ]; then
            PREFIX_ARG=(--user-prefix "$USER_PREFIX")
          fi

          # Initialize rc so the success path captures rc=0 cleanly.
          # Under `set -e`, `|| rc=$?` only fires on failure — on
          # success, rc would otherwise be unset (empty), and the
          # `[ $rc -eq 0 ]` test below would fail with "[: -eq:
          # unary operator expected" and fall through into the
          # warning branch, mis-classifying a successful upload as
          # a soft runtime failure (log #86724325753). Initializing
          # to 0 keeps the test deterministic.
          rc=0
          python3 build_system/scripts/upload_to_s3.py \
            --version "$VERSION" \
            --env "$ENVIRONMENT" \
            "${PREFIX_ARG[@]}" || rc=$?
          # The `|| rc=$?` is load-bearing. GitHub Actions' default bash
          # runs with `-e` (`shell: /usr/bin/bash -e {0}`). Under `-e`,
          # `python3 ...` returning non-zero immediately terminates the
          # step before `rc=$?` ever runs — meaning `success=false`
          # never reaches $GITHUB_OUTPUT, downstream jobs see an empty
          # output instead of "false", and the Final Status Summary
          # prints a blank `S3 upload:` line. Putting the rc-capture
          # on the right side of `||` makes the right-hand command a
          # success (assignments always succeed), which suppresses the
          # errexit propagation. Without this guard, every rc=2
          # upload_from_s3.py exit is invisible to the workflow.
          # See CLAUDE.md §7 for the regression history.

          if [ "$rc" -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          elif [ "$rc" -eq 2 ]; then
            # Hard precondition failure — the upstream pipeline is
            # broken (no dist, no artifacts). Emit a red `::error::`
            # annotation so the GitHub UI shows a red X on this step
            # even though `continue-on-error: true` keeps the job
            # itself green for the fallback download job.
            #
            # We deliberately exit 1 here (not 0) so the step logs
            # carry a non-zero exit code alongside the `::error::`
            # annotation. With `continue-on-error: true`, that exit-1
            # does NOT fail the job — it just makes the step page
            # visibly red in the UI, which is exactly what the user
            # expects when build artifacts are missing.
            echo "::error::S3 upload aborted: hard precondition failure (missing dist directory or no artifacts matched). This is an upstream build job problem, not an S3 outage — investigate the build-* jobs above. The release will fall back to GHA artifact URLs."
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          else
            # Soft runtime failure (rc=1 or any other non-zero). The
            # build artifacts are fine; S3 is just unhappy. Warn
            # visibly and fall back to GHA artifact URLs.
            echo "::warning::S3 upload failed (rc=$rc); falling back to GHA artifact URLs. See previous logs."
            echo "success=false" >> $GITHUB_OUTPUT
            # Note: with continue-on-error, the step is allowed to exit
            # non-zero without failing the job, but we deliberately
            # exit 0 here so the step itself reports green and the
            # `success=false` output is what callers check.
            exit 0
          fi
