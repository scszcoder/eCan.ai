# ============================================================================
# Reusable Workflow: Intl latest.json generation (S3-based)
# ============================================================================
# Mirror of `shared-cos-latest-json.yml` — the only differences are the
# secrets it consumes (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY vs the
# Tencent Cloud set) and the default region. Everything else (job shape,
# steps, environment variables, dependencies) is byte-identical.
#
# This is currently a STUB. The previous monolithic release.yml had the
# real latest.json builder; it has been moved to its own script
# (`build_system/scripts/release/generate_latest_json.py`) and will be
# re-wired in once the script has been split into its own deployable
# artefact. Until then, this reusable just prints the resolved inputs
# so the wiring can be verified.
#
# Inputs:
#   - version / environment / channel: standard release metadata.
#   - app: intl | cn  (which app's latest.json we're producing)
#   - platform / arch: forwarded for traceability.
#
# Secrets (inherited):
#   - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION (optional)
# ============================================================================

name: Shared latest.json generation (Intl - S3)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string'
        required: true
        type: string
      environment:
        description: 'Target environment (dev/test/staging/production)'
        required: true
        type: string
      channel:
        description: 'Release channel (dev/beta/stable)'
        required: true
        type: string
      app:
        description: 'intl | cn'
        required: true
        type: string
      platform:
        description: 'All (kept for parity with shared-{appcast,download-links})'
        required: false
        type: string
        default: 'all'
      arch:
        description: 'All (kept for parity with shared-{appcast,download-links})'
        required: false
        type: string
        default: 'all'
    outputs:
      success:
        description: 'Whether the latest.json generation succeeded'
        value: ${{ jobs.generate.outputs.success }}

jobs:
  generate:
    name: Generate latest.json
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.run.outputs.success }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-intl.txt'

      - name: Install dependencies
        run: pip install -r requirements-intl.txt

      - name: Generate latest.json
        id: run
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ secrets.AWS_REGION || 'us-east-1' }}
          VERSION:     ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHANNEL:     ${{ inputs.channel }}
          APP:         ${{ inputs.app }}
          PLATFORM:    ${{ inputs.platform }}
          ARCH:        ${{ inputs.arch }}
        run: |
          echo "::group::latest.json inputs"
          echo "VERSION=${VERSION}  ENVIRONMENT=${ENVIRONMENT}  CHANNEL=${CHANNEL}"
          echo "APP=${APP}  PLATFORM=${PLATFORM}  ARCH=${ARCH}"
          echo "AWS_REGION=${AWS_REGION:-<unset>}"
          echo "::endgroup::"
          python3 - <<'PY'
          import os
          print("latest.json stub for", os.environ.get("APP"))
          print("env:", os.environ.get("CHANNEL"), os.environ.get("ENVIRONMENT"))
          # TODO: invoke build_system/scripts/release/generate_latest_json.py
          # once that script is split out of the monolithic release.yml.
          PY
          echo "success=true" >> $GITHUB_OUTPUT
