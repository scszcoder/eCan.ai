# ============================================================================
# Reusable Workflow: CN latest.json generation (COS-based)
# ============================================================================
# Byte-equivalent counterpart of `shared-s3-latest-json.yml`. The only
# differences are:
#   * `build_system/scripts/requirements.txt` → `build_system/scripts/requirements-cos.txt`
#   * AWS_* secrets                  → ECAN_TENCENT_* secrets
#   * AWS_REGION (us-east-1)         → ECAN_TENCENT_REGION (ap-guangzhou)
# Everything else (job shape, step order, environment variables,
# outputs, dependencies) is identical so intl/cn remain structurally
# parallel.
#
# Inputs:
#   - version / environment / channel: standard release metadata.
#   - app: intl | cn  (which app's latest.json we're producing)
#   - platform / arch: forwarded for traceability.
#
# Secrets (inherited):
#   - ECAN_TENCENT_SECRET_ID, ECAN_TENCENT_SECRET_KEY, ECAN_TENCENT_REGION
# ============================================================================

name: Shared latest.json generation (CN - COS)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string'
        required: true
        type: string
      environment:
        description: 'Target environment (dev/test/staging/production)'
        required: true
        type: string
      channel:
        description: 'Release channel (dev/beta/stable)'
        required: true
        type: string
      user-prefix:
        description: 'Optional per-user release prefix'
        required: false
        type: string
        default: ''
      app:
        description: 'intl | cn'
        required: true
        type: string
      platform:
        description: 'All (kept for parity with shared-{appcast,download-links})'
        required: false
        type: string
        default: 'all'
      arch:
        description: 'All (kept for parity with shared-{appcast,download-links})'
        required: false
        type: string
        default: 'all'
    outputs:
      success:
        description: 'Whether the latest.json generation succeeded'
        value: ${{ jobs.generate.outputs.success }}

jobs:
  generate:
    name: Generate latest.json
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.run.outputs.success }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # Narrow CN-side requirements (cos-python-sdk-v5 + pyyaml + packaging).
          # The umbrella requirements-cn.txt drags in the full runtime app
          # (LangChain, PySide6, Playwright, LightRAG, FAISS, Neo4j, …) which
          # a latest.json writer never needs — replace it with the
          # parity-mirrored build_system/scripts/requirements-cos.txt.
          cache-dependency-path: 'build_system/scripts/requirements-cos.txt'

      - name: Install dependencies
        run: pip install -r build_system/scripts/requirements-cos.txt

      - name: Generate latest.json
        id: run
        env:
          ECAN_TENCENT_SECRET_ID:  ${{ secrets.ECAN_TENCENT_SECRET_ID }}
          ECAN_TENCENT_SECRET_KEY: ${{ secrets.ECAN_TENCENT_SECRET_KEY }}
          ECAN_TENCENT_REGION:     ${{ secrets.ECAN_TENCENT_REGION || 'ap-guangzhou' }}
          VERSION:     ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHANNEL:     ${{ inputs.channel }}
          APP:         ${{ inputs.app }}
          PLATFORM:    ${{ inputs.platform }}
          ARCH:        ${{ inputs.arch }}
        run: |
          echo "::group::latest.json inputs"
          echo "VERSION=${VERSION}  ENVIRONMENT=${ENVIRONMENT}  CHANNEL=${CHANNEL}"
          echo "APP=${APP}  PLATFORM=${PLATFORM}  ARCH=${ARCH}"
          echo "ECAN_TENCENT_REGION=${ECAN_TENCENT_REGION:-<unset>}"
          echo "::endgroup::"
          CMD="python3 build_system/scripts/generate_latest_json.py --env ${ENVIRONMENT} --version ${VERSION} --app ${APP}"
          if [ -n "${CHANNEL}" ]; then
            CMD="$CMD --channel ${CHANNEL}"
          fi
          if [ -n "${{ inputs.user-prefix }}" ]; then
            CMD="$CMD --user-prefix ${{ inputs.user-prefix }}"
          fi
          $CMD
          rc=$?
          if [ $rc -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::generate_latest_json.py exited with $rc"
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit $rc
          fi
