name: Release Build (DEPRECATED — use release-intl.yml or release-cn.yml)

# ============================================================================
# DEPRECATED — split into two independent pipelines
# ============================================================================
#
# This workflow was split into two parallel, fully-closed release pipelines:
#
#   * .github/workflows/release-intl.yml  — Intl (AWS S3)
#   * .github/workflows/release-cn.yml    — CN   (Tencent Cloud COS)
#
# Each app (intl / cn) now owns its own end-to-end flow so a bug in one cannot
# affect the other. The previous monolithic `app='intl'|'cn'|'all'` flag has
# been removed — pick the workflow that matches the artifact target.
#
# If you landed here from an old link, PR comment, or trigger config:
#   * intl builds  →  trigger .github/workflows/release-intl.yml
#   * cn   builds  →  trigger .github/workflows/release-cn.yml
#
# This stub stays in place only so legacy references resolve to a clear
# "moved" message instead of a 404. Delete it after the next release.
# ============================================================================

on:
  workflow_dispatch:

jobs:
  deprecated-notice:
    name: This workflow has been moved
    runs-on: ubuntu-latest
    steps:
      - name: Show deprecation notice
        run: |
          echo ""
          echo "============================================================"
          echo "❌  The monolithic release.yml has been split into TWO files:"
          echo ""
          echo "    • .github/workflows/release-intl.yml  (AWS S3 / global)"
          echo "    • .github/workflows/release-cn.yml    (Tencent COS / CN)"
          echo ""
          echo "    Pick the workflow that matches the artifact target."
          echo "============================================================"
          exit 1
