          build/

  # ============================================================================
  # DISTRIBUTION LAYER: S3 Upload and OTA Feed Generation
  # ============================================================================
  # This layer uses reusable workflows to handle distribution tasks:
  #   1. upload-to-s3: Upload installers to AWS S3 (shared-s3-upload.yml)
  #   2. generate-appcast: Create OTA update feeds (shared-appcast-generation.yml)
  #   3. generate-download-links: Generate download URLs (shared-download-links.yml)
  #
  # Benefits of reusable workflows:
  #   - Reduces code duplication between release.yml and release-simulate.yml
  #   - Easier to maintain and update
  #   - Consistent behavior across workflows
  # ============================================================================

  # ----------------------------------------------------------------------------
  # Step 1: Upload artifacts to S3
  # ----------------------------------------------------------------------------
  upload-to-s3:
    name: Upload to S3
    needs: [validate-tag, build-windows, build-macos, build-linux, build-windows-cn, build-macos-cn, build-linux-cn]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.app == 'intl' || github.event.inputs.app == 'all') &&
      (needs.build-windows.result == 'success' || needs.build-macos-cn.result == 'success' || needs.build-linux.result == 'success')
    uses: ./.github/workflows/shared-s3-upload.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      # Forwarded so the upload step lays user-prefixed builds at
      # `releases/<prefix>_v<version>/...` instead of the default
      # `releases/v<version>/...`. Empty string => existing behavior.
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      windows-build-result: ${{ needs.build-windows.result }}
      macos-build-result: ${{ needs.build-macos.result }}
      linux-build-result: ${{ needs.build-linux.result }}
    secrets: inherit

  # ----------------------------------------------------------------------------
  # CN App: Upload to Tencent Cloud COS
  # ----------------------------------------------------------------------------
  upload-to-cos:
    name: Upload to COS (CN App)
    needs: [validate-tag, build-windows-cn, build-macos-cn, build-linux-cn]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.app == 'cn' || github.event.inputs.app == 'all')
    uses: ./.github/workflows/shared-cos-upload.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      windows-build-result: ${{ needs.build-windows.result }}
      macos-build-result: ${{ needs.build-macos.result }}
      linux-build-result: ${{ needs.build-linux.result }}
    secrets: inherit

  # ----------------------------------------------------------------------------
  # Step 2: Generate OTA update feeds (Appcast)
  # ----------------------------------------------------------------------------
  # Generate Appcast for Windows (if built)
  generate-appcast-windows:
    name: Generate Appcast (Windows)
    needs: [validate-tag, upload-to-s3, build-windows]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.result == 'success' &&
      (github.event.inputs.app == 'intl' || github.event.inputs.app == 'all') &&
      needs.build-windows.result == 'success'
    uses: ./.github/workflows/shared-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      # See validate-tag outputs above; needed so the appcast generator
      # can compute the verbatim S3 directory name for user-prefixed builds.
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      app: 'intl'
      platform: 'windows'
      arch: 'amd64'
    secrets: inherit

  # Generate Appcast for macOS amd64 (if built)
  generate-appcast-macos-amd64:
    name: Generate Appcast (macOS Intel)
    needs: [validate-tag, upload-to-s3, build-macos]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.result == 'success' &&
      (github.event.inputs.app == 'intl' || github.event.inputs.app == 'all') &&
      needs.build-macos-cn.result == 'success' &&
      (github.event.inputs.arch == 'all' || github.event.inputs.arch == '' || github.event.inputs.arch == 'amd64')
    uses: ./.github/workflows/shared-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      app: 'intl'
      platform: 'macos'
      arch: 'amd64'
    secrets: inherit

  # Generate Appcast for macOS aarch64 (if built)
  generate-appcast-macos-aarch64:
    name: Generate Appcast (macOS ARM)
    needs: [validate-tag, upload-to-s3, build-macos]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.result == 'success' &&
      (github.event.inputs.app == 'intl' || github.event.inputs.app == 'all') &&
      needs.build-macos-cn.result == 'success' &&
      (github.event.inputs.arch == 'all' || github.event.inputs.arch == '' || github.event.inputs.arch == 'aarch64')
    uses: ./.github/workflows/shared-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      app: 'intl'
      platform: 'macos'
      arch: 'aarch64'
    secrets: inherit

  # Generate Appcast for Linux amd64 (if built)
  generate-appcast-linux-amd64:
    name: Generate Appcast (Linux)
    needs: [validate-tag, upload-to-s3, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.result == 'success' &&
      (github.event.inputs.app == 'intl' || github.event.inputs.app == 'all') &&
      needs.build-linux.result == 'success' &&
      (github.event.inputs.arch == 'all' || github.event.inputs.arch == '' || github.event.inputs.arch == 'amd64')
    uses: ./.github/workflows/shared-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      app: 'intl'
      platform: 'linux'
      arch: 'amd64'
    secrets: inherit

  # ----------------------------------------------------------------------------
  # CN App: Generate OTA update feeds (Appcast) via COS
  # ----------------------------------------------------------------------------
  # Generate Appcast for CN Windows
  generate-appcast-cn-windows:
    name: Generate Appcast CN (Windows)
    needs: [validate-tag, upload-to-cos, build-windows-cn]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.result == 'success' &&
      (github.event.inputs.app == 'cn' || github.event.inputs.app == 'all') &&
      needs.build-windows-cn.result == 'success'
    uses: ./.github/workflows/shared-cos-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      platform: 'windows'
      arch: 'amd64'
    secrets: inherit

  # Generate Appcast for CN macOS amd64
  generate-appcast-cn-macos-amd64:
    name: Generate Appcast CN (macOS Intel)
    needs: [validate-tag, upload-to-cos, build-macos-cn]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.result == 'success' &&
      (github.event.inputs.app == 'cn' || github.event.inputs.app == 'all') &&
      needs.build-macos-cn.result == 'success'
    uses: ./.github/workflows/shared-cos-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      platform: 'macos'
      arch: 'amd64'
    secrets: inherit

  # Generate Appcast for CN macOS aarch64
  generate-appcast-cn-macos-aarch64:
    name: Generate Appcast CN (macOS ARM)
    needs: [validate-tag, upload-to-cos, build-macos-cn]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.result == 'success' &&
      (github.event.inputs.app == 'cn' || github.event.inputs.app == 'all') &&
      needs.build-macos-cn.result == 'success'
    uses: ./.github/workflows/shared-cos-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      platform: 'macos'
      arch: 'aarch64'
    secrets: inherit

  # Generate Appcast for CN Linux
  generate-appcast-cn-linux-amd64:
    name: Generate Appcast CN (Linux)
    needs: [validate-tag, upload-to-cos, build-linux-cn]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.result == 'success' &&
      (github.event.inputs.app == 'cn' || github.event.inputs.app == 'all') &&
      needs.build-linux-cn.result == 'success'
    uses: ./.github/workflows/shared-cos-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      version: ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      platform: 'linux'
      arch: 'amd64'
    secrets: inherit

  # ----------------------------------------------------------------------------
  # Step 2.5: Generate latest.json (after all Appcasts)
  # ----------------------------------------------------------------------------
  generate-latest-json:
    name: Generate latest.json
    needs: [
      validate-tag,
      upload-to-s3,
      upload-to-cos,
      generate-appcast-windows,
      generate-appcast-macos-amd64,
      generate-appcast-macos-aarch64,
      generate-appcast-linux-amd64,
      generate-appcast-cn-windows,
      generate-appcast-cn-macos-amd64,
      generate-appcast-cn-macos-aarch64,
      generate-appcast-cn-linux-amd64
    ]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (needs.upload-to-s3.result == 'success' || needs.upload-to-cos.result == 'success') &&
      (needs.generate-appcast-windows.result == 'success' ||
       needs.generate-appcast-macos-amd64.result == 'success' ||
       needs.generate-appcast-macos-aarch64.result == 'success' ||
       needs.generate-appcast-linux-amd64.result == 'success' ||
       needs.generate-appcast-cn-windows.result == 'success' ||
       needs.generate-appcast-cn-macos-amd64.result == 'success' ||
       needs.generate-appcast-cn-macos-aarch64.result == 'success' ||
       needs.generate-appcast-cn-linux-amd64.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install boto3 pyyaml packaging

      - name: Generate latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import sys
          sys.path.insert(0, 'build_system/scripts')
          from generate_appcast import AppcastGenerator
          
          generator = AppcastGenerator(
              environment='${{ needs.validate-tag.outputs.environment }}',
              channel='${{ needs.validate-tag.outputs.channel }}'
          )
          
          print('[INFO] Generating latest.json only...')
          success = generator.generate_latest_json()
          
          if success:
              print('[OK] latest.json generated successfully')
              sys.exit(0)
          else:
              print('[ERROR] Failed to generate latest.json')
              sys.exit(1)
          PYTHON_SCRIPT

  # ----------------------------------------------------------------------------
  # Step 3: Generate download links
  # ----------------------------------------------------------------------------
  generate-download-links:
    name: Generate Download Links
    needs: [validate-tag, upload-to-s3, build-windows, build-macos, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.result == 'success'
    uses: ./.github/workflows/shared-download-links.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel: ${{ needs.validate-tag.outputs.channel }}
      windows-build-result: ${{ needs.build-windows.result }}
      macos-build-result: ${{ needs.build-macos.result }}
      linux-result: ${{ needs.build-linux.result }}
      macos-built-amd64: ${{ (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all') && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all') }}
      macos-built-aarch64: ${{ (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all') && (github.event.inputs.arch == 'aarch64' || github.event.inputs.arch == 'all') }}
    secrets: inherit

  # ----------------------------------------------------------------------------
  # Step 4: Final status summary
  # ----------------------------------------------------------------------------
  final-status:
    name: Final Status Summary
    needs: [
      validate-tag,
      build-windows,
      build-windows-cn,
      build-macos,
      build-macos-cn,
      build-linux,
      build-linux-cn,
      upload-to-s3,
      upload-to-cos,
      generate-appcast-windows,
      generate-appcast-macos-amd64,
      generate-appcast-macos-aarch64,
      generate-appcast-linux-amd64,
      generate-appcast-cn-windows,
      generate-appcast-cn-macos-amd64,
      generate-appcast-cn-macos-aarch64,
      generate-appcast-cn-linux-amd64,
      generate-latest-json,
      generate-download-links
    ]
    if: always()
    uses: ./.github/workflows/shared-final-status.yml
    with:
      version: ${{ needs.validate-tag.outputs.version }}
      windows-result: ${{ needs.build-windows.result }}
      windows-cn-result: ${{ needs.build-windows-cn.result }}
      macos-result: ${{ needs.build-macos.result }}
      macos-cn-result: ${{ needs.build-macos-cn.result }}
      linux-result: ${{ needs.build-linux.result }}
      linux-cn-result: ${{ needs.build-linux-cn.result }}
      upload-s3-result: ${{ needs.upload-to-s3.result }}
      upload-cos-result: ${{ needs.upload-to-cos.result }}
      appcast-result: ${{ (needs.generate-appcast-windows.result == 'success' || needs.generate-appcast-macos-amd64.result == 'success' || needs.generate-appcast-macos-aarch64.result == 'success' || needs.generate-appcast-linux-amd64.result == 'success' || needs.generate-appcast-cn-windows.result == 'success' || needs.generate-appcast-cn-macos-amd64.result == 'success' || needs.generate-appcast-cn-macos-aarch64.result == 'success' || needs.generate-appcast-cn-linux-amd64.result == 'success') && 'success' || 'failure' }}
      links-result: ${{ needs.generate-download-links.result }}
      is-simulation: false
    secrets: inherit
