      - name: Upload macOS aarch64 artifacts (debug mirror)
        if: github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-macos-aarch64-${{ needs.validate-tag.outputs.version }}
          path: artifacts/
          retention-days: 7
          compression-level: 6

  build-linux:
    name: Build Linux amd64
    needs: validate-tag
    if: |
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all') &&
      (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == '') &&
      (github.event.inputs.runner_group == 'github-hosted' || github.event.inputs.runner_group == 'ecan-linux-amd64')
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-linux-amd64' && fromJSON('["self-hosted","linux","x64","ecan-build"]') || 'ubuntu-latest' }}
    env:
      BUILD_ARCH: amd64
      DEBIAN_FRONTEND: noninteractive
      ECAN_APP_ID: intl
      ECAN_APP_NAME: eCan
      DIST_APP: eCan
    timeout-minutes: 60

    steps:
      - name: Ensure Git Bash + PowerShell 7 are on runner-service PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Probe PowerShell 7 + Git Bash via the dedicated helper.
          # This handles non-standard installs (operator-style
          # C:\Users\<user>\opt\pwsh7\, scoop, choco-shim dirs)
          # before falling back to auto-install. Without the
          # probe-first check, an auto-install would shadow an
          # existing install at a non-canonical path
          # (run #86820634953).
          $helper = Join-Path $env:GITHUB_WORKSPACE 'build_system/scripts/runner/find-prerequisites.ps1'
          if (Test-Path -LiteralPath $helper) {
            . $helper
          } else {
            # Inline fallback for older checkouts. Same
            # candidate list, same probe-first install-fallback
            # semantics as find-prerequisites.ps1. Crucially,
            # candidates are checked BEFORE `Get-Command`, so the
            # canonical C:\Program Files\Git\bin\bash.exe wins
            # over the WSL/Cygwin placeholder at
            # C:\Windows\System32\bash.exe that Get-Command
            # would otherwise return on GitHub-hosted windows-latest
            # (see actions/runner-images#12646).
            function Find-PwshLocation {
              foreach ($c in @("$env:ProgramFiles\PowerShell\7\pwsh.exe", "${env:ProgramFiles(x86)}\PowerShell\7\pwsh.exe", "$env:LOCALAPPDATA\Programs\PowerShell\7\pwsh.exe", "$env:USERPROFILE\opt\pwsh7\pwsh.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Find-BashLocation {
              foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe", "$env:USERPROFILE\scoop\apps\git\current\bin\bash.exe", "$env:ProgramData\chocolatey\bin\bash.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command bash.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Get-PwshDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
            function Get-BashDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
          }

          $gitBashInstallDir = 'C:\Program Files\Git'
          $gitBashBin       = Join-Path $gitBashInstallDir 'bin\bash.exe'
          $pwshInstallDir   = 'C:\Program Files\PowerShell\7'
          $pwshBin          = Join-Path $pwshInstallDir   'pwsh.exe'

          # --- (1) PowerShell ExecutionPolicy sanity check ---
          # Read directly from registry (Get-ExecutionPolicy
          # -List triggers loading of Microsoft.PowerShell.Security
          # whose Security.types.ps1xml fails AuthorizationManager
          # validation on some pwsh 7 installations).
          $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          if (-not $effectiveEp) {
            $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\7\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          }
          if (-not $effectiveEp) { $effectiveEp = 'RemoteSigned' }
          if ($effectiveEp -eq 'Restricted') {
            Write-Host "::error::PowerShell ExecutionPolicy (LocalMachine) is Restricted. The GHA runner dot-sources inline scripts via `powershell -command \". '<guid>.ps1'\"`, which Restricted rejects with `UnauthorizedAccess` BEFORE any step body runs. GitHub-hosted runners override this via Group Policy to `RemoteSigned`; self-hosted runners must do the same. Run on the runner machine (elevated PowerShell): `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force`, then restart the runner service (`C:\actions-runner\svc.cmd stop && C:\actions-runner\svc.cmd start`). This is set automatically by build_system/scripts/runner/setup-prerequisites.ps1 on the runner -- if it's still missing, run that script first."
            exit 1
          }
          Write-Host "[OK] PowerShell ExecutionPolicy (LocalMachine): $effectiveEp"

          # --- (2) Git Bash (PROBE-THEN-INSTALL) ---
          $gitBashBin = Find-BashLocation
          if ($gitBashBin) {
            Write-Host "[OK] Git Bash found at $gitBashBin (no install needed)"
          } else {
            Write-Host "[INFO] Git Bash not found via probe -- installing via direct download"
            $gitExe = "$env:TEMP\Git-Setup.exe"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $gitExe "https://github.com/git-for-windows/git/releases/download/v2.46.0.windows.1/Git-2.46.0-64-bit.exe"
              # Inno Setup /DIR expects the install TARGET dir
              # (parent of bin/), NOT bin/ subdir.
              Start-Process -Wait -FilePath $gitExe -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', "/DIR$gitBashInstallDir"
              Remove-Item $gitExe -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::Git for Windows install failed: $($_.Exception.Message). Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            if (-not (Test-Path $gitBashBin)) {
              Write-Host "::error::Git for Windows installer ran but $gitBashBin is still missing. Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            Write-Host "[OK] Git Bash installed at $gitBashBin"
          }
          $gitBashDir = Get-BashDir -BashPath $gitBashBin

          # (2b) Git Bash's bin directory on the runner-service
          # PATH? Git for Windows' installer only adds to user
          # PATH, but the service inherits SYSTEM PATH. Forward
          # to $GITHUB_PATH so all subsequent steps in this job
          # see it (and the service-level PATH still needs to be
          # set on the runner -- see docs 九.3.1).
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$gitBashDir*") {
            $gitBashDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$gitBashDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] Git Bash already on service PATH"
          }

          # --- (3) PowerShell 7 (PROBE-THEN-INSTALL) ---
          $pwshBin = Find-PwshLocation
          if ($pwshBin) {
            Write-Host "[OK] PowerShell 7 found at $pwshBin (no install needed)"
          } else {
            Write-Host "[INFO] PowerShell 7 not found via probe -- installing via direct MSI download"
            $msi = "$env:TEMP\pwsh.msi"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $msi "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
              # Start-Process -PassThru captures the real MSI exit
              # code; `msiexec ... | Out-Null` is unreliable
              # (msiexec is GUI-subsystem, PowerShell doesn't
              # block, $LASTEXITCODE reflects last NATIVE cmd).
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                Write-Host "::error::PowerShell 7 MSI install failed with exit code $($proc.ExitCode). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
                exit 1
              }
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::PowerShell 7 install failed: $($_.Exception.Message). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            if (-not (Test-Path $pwshBin)) {
              Write-Host "::error::PowerShell 7 install reported success but $pwshBin is still missing. Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            Write-Host "[OK] PowerShell 7 installed at $pwshBin"
          }
          $pwshDir = Get-PwshDir -PwshPath $pwshBin

          # (3b) PowerShell 7's directory on the runner-service PATH?
          # Same reasoning as (2b) for Git Bash: the service runs as
          # SYSTEM and inherits SYSTEM PATH, not the user's. Forward
          # to $GITHUB_PATH so bash/git operations that invoke pwsh
          # as a sub-shell (e.g. git config --list | pwsh -c "...")
          # do not fail with "command not found".
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$pwshDir*") {
            $pwshDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$pwshDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] PowerShell 7 already on service PATH"
          }

          # --- (4) Final summary ---
          Write-Host "[OK] Prerequisite check complete: Git Bash + PowerShell 7 reachable, ExecutionPolicy=$($effectiveEp)"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          platform: linux
          requirements-file: requirements-linux.txt
          architecture: x64

      - name: Install app-specific dependencies
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -r "requirements-intl.txt"

      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright
        with:
          platform: linux
          browsers: chromium

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env

      - name: Setup WhatsApp Baileys Bridge Environment
        uses: ./.github/actions/setup-wabaileys-bridge
        with:
          node-version: '20'
          bridge-dir: wabaileys-bridge

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ make pkg-config libffi-dev libssl-dev
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 libxcb-xkb1 libxkbcommon0
          sudo apt-get install -y -qq scrot wmctrl xdotool xdg-utils cups cups-client tesseract-ocr tesseract-ocr-eng dpkg-dev fakeroot
          sudo apt-get install -y -qq xvfb
          # upx-ucl: required by PyInstaller --upx-dir when build_config.json
          # prod profile enables upx_compression. Without this, PyInstaller
          # silently skips compression (see linux_builder.py fallback).
          sudo apt-get install -y -qq upx-ucl

      - name: Install AppImage tools
        run: |
          # appimagetool moved from the deprecated AppImage/AppImageKit
          # repo to its own home at AppImage/appimagetool in 2024.
          # The asset name (appimagetool-x86_64.AppImage) and the
          # continuous tag are unchanged, only the owner differs.
          # Using the legacy URL silently 404s in CI.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup OTA signing key
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        shell: bash
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          mkdir -p build_system/certificates
          OTA_PRIVATE_KEY="$OTA_PRIVATE_KEY" python3 -c \
            'import base64, os, pathlib; pathlib.Path("build_system/certificates/ed25519_private_key.pem").write_bytes(base64.b64decode(os.environ["OTA_PRIVATE_KEY"]))'
          chmod 600 build_system/certificates/ed25519_private_key.pem

      - name: Build Linux packages
        shell: bash
        env:
          ECAN_SKIP_FRONTEND_BUILD: '0'
          ECAN_ENVIRONMENT: ${{ needs.validate-tag.outputs.environment }}
        run: |
          python3 build.py prod --version ${{ needs.validate-tag.outputs.version }} --app intl

      - name: Generate Ed25519 signatures
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        shell: bash
        run: |
          pip install cryptography --quiet
          # Sign the .deb (required: apt-downgrade integrity check).
          # DIST_APP matches build.py's installer_filename prefix:
          # {app.name}-{version}-linux-{arch}.{deb,AppImage}
          # (app.name == DIST_APP == ECAN_APP_NAME).
          python3 build_system/signing_manager.py \
            "dist/${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb" \
            "build_system/certificates/ed25519_private_key.pem" \
            "dist/${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb.sig"
          # Also sign the AppImage — Prepare artifacts below copies
          # .AppImage.sig into the artifact staging directory, but
          # without this line the signature is never produced and the
          # uploader silently ships an unsigned AppImage. The signing
          # tool is generic (just an ed25519 detached sig), so the
          # same private key works for both formats.
          APPIMAGE="dist/${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-linux-amd64.AppImage"
          if [ -f "$APPIMAGE" ]; then
            python3 build_system/signing_manager.py \
              "$APPIMAGE" \
              "build_system/certificates/ed25519_private_key.pem" \
              "${APPIMAGE}.sig"
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          echo "[DEBUG] Working directory: $(pwd)"
          echo "[DEBUG] Contents of dist/:"
          ls -la dist/ 2>/dev/null || echo "[DEBUG] dist/ does not exist or is empty"
          VERSION="${{ needs.validate-tag.outputs.version }}"
          mkdir -p artifacts
          # Resolve each expected Linux artifact explicitly so we can
          # distinguish "build succeeded but copy failed" from "build
          # failed upstream". At least one of .deb or .AppImage must
          # exist — if build.py prod produced neither, that's a hard
          # pipeline failure and the upload-to-S3 job must not silently
          # swallow it.
          # DIST_APP matches build.py's installer_filename prefix
          # (eCan for intl, eCan.cn for cn).
          DEB="dist/${{ env.DIST_APP }}-${VERSION}-linux-amd64.deb"
          APPIMAGE="dist/${{ env.DIST_APP }}-${VERSION}-linux-amd64.AppImage"
          if [ ! -f "$DEB" ] && [ ! -f "$APPIMAGE" ]; then
            echo "::error::Expected Linux package not found in dist/ (looked for $DEB and $APPIMAGE). build.py prod did not produce a .deb or .AppImage. The build pipeline is broken; investigate the 'Build Linux packages' step above before retrying."
            exit 1
          fi
          for f in $DEB ${DEB}.sig $APPIMAGE ${APPIMAGE}.sig; do
            # `|| true` swallows the exit code from a missing source so the
            # `for` loop's overall exit code (which equals the LAST
            # iteration's last command) does not fail the step under
            # `set -e -o pipefail` when AppImage is not built.
            [ -f "$f" ] && cp "$f" artifacts/ || true
          done
          echo "[ARTIFACTS] Copied: $DEB $DEB.sig $APPIMAGE $APPIMAGE.sig"
          echo "[ARTIFACTS] DEB present: $([ -f "$DEB" ] && echo yes || echo no)"
          echo "[ARTIFACTS] APPIMAGE present: $([ -f "$APPIMAGE" ] && echo yes || echo no)"

      - name: Upload Linux artifacts (S3 transfer)
        uses: actions/upload-artifact@v6
        with:
          name: eCan-linux-amd64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          # Belt-and-braces: Prepare artifacts already exits 1 when
          # neither .deb nor .AppImage exists, so this branch is a
          # backstop for any future regression. Without it, an empty
          # artifacts/ directory would let upload succeed as a yellow
          # "No files were found" warning, hiding the real failure.
          if-no-files-found: error

      - name: Upload Linux artifacts (debug mirror)
        if: github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-linux-amd64-${{ needs.validate-tag.outputs.version }}
          path: artifacts/
          retention-days: 7
          compression-level: 6

  # ──────────────────────────────────────────────────────────────────────
  # Stage 3 — Upload to S3, generate appcast + links + summary
  # ──────────────────────────────────────────────────────────────────────

  upload-to-s3:
    name: Upload to S3
    needs: [validate-tag, build-windows, build-macos-amd64, build-macos-aarch64, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success' ||
       (needs.build-macos-amd64.result == 'success' || needs.build-macos-aarch64.result == 'success'))
    # The reusable upload workflow internally uses `continue-on-error:
    # true` on the upload step, so even if <BACKEND> is unreachable /
    # auth is broken / SDK errored, the job itself reports success and
    # does not fail the pipeline. The real outcome is propagated via
    # the upload-success output (true/false), which downstream
    # appcast / download-links / latest-json jobs gate on. If
    # upload-success is false, those downstream jobs skip (their
    # output would point at a CDN that has no files) and
    # final-status instead surfaces the GHA artifact URLs as a
    # temporary fallback download.
    uses: ./.github/workflows/shared-s3-upload.yml
    with:
      version:     ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
    secrets: inherit

  generate-appcast:
    name: Generate Appcast (all platforms × archs)
    needs: [validate-tag, upload-to-s3, build-windows, build-macos-amd64, build-macos-aarch64, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.outputs.upload-success == 'true' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-macos-amd64.result == 'success' ||
       needs.build-macos-aarch64.result == 'success')
    uses: ./.github/workflows/shared-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel:     ${{ needs.validate-tag.outputs.channel }}
      version:     ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      app:         intl
      platform:    all
      arch:        all
    secrets: inherit

  generate-latest-json:
    name: Generate latest.json
    needs: [validate-tag, generate-appcast, upload-to-s3]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.generate-appcast.result == 'success'
    uses: ./.github/workflows/shared-s3-latest-json.yml
    with:
      version:     ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel:     ${{ needs.validate-tag.outputs.channel }}
      app:         intl
      platform:    all
      arch:        all
    secrets: inherit

  generate-download-links:
    name: Generate Download Links
    needs: [validate-tag, upload-to-s3, build-windows, build-macos-amd64, build-macos-aarch64, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.outputs.upload-success == 'true'
    uses: ./.github/workflows/shared-download-links.yml
    with:
      version:        ${{ needs.validate-tag.outputs.version }}
      environment:    ${{ needs.validate-tag.outputs.environment }}
      channel:        ${{ needs.validate-tag.outputs.channel }}
      windows-build-result: ${{ needs.build-windows.result }}
      macos-build-result:  ${{ (needs.build-macos-amd64.result == 'success' || needs.build-macos-aarch64.result == 'success') && 'success' || 'failure' }}
      linux-result:        ${{ needs.build-linux.result }}
      macos-built-amd64:   ${{ needs.build-macos-amd64.result == 'success' }}
      macos-built-aarch64: ${{ needs.build-macos-aarch64.result == 'success' }}
    secrets: inherit

  final-status:
    name: Final Status Summary
    needs: [validate-tag, build-windows, build-macos-amd64, build-macos-aarch64, build-linux, upload-to-s3, generate-appcast, generate-latest-json, generate-download-links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show summary
        env:
          VERSION:           ${{ needs.validate-tag.outputs.version }}
          WINDOWS_RESULT:    ${{ needs.build-windows.result }}
          MACOS_AMD64:       ${{ needs.build-macos-amd64.result }}
          MACOS_AARCH64:     ${{ needs.build-macos-aarch64.result }}
          LINUX_RESULT:      ${{ needs.build-linux.result }}
          UPLOAD_RESULT:     ${{ needs.upload-to-s3.outputs.upload-success }}
          APPCAST_RESULT:    ${{ needs.generate-appcast.result }}
          LATEST_RESULT:     ${{ needs.generate-latest-json.result }}
          LINKS_RESULT:      ${{ needs.generate-download-links.result }}
        run: |
          echo ""
          echo "================ Release (Intl) Summary ================"
          echo "Version: ${VERSION}"
          echo ""
          echo "Builds:"
          echo "  Windows amd64:  ${WINDOWS_RESULT}"
          echo "  macOS amd64:    ${MACOS_AMD64}"
          echo "  macOS aarch64:  ${MACOS_AARCH64}"
          echo "  Linux amd64:    ${LINUX_RESULT}"
          echo ""
          echo "Distribution:"
          echo "  S3 upload:      ${UPLOAD_RESULT}"
          echo "  Appcast:        ${APPCAST_RESULT}"
          echo "  latest.json:    ${LATEST_RESULT}"
          echo "  Download links: ${LINKS_RESULT}"
          echo "========================================================"

          # Promote silent failures to visible ::error:: annotations.
          # Without this, an empty UPLOAD_RESULT (caused by the
          # set -e / rc=$? bug in shared-{s3,cos}-upload.yml) prints
          # a blank line that the operator has to mentally resolve.
          # Now we explicitly annotate each tier that went wrong.
          any_failed=0
          for entry in "Windows:${WINDOWS_RESULT}" \
                       "macOS amd64:${MACOS_AMD64}" \
                       "macOS aarch64:${MACOS_AARCH64}" \
                       "Linux:${LINUX_RESULT}" \
                       "S3 upload:${UPLOAD_RESULT}" \
                       "Appcast:${APPCAST_RESULT}" \
                       "latest.json:${LATEST_RESULT}" \
                       "Download links:${LINKS_RESULT}"; do
            name="${entry%%:*}"
            val="${entry#*:}"
            # Treat empty, "failure", "false", "cancelled" as bad.
            case "$val" in
              ""|"false"|"failure"|"cancelled")
                echo "::error::${name} failed (result='${val}'). See upstream job logs."
                any_failed=1
                ;;
            esac
          done

          if [ "$any_failed" = "1" ]; then
            # The step itself exits 0 (this is the always-on final summary
            # job — failing it would mask the real signal). The ::error::
            # annotations above are what operators see in the GitHub UI
            # when they open the run page.
            echo ""
            echo "⚠️  At least one pipeline stage failed. The release fell back"
            echo "    to GHA artifact URLs where applicable; investigate the"
            echo "    ::error:: annotations above for the specific failures."
          fi

  print-gha-fallback-downloads:
    name: Print GHA Artifact Fallback URLs
    needs: [validate-tag, build-windows, build-macos-amd64, build-macos-aarch64, build-linux, upload-to-s3]
    # Only run when S3 upload did not actually succeed but at least
    # one build succeeded — that's the scenario where the public CDN
    # has no files but the GHA artifact store does.
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-s3.outputs.upload-success == 'false' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-macos-amd64.result == 'success' ||
       needs.build-macos-aarch64.result == 'success')
    # Honour the same runner_group selection the build jobs do: when
    # the operator picked a self-hosted runner_group, this fallback
    # job must also run on a matching self-hosted runner (per the
    # "if you pick self-hosted, the whole pipeline is self-hosted"
    # contract). github-hosted falls through to ubuntu-latest.
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-windows-amd64' && fromJSON('["self-hosted","windows","x64","ecan-build"]') || github.event.inputs.runner_group == 'ecan-macos-amd64' && fromJSON('["self-hosted","macos","x64","ecan-build"]') || github.event.inputs.runner_group == 'ecan-macos-aarch64' && fromJSON('["self-hosted","macos","aarch64","ecan-build"]') || github.event.inputs.runner_group == 'ecan-linux-amd64' && fromJSON('["self-hosted","linux","x64","ecan-build"]') || 'ubuntu-latest' }}
    steps:
      - name: Emit GHA artifact URLs to step summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          WINDOWS_OK:    ${{ needs.build-windows.result == 'success' }}
          MACOS_AMD64_OK: ${{ needs.build-macos-amd64.result == 'success' }}
          MACOS_AARCH64_OK: ${{ needs.build-macos-aarch64.result == 'success' }}
          LINUX_OK:      ${{ needs.build-linux.result == 'success' }}
        run: |
          VER="${VERSION}"
          {
            echo "## :warning: S3 upload failed — temporary download via GitHub Actions artifacts"
            echo ""
            echo "The AWS S3 upload step failed, but build artifacts were preserved as GitHub Actions artifacts (retention: 90 days, login required). These are **temporary fallback** URLs for INTL internal use only; the public CDN download flow is unavailable until S3 upload is fixed."
            echo ""
            echo "Workflow run: ${RUN_URL}"
            echo ""
            echo "| Platform | Architecture | Status | Artifact | Download |"
            echo "|---|---|---|---|---|"

            if [[ "${WINDOWS_OK}" == "true" ]]; then
              A="eCan-windows-amd64-${VER}-s3-transfer"
              B="eCan-windows-amd64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| Windows | amd64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| Windows | amd64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| Windows | amd64 | :x: | (build failed) | n/a |"
            fi

            if [[ "${MACOS_AMD64_OK}" == "true" ]]; then
              A="eCan-macos-amd64-${VER}-s3-transfer"
              B="eCan-macos-amd64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| macOS | amd64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| macOS | amd64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| macOS | amd64 | :x: | (build failed) | n/a |"
            fi

            if [[ "${MACOS_AARCH64_OK}" == "true" ]]; then
              A="eCan-macos-aarch64-${VER}-s3-transfer"
              B="eCan-macos-aarch64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| macOS | aarch64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| macOS | aarch64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| macOS | aarch64 | :x: | (build failed) | n/a |"
            fi

            if [[ "${LINUX_OK}" == "true" ]]; then
              A="eCan-linux-amd64-${VER}-s3-transfer"
              B="eCan-linux-amd64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| Linux | amd64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| Linux | amd64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| Linux | amd64 | :x: | (build failed) | n/a |"
            fi

            echo ""
            echo "> **Note:** the artifacts panel is gated behind a GitHub login. To grab a single artifact, use the CLI:"
            echo ""
            echo '```bash'
            echo "gh run download ${GITHUB_RUN_ID:-<run-id>} --repo ${GITHUB_REPOSITORY:-ecan/eCan.ai} --name eCan-windows-amd64-${VER}-s3-transfer"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # Also emit a machine-parseable manifest to the workflow log
          # so consumers can scrape the artifact list without parsing
          # the step summary markdown.
          echo ""
          echo "::group::GHA artifact fallback manifest"
          echo "version=${VER}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "windows_artifact_1=eCan-windows-amd64-${VER}-s3-transfer"
          echo "windows_artifact_2=eCan-windows-amd64-${VER}"
          echo "macos_amd64_artifact_1=eCan-macos-amd64-${VER}-s3-transfer"
          echo "macos_amd64_artifact_2=eCan-macos-amd64-${VER}"
          echo "macos_aarch64_artifact_1=eCan-macos-aarch64-${VER}-s3-transfer"
          echo "macos_aarch64_artifact_2=eCan-macos-aarch64-${VER}"
          echo "linux_artifact_1=eCan-linux-amd64-${VER}-s3-transfer"
          echo "linux_artifact_2=eCan-linux-amd64-${VER}"
          echo "::endgroup::"
