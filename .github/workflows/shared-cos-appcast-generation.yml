# ============================================================================
# Reusable Workflow: CN Appcast Generation (COS-based)
# ============================================================================
#
# This workflow generates Sparkle-compatible appcast XML files from Tencent
# Cloud COS artifacts for the CN app (eCan.cn).
#
# Generated Files:
#   {environment}/channels/{channel}/appcast-macos-amd64.xml
#   {environment}/channels/{channel}/appcast-macos-aarch64.xml
#   {environment}/channels/{channel}/appcast-windows-amd64.xml
#   {environment}/channels/{channel}/latest.json
#
# Usage:
#   jobs:
#     generate-appcast-cn:
#       uses: ./.github/workflows/shared-cos-appcast-generation.yml
#       with:
#         environment: "production"
#         channel: "stable"
#       secrets: inherit
# ============================================================================

name: Generate Appcast (COS - CN App)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev/test/staging/production/simulation)'
        required: true
        type: string
      channel:
        description: 'Release channel (dev/beta/stable/lts/simulation)'
        required: false
        type: string
        default: ''
      version:
        description: 'Specific version to generate appcast for (e.g., 1.0.1). If empty, scans all versions.'
        required: false
        type: string
        default: ''
      user-prefix:
        description: |
          Optional per-user release prefix. Currently unused for COS appcast.
        required: false
        type: string
        default: ''
      platform:
        description: 'Target platform (all/macos/windows)'
        required: false
        type: string
        default: 'all'
      arch:
        description: 'Target architecture (all/amd64/aarch64)'
        required: false
        type: string
        default: 'all'
      app:
        description: 'App identifier (cn | intl). Defaults to cn.'
        required: false
        type: string
        default: 'cn'
    outputs:
      appcast-generated:
        description: 'Whether appcast generation was successful'
        value: ${{ jobs.generate.outputs.success }}

jobs:
  generate:
    name: Generate Appcast (CN - ${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.generate.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # Narrow CN-side requirements (cos-python-sdk-v5 + pyyaml + packaging).
          # The umbrella requirements-cn.txt drags in the full runtime app
          # (LangChain, PySide6, Playwright, LightRAG, FAISS, Neo4j, …) which
          # an appcast reader never needs — replace it with the parity-mirrored
          # build_system/scripts/requirements-cos.txt.
          cache-dependency-path: 'build_system/scripts/requirements-cos.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_system/scripts/requirements-cos.txt

      - name: Generate Appcast
        id: generate
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          USER_PREFIX: ${{ inputs.user-prefix }}
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.arch }}
          APP: ${{ inputs.app }}
          ECAN_TENCENT_SECRET_ID: ${{ secrets.ECAN_TENCENT_SECRET_ID }}
          ECAN_TENCENT_SECRET_KEY: ${{ secrets.ECAN_TENCENT_SECRET_KEY }}
        run: |
          echo "=== Generating $APP App Appcast ==="
          echo "Environment: $ENVIRONMENT"
          echo "Channel: $CHANNEL"
          echo "Version: $VERSION"
          echo "Platform: $PLATFORM"
          echo "Architecture: $ARCH"

          python3 build_system/scripts/generate_appcast.py \
            --env "$ENVIRONMENT" \
            --app "$APP" \
            ${CHANNEL:+--channel "$CHANNEL"} \
            ${VERSION:+--version "$VERSION"} \
            ${PLATFORM:+--platform "$PLATFORM"} \
            ${ARCH:+--arch "$ARCH"}

          if [ $? -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
