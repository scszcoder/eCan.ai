# ============================================================================
# Reusable Workflow: COS Upload (CN App)
# ============================================================================
#
# This workflow uploads CN app build artifacts to Tencent Cloud COS.
#
# Path Structure:
#   cos://{bucket}/{environment}/releases/v{version}/{platform}/{arch}/
#
# Usage:
#   jobs:
#     upload-cos:
#       uses: ./.github/workflows/shared-cos-upload.yml
#       with:
#         version: "1.0.0"
#         environment: "production"
#       secrets: inherit
# ============================================================================

name: Upload to COS (CN App)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g., 1.0.0, 1.0.0-rc.1)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev/test/staging/production)'
        required: true
        type: string
      user-prefix:
        description: |
          Optional per-user release prefix (lowercase). Currently unused for
          COS but kept for API compatibility with the S3 upload workflow.
        required: false
        type: string
        default: ''
      windows-build-result:
        description: 'Result of Windows build job'
        required: false
        type: string
        default: 'success'
      macos-build-result:
        description: 'Result of macOS build job'
        required: false
        type: string
        default: 'success'
      linux-build-result:
        description: 'Result of Linux build job'
        required: false
        type: string
        default: 'success'
    outputs:
      upload-success:
        description: 'Whether upload was successful'
        value: ${{ jobs.upload.outputs.success }}

jobs:
  upload:
    name: Upload to COS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.upload.outputs.success }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # Narrow CN-side requirements (cos-python-sdk-v5 + pyyaml + packaging).
          # The umbrella requirements-cn.txt drags in the full runtime app
          # (LangChain, PySide6, Playwright, LightRAG, FAISS, Neo4j, …) which
          # a 30-second artifact upload never needs — replace it with the
          # parity-mirrored build_system/scripts/requirements-cos.txt.
          cache-dependency-path: 'build_system/scripts/requirements-cos.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r build_system/scripts/requirements-cos.txt

      - name: Download all artifacts for COS transfer
        uses: actions/download-artifact@v7
        with:
          pattern: '*-installer'
          path: dist/
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          ls -lh dist/ || echo "No artifacts found"

      - name: Upload to COS
        id: upload
        # Tolerate upload failures: when COS is unreachable or auth is
        # expired, the build artifacts are still safely in GHA's artifact
        # store from the build jobs' `actions/upload-artifact` step, so
        # we want the caller to surface a GHA-artifact fallback download
        # URL instead of hard-failing the whole release. We DO record
        # the actual outcome in the `success` output so downstream
        # jobs (appcast generation, download-links, latest.json) can
        # still gate on whether the public CDN actually got the files.
        #
        # Two exit-code tiers from upload_to_cos.py:
        #   rc=2  hard precondition failure (missing dist, no
        #         artifacts matched). Every build job either failed
        #         or produced no installable artifacts before we
        #         even got a chance to upload. The wrapper renders
        #         this as a red `::error::` annotation so the
        #         failure is visible in the GitHub UI rather than
        #         buried under a yellow warning.
        #   rc=1  soft runtime failure (COS unreachable, auth
        #         expired, SDK error). Downstream problem — the
        #         build itself is fine, the CDN is just unhappy.
        #         The wrapper turns this into a `::warning::` plus
        #         a GHA artifact fallback URL.
        # `continue-on-error: true` covers both tiers so the job
        # itself still reports success and the downstream
        # `print-gha-fallback-downloads` job can run; the
        # `success` output is what callers actually check.
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          ECAN_TENCENT_SECRET_ID: ${{ secrets.ECAN_TENCENT_SECRET_ID }}
          ECAN_TENCENT_SECRET_KEY: ${{ secrets.ECAN_TENCENT_SECRET_KEY }}
        # Cap the upload step at 50 minutes. The Python script now responds
        # to SIGTERM cooperatively (see build_system/scripts/upload_to_cos.py
        # -- install_signal_handlers / wait_or_stopped), so cancel will
        # usually unwind within a few seconds. This timeout is just a safety
        # net for the case where the SDK call is genuinely stuck on socket
        # IO that doesn't honour signals at all.
        #
        # 50 min (not 30) gives a 600MB Windows installer headroom on the
        # GHA -> ap-shanghai path where observed throughput is well below
        # the SDK's per-part theoretical ceiling. Neither the caller job
        # in release-cn.yml nor this reusable workflow's `upload` job set
        # a `timeout-minutes`, so this 50-minute step timeout is the only
        # wall clock bound -- raising it here directly relaxes the upload
        # step without affecting the surrounding build jobs.
        timeout-minutes: 50
        run: |
          # Make sure cancel propagates: when bash gets SIGTERM, forward it
          # to the python child (so its signal handler fires) and exit
          # with 130 so the step is marked cancelled rather than failed.
          # Note: SIGTERM bypasses `continue-on-error` (cancel is a
          # distinct semantic from a regular failure), so we still
          # propagate it cleanly.
          trap 'echo "[TRAP] SIGTERM received; forwarding to python and exiting 130"; kill -TERM "$PY_PID" 2>/dev/null; exit 130' TERM
          trap 'echo "[TRAP] SIGINT received; forwarding to python and exiting 130"; kill -INT "$PY_PID" 2>/dev/null; exit 130' INT

          echo "=== Uploading to Tencent Cloud COS ==="
          echo "Version: $VERSION"
          echo "Environment: $ENVIRONMENT"

          # Initialize rc so the success path captures rc=0 cleanly.
          # See the long comment block in shared-s3-upload.yml for the
          # root cause: under `set -e`, `|| rc=$?` only fires on
          # failure. On success, rc would otherwise be unset, and the
          # `[ $rc -eq 0 ]` test below would error out and fall through
          # into the warning branch (log #86724325753). Initializing to
          # 0 keeps the success path deterministic.
          rc=0
          python3 -u build_system/scripts/upload_to_cos.py \
            --version "$VERSION" \
            --env "$ENVIRONMENT" \
            --app cn &
          PY_PID=$!
          # `|| rc=$?` is load-bearing under `set -e`. See shared-s3-upload.yml
          # for the long explanation; the short version is that without the
          # right-side rc-capture, `wait` returning non-zero would terminate
          # the step before `success=false` reaches $GITHUB_OUTPUT, leaving
          # downstream jobs with an empty `upload-success` output and the
          # Final Status Summary printing a blank `COS upload:` line.
          wait "$PY_PID" || rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          elif [ "$rc" -eq 130 ]; then
            # Cooperative cancellation. Don't write success/failure so the
            # caller treats this as cancelled, not as a hard failure.
            # `continue-on-error` does NOT cover cancellation, so we
            # still exit 130 here.
            echo "Upload cancelled by workflow"
            exit 130
          elif [ "$rc" -eq 2 ]; then
            # Hard precondition failure — the upstream pipeline is
            # broken (no dist, no artifacts). Emit a red `::error::`
            # annotation so the GitHub UI shows a red X on this step
            # even though `continue-on-error: true` keeps the job
            # itself green for the fallback download job.
            #
            # We deliberately exit 1 here (not 0) so the step logs
            # carry a non-zero exit code alongside the `::error::`
            # annotation. With `continue-on-error: true`, that exit-1
            # does NOT fail the job — it just makes the step page
            # visibly red in the UI, which is exactly what the user
            # expects when build artifacts are missing.
            echo "::error::COS upload aborted: hard precondition failure (missing dist directory or no artifacts matched). This is an upstream build job problem, not a COS outage — investigate the build-* jobs above. The release will fall back to GHA artifact URLs."
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          else
            # Soft runtime failure (rc=1 or other non-zero). The
            # build artifacts are fine; COS is just unhappy. Warn
            # visibly and fall back to GHA artifact URLs.
            echo "::warning::COS upload failed (rc=$rc); falling back to GHA artifact URLs. See previous logs."
            echo "success=false" >> $GITHUB_OUTPUT
            # Note: with continue-on-error, the step is allowed to exit
            # non-zero without failing the job, but we deliberately
            # exit 0 here so the step itself reports green and the
            # `success=false` output is what callers check.
            exit 0
          fi
