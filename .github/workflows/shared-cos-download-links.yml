# ============================================================================
# Reusable Workflow: CN Download Links Generation (COS-based)
# ============================================================================
# Mirror image of `shared-download-links.yml` (S3) but with COS URL
# construction. Renders a GitHub Actions Summary and a downloadable text
# file listing all release artifact URLs on Tencent Cloud COS.
#
# Path Structure:
#   cos://{bucket}-{appId}.cos.{region}.myqcloud.com/{env}/releases/v{ver}/{platform}/{arch}/
#
# Inputs:
#   - version / environment / channel: standard release metadata.
#   - windows-build-result / macos-build-result / linux-result: which
#     build jobs ran in the parent workflow, used to gate artifact
#     downloads.
#   - macos-built-amd64 / macos-built-aarch64: which macOS arch was
#     actually built (the parent may have narrowed via `arch` input).
#
# Bucket resolution (single source of truth):
#   The OTA bucket / region / prefix are resolved from `ota/config/ota_config.yaml`
#   by `build_system/scripts/resolve_ota_bucket.py`. This is the SAME source
#   that `upload_to_cos.py` reads, so the download-links summary can never
#   drift from where artifacts were actually uploaded.
#
#   Previously this workflow read `secrets.COS_BUCKET`. If that secret was
#   not configured in the repo (a configuration drift that doesn't affect
#   uploads — `upload_to_cos.py` doesn't need it), the entire
#   "Generate COS download links summary" step was skipped, producing a
#   blank download-links panel in the GitHub run UI. Routing the read
#   through `ota_config.yaml` removes that silent failure mode.
#
# Secrets (inherited):
#   - ECAN_TENCENT_SECRET_ID / ECAN_TENCENT_SECRET_KEY: only used by
#     `upload_to_cos.py` (not consumed here).
# ============================================================================

name: Shared Download Links Generation (CN - COS)

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string for the release'
        required: true
        type: string
      environment:
        description: 'Target environment (development/test/staging/production)'
        required: true
        type: string
      channel:
        description: 'Release channel (dev/beta/stable)'
        required: true
        type: string
      user-prefix:
        description: >-
          Optional lowercase user prefix for per-user preview builds
          (e.g. 'songc' produces `songc_v<version>` COS prefixes). When
          non-empty, the rendered URLs and COS size probes target
          `<prefix>/releases/<user_prefix>_v<version>/...` to mirror
          where `upload_to_cos.py` actually wrote the artifacts. Must
          be empty for normal semver / branch builds.
        required: false
        type: string
        default: ''
      windows-build-result:
        description: 'Result of Windows build job (success/skipped/failure)'
        required: true
        type: string
      windows-direct-upload:
        description: >-
          When 'true', the Windows build job uploaded to COS directly
          (the direct-upload fast path is in effect). In that case no
          `*-installer` artifact is in GHA artifact store; download-links
          synthesises the expected installer filename from `version` /
          `app-name` and lists the COS URL without a size column.
        required: false
        type: boolean
        default: false
      app-name:
        description: >-
          The DIST_APP / installer prefix (e.g. 'eCan' for intl,
          'eCan.cn' for CN). Used to construct the installer filename
          when the build job took the direct-upload fast path and the
          `*-installer` artifact is absent.
        required: false
        type: string
        default: 'eCan'
      macos-build-result:
        description: 'Result of macOS build job (success/skipped/failure)'
        required: true
        type: string
      linux-result:
        description: 'Result of Linux build job (success/skipped/failure)'
        required: false
        type: string
        default: 'skipped'
      macos-built-amd64:
        description: 'Whether macOS amd64 artifacts were built in this run'
        required: false
        type: boolean
        default: true
      macos-built-aarch64:
        description: 'Whether macOS aarch64 artifacts were built in this run'
        required: false
        type: boolean
        default: true

jobs:
  generate-links:
    name: Generate CN Download Links
    runs-on: ubuntu-latest
    env:
      ECAN_TENCENT_SECRET_ID:  ${{ secrets.ECAN_TENCENT_SECRET_ID || 'NOT_SET' }}
      ECAN_TENCENT_SECRET_KEY: ${{ secrets.ECAN_TENCENT_SECRET_KEY || 'NOT_SET' }}
      VERSION:                 ${{ inputs.version }}
      ENVIRONMENT:             ${{ inputs.environment }}
      CHANNEL:                 ${{ inputs.channel }}
      USER_PREFIX:             ${{ inputs.user-prefix }}
      APP_NAME:                ${{ inputs.app-name }}
      WINDOWS_BUILD_RESULT:    ${{ inputs.windows-build-result }}
      MACOS_BUILD_RESULT:      ${{ inputs.macos-build-result }}
      LINUX_RESULT:            ${{ inputs.linux-result }}
      WINDOWS_DIRECT_UPLOAD:   ${{ inputs.windows-direct-upload && 'true' || 'false' }}
      MACOS_BUILT_AMD64:       ${{ inputs.macos-built-amd64 && 'true' || 'false' }}
      MACOS_BUILT_AARCH64:     ${{ inputs.macos-built-aarch64 && 'true' || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          # resolve_ota_bucket.py reads ota_config.yaml (pyyaml only).
          # No cloud SDK needed — no boto3, no cos-python-sdk-v5.
          cache-dependency-path: 'build_system/scripts/requirements-cos.txt'

      - name: Install dependencies
        run: pip install -r build_system/scripts/requirements-cos.txt

      - name: Resolve OTA bucket from config
        id: resolve
        run: |
          # Read the bucket / region / prefix from ota/config/ota_config.yaml
          # — same source upload_to_cos.py reads — and export to env.
          #
          # Render-side variables (BUCKET_NAME / BUCKET_REGION) are the
          # ones render_download_links.py reads directly, so we re-export
          # them here too. They cannot live in jobs.<id>.env: because
          # GHA's schema lint resolves `env.X` against the static
          # job-env dict before any step runs, so a `BUCKET_NAME:
          # ${{ env.OTA_BUCKET }}` line there would always trip
          # "Unrecognized named-value: 'env'". Teeing the aliases into
          # $GITHUB_ENV lets the step-scoped env (and the Python
          # script) see them, and keeps `ota_config.yaml` as the
          # single source of truth on both sides.
          python3 build_system/scripts/resolve_ota_bucket.py \
            --app cn \
            --env "${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "BUCKET_NAME=${OTA_BUCKET}" >> "$GITHUB_ENV"
          echo "BUCKET_REGION=${OTA_REGION}" >> "$GITHUB_ENV"
      - name: Download Windows artifacts
        if: >-
          inputs.windows-build-result == 'success' &&
          inputs.windows-direct-upload != true
        uses: actions/download-artifact@v7
        with:
          name: eCan-windows-amd64-${{ inputs.version }}-installer
          path: windows-artifacts
        continue-on-error: true

      # Direct-upload fast path: when the build job uploaded to COS/S3
      # directly (no `*-installer` artifact in GHA artifact store), fall
      # back to synthesising the expected installer filename from
      # `version` + `app-name`. The bucket URL is still constructed from
      # the same `{prefix}/releases/v{ver}/...` template the upload
      # scripts use, so the resulting link is byte-identical to what the
      # GHA-artifact-store path would have produced. We only lose the
      # file-size column (which is not authoritative anyway — the COS
      # object metadata is the source of truth).
      - name: Synthesize Windows installer filename (direct-upload fallback)
        if: >-
          inputs.windows-build-result == 'success' &&
          inputs.windows-direct-upload == true
        shell: bash
        env:
          VERSION:  ${{ inputs.version }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          mkdir -p windows-artifacts
          # build.py's installer filename template is
          # `<APP_NAME>-{version}-windows-amd64-Setup.exe` (see
          # build_system/ecan_build.py:installer_filename). Touch an
          # empty stub file with that name so the downstream
          # `for file in windows-artifacts/*.exe` loop finds it; the
          # Size column will be empty because we don't have the actual
          # file, which the loop already handles (`du -sh` returns
          # `0K` for an empty file).
          installer="${APP_NAME}-${VERSION}-windows-amd64-Setup.exe"
          : > "windows-artifacts/${installer}"
          echo "[INFO] Synthesized direct-upload fallback: ${installer}"
          # The `Resolve COS object sizes` step runs after this and
          # queries COS HeadObject for the real byte count. The
          # renderer then substitutes that count into the Size
          # column. We deliberately do NOT write anything to
          # $GITHUB_STEP_SUMMARY here — the final summary is
          # rendered once, in one place, by the renderer step.

      - name: Download macOS amd64 artifacts
        if: inputs.macos-build-result == 'success' && inputs.macos-built-amd64 == true
        uses: actions/download-artifact@v7
        with:
          name: eCan-macos-amd64-${{ inputs.version }}-installer
          path: macos-amd64-artifacts
        continue-on-error: true

      - name: Download macOS aarch64 artifacts
        if: inputs.macos-build-result == 'success' && inputs.macos-built-aarch64 == true
        uses: actions/download-artifact@v7
        with:
          name: eCan-macos-aarch64-${{ inputs.version }}-installer
          path: macos-aarch64-artifacts
        continue-on-error: true

      - name: Download Linux artifacts
        if: inputs.linux-result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: eCan-linux-amd64-${{ inputs.version }}-installer
          path: linux-artifacts
        continue-on-error: true

      - name: Merge macOS artifacts
        if: inputs.macos-build-result == 'success'
        run: |
          mkdir -p macos-artifacts
          for d in macos-amd64-artifacts macos-aarch64-artifacts; do
            if [ -d "$d" ]; then
              cp "$d"/* macos-artifacts/ 2>/dev/null || true
            fi
          done

      # When any build took the direct-upload fast path, the GHA
      # artifact store does not have the file, so we have to ask COS for
      # its real size via HeadObject. Without this step, the summary
      # would show "(missing — check bucket)" for those rows. Even when
      # the artifact IS in GHA, the local copy's size is authoritative
      # for that row (render_download_links.py picks local over remote
      # when both are present), so we only need the COS probe for
      # direct-uploaded artifacts.
      #
      # Probing is best-effort: if the SDK is unavailable or auth fails,
      # the step warns and continues with empty sizes — the summary
      # simply falls back to the GHA-artifact / "missing" path.
      - name: Resolve COS object sizes (direct-upload fallback)
        id: cos-sizes
        if: >-
          (inputs.windows-build-result == 'success' && inputs.windows-direct-upload == true)
        env:
          EXPECTED: >-
            windows/amd64/${{ inputs.app-name }}-${{ inputs.version }}-windows-amd64-Setup.exe
        run: |
          set -euo pipefail
          COS_PREFIX="${OTA_PREFIX}"
          case "${ENVIRONMENT}" in
            development) COS_PREFIX="${COS_PREFIX:-dev}" ;;
            test)        COS_PREFIX="${COS_PREFIX:-test}" ;;
            staging)     COS_PREFIX="${COS_PREFIX:-staging}" ;;
            production)  COS_PREFIX="${COS_PREFIX:-production}" ;;
            *)           COS_PREFIX="${COS_PREFIX:-${ENVIRONMENT}}" ;;
          esac
          # shellcheck disable=SC2086
          python3 build_system/scripts/resolve_cos_sizes.py \
            --bucket   "${OTA_BUCKET}" \
            --region   "${OTA_REGION}" \
            --env-prefix "${COS_PREFIX}" \
            --version  "${VERSION}" \
            --user-prefix "${USER_PREFIX}" \
            --expected ${EXPECTED} \
            --out      cos-sizes.env \
          || echo "[WARN] COS size resolution failed; summary will show 'missing' for direct-uploaded rows." >&2
          echo "COS_SIZES_FILE=${GITHUB_WORKSPACE}/cos-sizes.env" >> "$GITHUB_ENV"

      - name: Render download links summary
        env:
          COS_SIZES_FILE: ${{ env.COS_SIZES_FILE }}
        run: |
          set -euo pipefail
          COS_PREFIX="${OTA_PREFIX}"
          case "${ENVIRONMENT}" in
            development) COS_PREFIX="${COS_PREFIX:-dev}" ;;
            test)        COS_PREFIX="${COS_PREFIX:-test}" ;;
            staging)     COS_PREFIX="${COS_PREFIX:-staging}" ;;
            production)  COS_PREFIX="${COS_PREFIX:-production}" ;;
            *)           COS_PREFIX="${COS_PREFIX:-${ENVIRONMENT}}" ;;
          esac

          python3 build_system/scripts/render_download_links.py \
            --scheme      cos \
            --summary-out download-links-summary.md \
            --text-out    "download-links-cn-${VERSION}.txt" \
            --url-pattern "https://{bucket-with-APPID}.cos.{region}.myqcloud.com/{env}/releases/v{ver}/{platform}/{arch}/{file}" \
            --workflow-name "release-cn.yml / shared-cos-download-links.yml"

      - name: Append Markdown summary to step summary
        if: always()
        run: |
          # The renderer writes Markdown to a file; we append it to the
          # GitHub Actions step summary in a separate step so that any
          # error in the renderer is reported on its own (rather than
          # silently dropping the whole summary).
          if [ -f download-links-summary.md ]; then
            cat download-links-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Download-links summary was not generated (renderer failed)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload download links document artifact
        uses: actions/upload-artifact@v6
        with:
          name: download-links-cn-${{ inputs.version }}
          path: download-links-cn-${{ inputs.version }}.txt
          if-no-files-found: warn
