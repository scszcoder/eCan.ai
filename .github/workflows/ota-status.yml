# ============================================================================
# OTA Status (read-only) — free status page for the rollout control plane
# ============================================================================
#
# Shows, for one app/env/channel:
#   - current rollout.json (version / percent / paused / whitelist)
#   - what latest.json currently advertises as published
#   - which universal releases exist in the bucket
#
# Never writes anything: it only runs `set_rollout.py --status`.
# Run it after every promote-release run (or on demand) to confirm the
# control plane matches intent.
# ============================================================================

name: OTA Status

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Target app (cn = COS / intl = S3)'
        required: true
        default: 'cn'
        type: choice
        options:
          - cn
          - intl
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - test
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - dev

permissions:
  contents: read

jobs:
  status:
    name: status (${{ inputs.app }} / ${{ inputs.environment }} / ${{ inputs.channel }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            build_system/scripts/requirements-cos.txt
            build_system/scripts/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r build_system/scripts/requirements-cos.txt \
                      -r build_system/scripts/requirements.txt

      - name: Read rollout status
        shell: bash
        env:
          APP: ${{ inputs.app }}
          ENVIRONMENT: ${{ inputs.environment }}
          CHANNEL: ${{ inputs.channel }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          ECAN_TENCENT_SECRET_ID: ${{ secrets.ECAN_TENCENT_SECRET_ID }}
          ECAN_TENCENT_SECRET_KEY: ${{ secrets.ECAN_TENCENT_SECRET_KEY }}
          ECAN_TENCENT_REGION: ${{ secrets.ECAN_TENCENT_REGION || 'ap-guangzhou' }}
        run: |
          python3 build_system/scripts/set_rollout.py \
            --app "$APP" --env "$ENVIRONMENT" --channel "$CHANNEL" \
            --status --summary "$GITHUB_STEP_SUMMARY"
