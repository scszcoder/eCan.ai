          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::secrets.GITEE_TOKEN is empty or unset. The release-cn workflow checks out from https://gitee.com/.../eCan.ai via HTTPS Basic auth, which requires a valid Gitee private access token. Configure the token at Settings → Secrets and variables → Actions → GITEE_TOKEN. Without it, actions/checkout@v6 cannot authenticate and the workflow fails with 'fatal: could not read Username for https://gitee.com' — the very symptom this step is meant to replace."
            exit 1
          fi
          TOKEN_LEN=$(printf '%s' "$GITEE_TOKEN" | wc -c | tr -d ' ')
          echo "[OK] GITEE_TOKEN present (length=${TOKEN_LEN} bytes)"

      - name: Checkout from Gitee mirror
        uses: actions/checkout@v6
        with:
          repository: songszchen/eCan.ai
          ref: ${{ github.event.inputs.ref || github.ref }}
          github-server-url: https://gitee.com
          token: ${{ secrets.GITEE_TOKEN }}
          fetch-depth: 1

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          platform: linux
          requirements-file: requirements-linux.txt
          architecture: x64

      - name: Install app-specific dependencies
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -r "requirements-cn.txt"

