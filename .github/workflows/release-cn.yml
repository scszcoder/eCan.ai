# ============================================================================
# Release Pipeline — eCan.cn (China / Tencent Cloud app)
# ============================================================================
#
# Mirror image of release-intl.yml. Each app (intl vs cn) owns a fully
# closed release loop on its own backend: intl → S3, cn → COS. They are
# filed as two SEPARATE workflows so a bug in one cannot ever affect the
# other (no shared if: app == ... branching, no cross-pollination through
# needs chains that include the wrong upload bucket).
#
# What this file owns (CN):
#   * artifact target: Tencent Cloud COS (shared-cos-upload.yml)
#   * OTA feed source: Sparkle appcast over COS (shared-cos-appcast-generation.yml)
#
# What it does NOT own:
#   * international / AWS S3 artifacts  →  see release-intl.yml
#
# Source repository:
#   This workflow pulls source from the Gitee mirror
#   (https://gitee.com/songszchen/eCan.ai.git) instead of GitHub
#   directly. The mirror is kept in sync by
#   .github/workflows/sync-to-gitee.yml, which fires on every push
#   to any branch or tag and is also re-run every 6 hours as a
#   safety net. The same GITEE_TOKEN secret is shared between the
#   two workflows. The auth token is informational for a public
#   mirror; passing it makes this configuration robust if the mirror
#   is ever flipped private without touching the workflow again.
#
#   We do NOT use actions/checkout@v6 for the Gitee pull.
#   actions/checkout@v6, when given a non-github.com server URL and
#   a PAT, issues an HTTP basic-auth header with username
#   x-access-token (the GitHub PAT convention). Gitee's Git
#   Smart-HTTP endpoint accepts oauth2:<token> but rejects
#   x-access-token:<token> with HTTP 401 — that's why
#   sync-to-gitee (which uses GIT_ASKPASS returning oauth2) works
#   while earlier releases of this workflow (which used
#   actions/checkout+v6's extraheader) failed with
#   'fatal: Authentication failed for https://gitee.com/...'.
#   Instead, the Checkout from Gitee mirror step in each job runs
#   plain git init + git fetch with a job-scoped GIT_ASKPASS that
#   returns username=oauth2 / password=$GITEE_TOKEN — the same shape
#   that sync-to-gitee uses and that Gitee accepts.
#
# Per build job:
#   * platform/windows/macos/linux are independent jobs (parallel).
#   * macOS has an extra dimension (amd64 vs aarch64) so 4 build jobs total
#     (windows, macos-amd64, macos-aarch64, linux).
#   * arch input narrows the matrix (aarch64 only triggers macOS-arm jobs).
#
# Layout:
#   validate-tag ──┬── build-windows ─────────────┐
#                  ├── build-macos-amd64 ────────┐│
#                  ├── build-macos-aarch64 ──────┤│
#                  └── build-linux ──────────────┤│
#                                                ▼│
#                                            upload-to-s3
#                                                │
#                                                ▼
#                                          generate-appcast
#                                          (--platform all --arch all)
#                                                │
#                  ┌─────────────────────────────┤
#                  ▼                             ▼
#             generate-latest.json     generate-download-links
#                                                │
#                                                ▼
#                                          final-status
# ============================================================================

name: Release (CN)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform (all/windows/macos/linux)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      arch:
        description: 'CPU architecture (all/amd64/aarch64)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - aarch64
      ref:
        description: 'Git ref to build (empty = use workflow branch)'
        required: false
        default: ''
        type: string

      environment:
        description: 'Target environment: production/staging/test/development, or empty for auto-detect'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - ''
          - staging
          - test
          - development

      channel:
        description: 'Release channel: stable/beta/nightly/dev, or empty for auto-detect'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - ''
          - beta
          - nightly
          - dev

      upload_artifacts:
        description: 'Mirror builds to GitHub Artifacts (for debugging only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

      runner_group:
        description: 'Runner family: github-hosted (default) or ecan-* self-hosted'
        required: true
        default: 'github-hosted'
        type: choice
        options:
          - github-hosted
          - ecan-linux-amd64
          - ecan-windows-amd64
          - ecan-macos-amd64
          - ecan-macos-aarch64

concurrency:
  # Per-ref × matrix × runner scope. Two manual runs with different
  # platform/arch inputs don't fight each other; two runs with identical
  # inputs don't double the cost.
  group: release-cn-${{ github.ref }}-${{ github.event.inputs.platform }}-${{ github.event.inputs.arch }}-${{ github.event.inputs.runner_group }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Stage 1 — Validate ref & compute version + environment + channel
  # ──────────────────────────────────────────────────────────────────────
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag-valid:      ${{ steps.validate.outputs.valid }}
      version:        ${{ steps.validate.outputs.version }}
      is-branch:      ${{ steps.validate.outputs.is_branch }}
      ref-name:       ${{ steps.validate.outputs.ref_name }}
      user-prefix:    ${{ steps.validate.outputs.user_prefix }}
      tag-name:       ${{ steps.validate.outputs.tag_name }}
      environment:    ${{ steps.detect-env.outputs.environment }}
      channel:        ${{ steps.detect-env.outputs.channel }}
    steps:
      # Self-hosted Windows runner prerequisite check + install:
      # Git Bash + PowerShell 7 (pwsh.exe) must be reachable
      # for shell: bash and shell: pwsh steps.
      #
      # GitHub Actions' shell: bash on Windows resolves to
      # C:\Program Files\Git\bin\bash.EXE. On a GitHub-hosted
      # Windows runner the runner-images include Git for Windows
      # in the default PATH, so bash is found. On a self-hosted
      # Windows runner that's been registered with
      # register_runner.ps1, the installer's per-user PATH is
      # added to the *user* shell — but the
      # actions.runner.*-svc Windows service account that
      # actually executes jobs starts with the SYSTEM-level
      # PATH, which does NOT inherit Git for Windows' bin
      # directory.
      #
      # Symptom: every step with shell: bash fails with
      # ##[error]bash: command not found within the first few
      # lines (see logs #86661348651 for the canonical example).
      #
      # Contract: this step is **idempotent**. For each
      # prerequisite:
      #   - present on the runner → no-op (the
      #     common case once register_runner.ps1 + §九.3.1
      #     have been run once)
      #   - missing → install via winget (or MSI fallback) and
      #     wait until reachable
      #   - both fail (winget / network blocked) → emit
      #     ::error:: and exit 1, telling the operator
      #     what is broken and how to fix it on the runner
      #     (docs §九.3.1)
      #
      # if: runner.os == 'Windows' skips this step on the
      # macOS and Linux build jobs.
      #
      # Shell: shell: powershell (Windows PowerShell 5.1, ships
      # with every Windows install since Win7/2008R2). NOT
      # shell: pwsh — PowerShell 7 (pwsh.exe) is a *separate*
      # install that is NOT on the default PATH on either
      # GitHub-hosted or self-hosted Windows runners. On
      # GitHub-hosted runners GHA maps powershell →
      # C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      # which is always on the SYSTEM-level PATH inherited by
      # the runner service.
      #
      # Why this step is idempotent end-to-end:
      #   - The GHA runner invokes shell: powershell steps via
      #     powershell -command ". '<guid>.ps1'" (dot-sources a
      #     temp file in _work\_temp). That requires the
      #     SYSTEM ExecutionPolicy to NOT be Restricted. GitHub-
      #     hosted runners override this via Group Policy to
      #     RemoteSigned; self-hosted runners get the same
      #     override via register_runner.ps1 (which sets
      #     LocalMachine=RemoteSigned then restarts the
      #     service). If the operator skipped that step, this
      #     preflight fails immediately with a precise ::error::
      #     pointing at register_runner.ps1 instead of a cryptic
      #     ##[error]Process completed with exit code 1.
      #   - Git Bash is detected via Test-Path. If present, this
      #     step is a no-op cost (a few cmdlets). If absent, this
      #     step downloads and runs the Git for Windows installer —
      #     idempotent on re-run.
      #   - PowerShell 7 is detected via Test-Path. If present,
      #     no-op. If absent, downloads and runs the PowerShell 7 MSI
      #     installer directly (no winget dependency).
      #
      # Reference: https://github.com/actions/runner/issues/497
      # Reference: https://github.com/actions/runner/blob/main/src/Runner.Worker/Handlers/ScriptHandlerHelpers.cs
      - name: Ensure Git Bash + PowerShell 7 are on runner-service PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Probe PowerShell 7 + Git Bash via the dedicated helper.
          # This handles non-standard installs (operator-style
          # C:\Users\<user>\opt\pwsh7\, scoop, choco-shim dirs)
          # before falling back to auto-install. Without the
          # probe-first check, an auto-install would shadow an
          # existing install at a non-canonical path
          # (run #86820634953).
          $helper = Join-Path $env:GITHUB_WORKSPACE 'build_system/scripts/runner/find-prerequisites.ps1'
          if (Test-Path -LiteralPath $helper) {
            . $helper
          } else {
            # Inline fallback for older checkouts. Same
            # candidate list, same probe-first install-fallback
            # semantics as find-prerequisites.ps1. Crucially,
            # candidates are checked BEFORE `Get-Command`, so the
            # canonical C:\Program Files\Git\bin\bash.exe wins
            # over the WSL/Cygwin placeholder at
            # C:\Windows\System32\bash.exe that Get-Command
            # would otherwise return on GitHub-hosted windows-latest
            # (see actions/runner-images#12646).
            function Find-PwshLocation {
              foreach ($c in @("$env:ProgramFiles\PowerShell\7\pwsh.exe", "${env:ProgramFiles(x86)}\PowerShell\7\pwsh.exe", "$env:LOCALAPPDATA\Programs\PowerShell\7\pwsh.exe", "$env:USERPROFILE\opt\pwsh7\pwsh.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Find-BashLocation {
              foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe", "$env:USERPROFILE\scoop\apps\git\current\bin\bash.exe", "$env:ProgramData\chocolatey\bin\bash.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command bash.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Get-PwshDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
            function Get-BashDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
          }

          $gitBashInstallDir = 'C:\Program Files\Git'
          $gitBashBin       = Join-Path $gitBashInstallDir 'bin\bash.exe'
          $pwshInstallDir   = 'C:\Program Files\PowerShell\7'
          $pwshBin          = Join-Path $pwshInstallDir   'pwsh.exe'

          # --- (1) PowerShell ExecutionPolicy sanity check ---
          # Read directly from registry (Get-ExecutionPolicy
          # -List triggers loading of Microsoft.PowerShell.Security
          # whose Security.types.ps1xml fails AuthorizationManager
          # validation on some pwsh 7 installations).
          $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          if (-not $effectiveEp) {
            $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\7\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          }
          if (-not $effectiveEp) { $effectiveEp = 'RemoteSigned' }
          if ($effectiveEp -eq 'Restricted') {
            Write-Host "::error::PowerShell ExecutionPolicy (LocalMachine) is Restricted. The GHA runner dot-sources inline scripts via `powershell -command \". '<guid>.ps1'\"`, which Restricted rejects with `UnauthorizedAccess` BEFORE any step body runs. GitHub-hosted runners override this via Group Policy to `RemoteSigned`; self-hosted runners must do the same. Run on the runner machine (elevated PowerShell): `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force`, then restart the runner service (`C:\actions-runner\svc.cmd stop && C:\actions-runner\svc.cmd start`). This is set automatically by build_system/scripts/runner/setup-prerequisites.ps1 on the runner -- if it's still missing, run that script first."
            exit 1
          }
          Write-Host "[OK] PowerShell ExecutionPolicy (LocalMachine): $effectiveEp"

          # --- (2) Git Bash (PROBE-THEN-INSTALL) ---
          $gitBashBin = Find-BashLocation
          if ($gitBashBin) {
            Write-Host "[OK] Git Bash found at $gitBashBin (no install needed)"
          } else {
            Write-Host "[INFO] Git Bash not found via probe -- installing via direct download"
            $gitExe = "$env:TEMP\Git-Setup.exe"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $gitExe "https://github.com/git-for-windows/git/releases/download/v2.46.0.windows.1/Git-2.46.0-64-bit.exe"
              # Inno Setup /DIR expects the install TARGET dir
              # (parent of bin/), NOT bin/ subdir.
              Start-Process -Wait -FilePath $gitExe -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', "/DIR$gitBashInstallDir"
              Remove-Item $gitExe -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::Git for Windows install failed: $($_.Exception.Message). Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            if (-not (Test-Path $gitBashBin)) {
              Write-Host "::error::Git for Windows installer ran but $gitBashBin is still missing. Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            Write-Host "[OK] Git Bash installed at $gitBashBin"
          }
          $gitBashDir = Get-BashDir -BashPath $gitBashBin

          # (2b) Git Bash's bin directory on the runner-service
          # PATH? Git for Windows' installer only adds to user
          # PATH, but the service inherits SYSTEM PATH. Forward
          # to $GITHUB_PATH so all subsequent steps in this job
          # see it (and the service-level PATH still needs to be
          # set on the runner -- see docs 九.3.1).
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$gitBashDir*") {
            $gitBashDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$gitBashDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] Git Bash already on service PATH"
          }

          # --- (3) PowerShell 7 (PROBE-THEN-INSTALL) ---
          $pwshBin = Find-PwshLocation
          if ($pwshBin) {
            Write-Host "[OK] PowerShell 7 found at $pwshBin (no install needed)"
          } else {
            Write-Host "[INFO] PowerShell 7 not found via probe -- installing via direct MSI download"
            $msi = "$env:TEMP\pwsh.msi"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $msi "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
              # Start-Process -PassThru captures the real MSI exit
              # code; `msiexec ... | Out-Null` is unreliable
              # (msiexec is GUI-subsystem, PowerShell doesn't
              # block, $LASTEXITCODE reflects last NATIVE cmd).
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                Write-Host "::error::PowerShell 7 MSI install failed with exit code $($proc.ExitCode). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
                exit 1
              }
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::PowerShell 7 install failed: $($_.Exception.Message). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            if (-not (Test-Path $pwshBin)) {
              Write-Host "::error::PowerShell 7 install reported success but $pwshBin is still missing. Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            Write-Host "[OK] PowerShell 7 installed at $pwshBin"
          }
          $pwshDir = Get-PwshDir -PwshPath $pwshBin

          # (3b) PowerShell 7's directory on the runner-service PATH?
          # Same reasoning as (2b) for Git Bash: the service runs as
          # SYSTEM and inherits SYSTEM PATH, not the user's. Forward
          # to $GITHUB_PATH so bash/git operations that invoke pwsh
          # as a sub-shell (e.g. git config --list | pwsh -c "...")
          # do not fail with "command not found".
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$pwshDir*") {
            $pwshDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$pwshDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] PowerShell 7 already on service PATH"
          }

          # --- (4) Final summary ---
          Write-Host "[OK] Prerequisite check complete: Git Bash + PowerShell 7 reachable, ExecutionPolicy=$($effectiveEp)"

      - name: Validate Gitee credentials
        # Diagnostic guard for the 'fatal: could not read Username
        # for https://gitee.com' checkout failure.
        #
        # Two changes vs. the previous revision:
        #   1. Removed the if: github.server_url != 'https://github.com'
        #      guard. That guard made this step a silent no-op on the
        #      validate-tag job (which runs on GitHub-hosted
        #      ubuntu-latest and *also* checks out from Gitee), so an
        #      empty token there would only surface later as a
        #      confusing 'could not read Username' from actions/checkout.
        #      Now we always run this step on every job.
        #   2. Output a SHA256 fingerprint (8 hex chars) instead of
        #      just the byte length. Length is a weak check (a token
        #      with a trailing newline still has the right byte count
        #      but a different fingerprint, and 'echo' / shell
        #      substitution in the secret field can add CR + LF on
        #      copy-paste). Fingerprint lets us compare across jobs /
        #      runs without leaking the token itself.
        #
        # Runs under pwsh (PowerShell 7). On GitHub-hosted runners
        # (ubuntu-latest / macos-latest) pwsh 7 is preinstalled and
        # reachable as `pwsh`. On self-hosted Windows the previous
        # "Ensure ..." step adds pwsh.exe to GITHUB_PATH so this
        # step finds it.
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GITEE_TOKEN)) {
            '::error::secrets.GITEE_TOKEN is empty or unset. The release-cn workflow fetches source from https://gitee.com/songszchen/eCan.ai.git using a job-scoped GIT_ASKPASS that needs GITEE_TOKEN as the password (the username is hard-coded to ''oauth2''). Configure the token at Settings → Secrets and variables → Actions → GITEE_TOKEN. Without it, `git fetch origin` exits 128 with ''terminal prompts disabled'' — the very symptom this step is meant to replace.'
            exit 1
          }
          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) so the fingerprint is stable across jobs.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($clean)
          $hash  = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $fpr   = ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "[OK] GITEE_TOKEN present (length=$($bytes.Length) bytes, sha256=$($fpr.Substring(0,8)))"

      - name: Checkout from GitHub
        # validate-tag always needs to checkout from GitHub to read
        # VERSION file and validate the ref format. This step runs
        # regardless of runner_group since this job doesn't need Gitee.
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Validate and extract version
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          INPUT_REF="${{ github.event.inputs.ref }}"
          REF_FULL="${GITHUB_REF}"

          if [ -n "$INPUT_REF" ]; then
            REF_NAME="$INPUT_REF"
            echo "✅ Using manual ref: $REF_NAME"
          else
            REF_NAME="${REF_FULL#refs/*/}"
            echo "✅ Auto-sync: Using workflow branch as ref: $REF_NAME"
          fi

          echo "ref_name=$REF_NAME" >> $GITHUB_OUTPUT

          if ! (git show-ref --verify --quiet "refs/heads/$REF_NAME" 2>/dev/null || \
                git show-ref --verify --quiet "refs/tags/$REF_NAME" 2>/dev/null); then
            # Only the ref we asked for was fetched (see
            # Checkout from Gitee mirror above), so we can't list
            # 'available' refs without another fetch. Print the
            # current HEAD instead and tell the operator to verify
            # on the Gitee mirror web UI.
            echo "[ERROR] Ref '$REF_NAME' does not exist!"
            echo "Currently fetched commit: $(git rev-parse --short HEAD 2>/dev/null || echo none)"
            echo "Verify the ref on https://gitee.com/songszchen/eCan.ai (branches & tags pages)."
            exit 1
          fi

          # Semver OR user-prefixed tag.
          # Reserved prefixes (rc, beta, alpha, dev, nightly, pre, preview,
          # snapshot) are forbidden so a tag like rc_v1.0.0 can never be
          # mistaken for a user build by the client-side splitter in
          # ota/core/appcast.py::_split_user_prefix.
          SEMVER_RE='^v[0-9]+(\.[0-9]+)+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'
          PREFIXED_RE='^([A-Za-z][A-Za-z0-9]{0,31})_v[0-9]+(\.[0-9]+)+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'

          if [[ "$REF_NAME" =~ $SEMVER_RE ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "is_branch=false" >> $GITHUB_OUTPUT
            echo "version=${REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "user_prefix=" >> $GITHUB_OUTPUT
            echo "tag_name=${REF_NAME}" >> $GITHUB_OUTPUT
            echo "Tag detected: $REF_NAME"
          elif [[ "$REF_NAME" =~ $PREFIXED_RE ]]; then
            USER_PREFIX_RAW="${BASH_REMATCH[1]}"
            USER_PREFIX="${USER_PREFIX_RAW,,}"
            case "$USER_PREFIX" in
              rc|beta|alpha|dev|nightly|pre|preview|snapshot)
                echo "[ERROR] Tag prefix '$USER_PREFIX_RAW' is a reserved prerelease keyword."
                echo "Reserved prefixes: rc, beta, alpha, dev, nightly, pre, preview, snapshot"
                echo "Pick a different prefix (e.g. your username)."
                exit 1
                ;;
            esac
            VERSION_CORE="${REF_NAME#${USER_PREFIX_RAW}_v}"
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "is_branch=false" >> $GITHUB_OUTPUT
            echo "version=$VERSION_CORE" >> $GITHUB_OUTPUT
            echo "user_prefix=$USER_PREFIX" >> $GITHUB_OUTPUT
            echo "tag_name=${REF_NAME}" >> $GITHUB_OUTPUT
            echo "User-prefixed tag detected: prefix=$USER_PREFIX, core=$VERSION_CORE"
          else
            # Branch: read VERSION file as base version
            if [ -f "VERSION" ]; then
              BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
              echo "Read base version from VERSION file: $BASE_VERSION"
            else
              BASE_VERSION="0.0.0"
              echo "VERSION file not found, using default: $BASE_VERSION"
            fi

            SHORT_SHA=$(git rev-parse --short HEAD)
            SAFE_BRANCH=$(echo "$REF_NAME" | tr '/' '-')
            FALLBACK="${BASE_VERSION}-${SAFE_BRANCH}-${SHORT_SHA}"
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "is_branch=true" >> $GITHUB_OUTPUT
            echo "version=$FALLBACK" >> $GITHUB_OUTPUT
            echo "user_prefix=" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
            echo "Branch detected: $REF_NAME -> version=$FALLBACK"
          fi

      - name: Detect environment and channel
        id: detect-env
        shell: bash
        run: |
          REF_NAME="${{ steps.validate.outputs.ref_name }}"
          VERSION="${{ steps.validate.outputs.version }}"
          INPUT_ENV="${{ github.event.inputs.environment }}"
          INPUT_CHANNEL="${{ github.event.inputs.channel }}"

          echo "=== Detecting Environment ==="
          echo "Ref: $REF_NAME"
          echo "Version: $VERSION"

          IS_TAG=false
          if [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+.*$ ]]; then
            IS_TAG=true
          fi

          IS_STAGING_ELIGIBLE=false
          if [[ "$IS_TAG" == "true" ]] || \
             [[ "$REF_NAME" == "main" ]] || [[ "$REF_NAME" == "master" ]]; then
            IS_STAGING_ELIGIBLE=true
          fi

          if [[ -n "$INPUT_ENV" ]]; then
            ENV="$INPUT_ENV"

            # Production via branch must be main/master
            if [[ "$ENV" == "production" ]] && [[ "$IS_TAG" == "false" ]]; then
              if [[ "$REF_NAME" != "main" && "$REF_NAME" != "master" ]]; then
                echo "ERROR: Only main/master branches can use production environment"
                exit 1
              fi
            fi

            if [[ "$IS_STAGING_ELIGIBLE" == "false" ]] && [[ "$ENV" == "staging" ]]; then
              echo "ERROR: Branch '$REF_NAME' cannot use staging environment"
              exit 1
            fi

            echo "Using manual environment: $ENV"
          else
            if [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
              ENV="production"
            elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+-rc\. ]]; then
              ENV="production"
            elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+-beta ]]; then
              ENV="staging"
            elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+-alpha ]]; then
              ENV="test"
            elif [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
              ENV="production"
            elif [[ "$REF_NAME" == "staging" ]]; then
              ENV="staging"
            elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "dev" ]]; then
              ENV="development"
            else
              ENV="development"
            fi
            echo "Auto-detected environment: $ENV"
          fi

          if [[ -n "$INPUT_CHANNEL" ]]; then
            CHANNEL="$INPUT_CHANNEL"
            echo "Using manual channel: $CHANNEL"
          else
            if [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
              CHANNEL="stable"
            elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+-rc\. ]]; then
              CHANNEL="beta"
            elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+-beta ]]; then
              CHANNEL="beta"
            elif [[ "$REF_NAME" =~ ^v[0-9]+(\.[0-9]+)+-alpha ]]; then
              CHANNEL="dev"
            elif [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
              CHANNEL="nightly"
            elif [[ "$REF_NAME" == "staging" ]]; then
              CHANNEL="stable"
            elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "dev" ]]; then
              CHANNEL="dev"
            else
              CHANNEL="dev"
            fi
            echo "Auto-detected channel: $CHANNEL"
          fi

          # production/stable requires tags (no branch overwrite)
          IS_BRANCH="${{ steps.validate.outputs.is_branch }}"
          if [[ "$ENV" == "production" ]] && [[ "$CHANNEL" == "stable" ]] && [[ "$IS_TAG" == "false" ]]; then
            echo "ERROR: production/stable requires version tags"
            exit 1
          fi

          if [[ "$ENV" == "staging" ]] && [[ "$IS_STAGING_ELIGIBLE" == "false" ]]; then
            echo "ERROR: Staging requires tags or main/master/staging branches"
            exit 1
          fi

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Final environment: $ENV"
          echo "Final channel: $CHANNEL"

  # ──────────────────────────────────────────────────────────────────────
  # Stage 2 — Build matrix (Intl): windows, macos×2, linux
  # ──────────────────────────────────────────────────────────────────────

  build-windows:
    name: Build Windows amd64
    needs: validate-tag
    if: |
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all') &&
      (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == '') &&
      (github.event.inputs.runner_group == 'github-hosted' || github.event.inputs.runner_group == 'ecan-windows-amd64')
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-windows-amd64' && fromJSON('["self-hosted","windows","x64","ecan-build"]') || 'windows-latest' }}
    env:
      ECAN_APP_ID: cn
      ECAN_APP_NAME: eCan.cn
      DIST_APP: eCan.cn
      BUILD_ARCH: amd64
      # ── Azure Trusted Signing (cloud HSM, preferred) ──────────────────────
      AZURE_TENANT_ID:           ${{ secrets.AZURE_TENANT_ID           || 'NOT_SET' }}
      AZURE_CLIENT_ID:           ${{ secrets.AZURE_CLIENT_ID           || 'NOT_SET' }}
      AZURE_CLIENT_SECRET:       ${{ secrets.AZURE_CLIENT_SECRET       || 'NOT_SET' }}
      AZURE_SIGNING_ENDPOINT:    ${{ secrets.AZURE_SIGNING_ENDPOINT    || 'NOT_SET' }}
      AZURE_SIGNING_ACCOUNT:     ${{ secrets.AZURE_SIGNING_ACCOUNT     || 'NOT_SET' }}
      AZURE_SIGNING_PROFILE:     ${{ secrets.AZURE_SIGNING_PROFILE     || 'NOT_SET' }}
      # ── PFX fallback (traditional certificate file) ───────────────────────
      WIN_CERT_PFX:              ${{ secrets.WIN_CERT_PFX              || 'NOT_SET' }}
      WIN_CERT_PASSWORD:         ${{ secrets.WIN_CERT_PASSWORD         || 'NOT_SET' }}
    timeout-minutes: 60

    steps:
      # Self-hosted Windows runner prerequisite check + install:
      # Git Bash + PowerShell 7 (pwsh.exe) must be reachable
      # for shell: bash and shell: pwsh steps.
      #
      # GitHub Actions' shell: bash on Windows resolves to
      # C:\Program Files\Git\bin\bash.EXE. On a GitHub-hosted
      # Windows runner the runner-images include Git for Windows
      # in the default PATH, so bash is found. On a self-hosted
      # Windows runner that's been registered with
      # register_runner.ps1, the installer's per-user PATH is
      # added to the *user* shell — but the
      # actions.runner.*-svc Windows service account that
      # actually executes jobs starts with the SYSTEM-level
      # PATH, which does NOT inherit Git for Windows' bin
      # directory.
      #
      # Symptom: every step with shell: bash fails with
      # ##[error]bash: command not found within the first few
      # lines (see logs #86661348651 for the canonical example).
      #
      # Contract: this step is **idempotent**. For each
      # prerequisite:
      #   - present on the runner → no-op (the
      #     common case once register_runner.ps1 + §九.3.1
      #     have been run once)
      #   - missing → install via winget (or MSI fallback) and
      #     wait until reachable
      #   - both fail (winget / network blocked) → emit
      #     ::error:: and exit 1, telling the operator
      #     what is broken and how to fix it on the runner
      #     (docs §九.3.1)
      #
      # if: runner.os == 'Windows' skips this step on the
      # macOS and Linux build jobs.
      #
      # Shell: shell: powershell (Windows PowerShell 5.1, ships
      # with every Windows install since Win7/2008R2). NOT
      # shell: pwsh — PowerShell 7 (pwsh.exe) is a *separate*
      # install that is NOT on the default PATH on either
      # GitHub-hosted or self-hosted Windows runners. On
      # GitHub-hosted runners GHA maps powershell →
      # C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      # which is always on the SYSTEM-level PATH inherited by
      # the runner service.
      #
      # Why this step is idempotent end-to-end:
      #   - The GHA runner invokes shell: powershell steps via
      #     powershell -command ". '<guid>.ps1'" (dot-sources a
      #     temp file in _work\_temp). That requires the
      #     SYSTEM ExecutionPolicy to NOT be Restricted. GitHub-
      #     hosted runners override this via Group Policy to
      #     RemoteSigned; self-hosted runners get the same
      #     override via register_runner.ps1 (which sets
      #     LocalMachine=RemoteSigned then restarts the
      #     service). If the operator skipped that step, this
      #     preflight fails immediately with a precise ::error::
      #     pointing at register_runner.ps1 instead of a cryptic
      #     ##[error]Process completed with exit code 1.
      #   - Git Bash is detected via Test-Path. If present, this
      #     step is a no-op cost (a few cmdlets). If absent, this
      #     step downloads and runs the Git for Windows installer —
      #     idempotent on re-run.
      #   - PowerShell 7 is detected via Test-Path. If present,
      #     no-op. If absent, downloads and runs the PowerShell 7 MSI
      #     installer directly (no winget dependency).
      #
      # Reference: https://github.com/actions/runner/issues/497
      # Reference: https://github.com/actions/runner/blob/main/src/Runner.Worker/Handlers/ScriptHandlerHelpers.cs
      - name: Ensure Git Bash + PowerShell 7 are on runner-service PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Probe PowerShell 7 + Git Bash via the dedicated helper.
          # This handles non-standard installs (operator-style
          # C:\Users\<user>\opt\pwsh7\, scoop, choco-shim dirs)
          # before falling back to auto-install. Without the
          # probe-first check, an auto-install would shadow an
          # existing install at a non-canonical path
          # (run #86820634953).
          $helper = Join-Path $env:GITHUB_WORKSPACE 'build_system/scripts/runner/find-prerequisites.ps1'
          if (Test-Path -LiteralPath $helper) {
            . $helper
          } else {
            # Inline fallback for older checkouts. Same
            # candidate list, same probe-first install-fallback
            # semantics as find-prerequisites.ps1. Crucially,
            # candidates are checked BEFORE `Get-Command`, so the
            # canonical C:\Program Files\Git\bin\bash.exe wins
            # over the WSL/Cygwin placeholder at
            # C:\Windows\System32\bash.exe that Get-Command
            # would otherwise return on GitHub-hosted windows-latest
            # (see actions/runner-images#12646).
            function Find-PwshLocation {
              foreach ($c in @("$env:ProgramFiles\PowerShell\7\pwsh.exe", "${env:ProgramFiles(x86)}\PowerShell\7\pwsh.exe", "$env:LOCALAPPDATA\Programs\PowerShell\7\pwsh.exe", "$env:USERPROFILE\opt\pwsh7\pwsh.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Find-BashLocation {
              foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe", "$env:USERPROFILE\scoop\apps\git\current\bin\bash.exe", "$env:ProgramData\chocolatey\bin\bash.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command bash.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Get-PwshDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
            function Get-BashDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
          }

          $gitBashInstallDir = 'C:\Program Files\Git'
          $gitBashBin       = Join-Path $gitBashInstallDir 'bin\bash.exe'
          $pwshInstallDir   = 'C:\Program Files\PowerShell\7'
          $pwshBin          = Join-Path $pwshInstallDir   'pwsh.exe'

          # --- (1) PowerShell ExecutionPolicy sanity check ---
          # Read directly from registry (Get-ExecutionPolicy
          # -List triggers loading of Microsoft.PowerShell.Security
          # whose Security.types.ps1xml fails AuthorizationManager
          # validation on some pwsh 7 installations).
          $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          if (-not $effectiveEp) {
            $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\7\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          }
          if (-not $effectiveEp) { $effectiveEp = 'RemoteSigned' }
          if ($effectiveEp -eq 'Restricted') {
            Write-Host "::error::PowerShell ExecutionPolicy (LocalMachine) is Restricted. The GHA runner dot-sources inline scripts via `powershell -command \". '<guid>.ps1'\"`, which Restricted rejects with `UnauthorizedAccess` BEFORE any step body runs. GitHub-hosted runners override this via Group Policy to `RemoteSigned`; self-hosted runners must do the same. Run on the runner machine (elevated PowerShell): `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force`, then restart the runner service (`C:\actions-runner\svc.cmd stop && C:\actions-runner\svc.cmd start`). This is set automatically by build_system/scripts/runner/setup-prerequisites.ps1 on the runner -- if it's still missing, run that script first."
            exit 1
          }
          Write-Host "[OK] PowerShell ExecutionPolicy (LocalMachine): $effectiveEp"

          # --- (2) Git Bash (PROBE-THEN-INSTALL) ---
          $gitBashBin = Find-BashLocation
          if ($gitBashBin) {
            Write-Host "[OK] Git Bash found at $gitBashBin (no install needed)"
          } else {
            Write-Host "[INFO] Git Bash not found via probe -- installing via direct download"
            $gitExe = "$env:TEMP\Git-Setup.exe"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $gitExe "https://github.com/git-for-windows/git/releases/download/v2.46.0.windows.1/Git-2.46.0-64-bit.exe"
              # Inno Setup /DIR expects the install TARGET dir
              # (parent of bin/), NOT bin/ subdir.
              Start-Process -Wait -FilePath $gitExe -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', "/DIR$gitBashInstallDir"
              Remove-Item $gitExe -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::Git for Windows install failed: $($_.Exception.Message). Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            if (-not (Test-Path $gitBashBin)) {
              Write-Host "::error::Git for Windows installer ran but $gitBashBin is still missing. Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            Write-Host "[OK] Git Bash installed at $gitBashBin"
          }
          $gitBashDir = Get-BashDir -BashPath $gitBashBin

          # (2b) Git Bash's bin directory on the runner-service
          # PATH? Git for Windows' installer only adds to user
          # PATH, but the service inherits SYSTEM PATH. Forward
          # to $GITHUB_PATH so all subsequent steps in this job
          # see it (and the service-level PATH still needs to be
          # set on the runner -- see docs 九.3.1).
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$gitBashDir*") {
            $gitBashDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$gitBashDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] Git Bash already on service PATH"
          }

          # --- (3) PowerShell 7 (PROBE-THEN-INSTALL) ---
          $pwshBin = Find-PwshLocation
          if ($pwshBin) {
            Write-Host "[OK] PowerShell 7 found at $pwshBin (no install needed)"
          } else {
            Write-Host "[INFO] PowerShell 7 not found via probe -- installing via direct MSI download"
            $msi = "$env:TEMP\pwsh.msi"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $msi "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
              # Start-Process -PassThru captures the real MSI exit
              # code; `msiexec ... | Out-Null` is unreliable
              # (msiexec is GUI-subsystem, PowerShell doesn't
              # block, $LASTEXITCODE reflects last NATIVE cmd).
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                Write-Host "::error::PowerShell 7 MSI install failed with exit code $($proc.ExitCode). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
                exit 1
              }
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::PowerShell 7 install failed: $($_.Exception.Message). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            if (-not (Test-Path $pwshBin)) {
              Write-Host "::error::PowerShell 7 install reported success but $pwshBin is still missing. Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            Write-Host "[OK] PowerShell 7 installed at $pwshBin"
          }
          $pwshDir = Get-PwshDir -PwshPath $pwshBin

          # (3b) PowerShell 7's directory on the runner-service PATH?
          # Same reasoning as (2b) for Git Bash: the service runs as
          # SYSTEM and inherits SYSTEM PATH, not the user's. Forward
          # to $GITHUB_PATH so bash/git operations that invoke pwsh
          # as a sub-shell (e.g. git config --list | pwsh -c "...")
          # do not fail with "command not found".
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$pwshDir*") {
            $pwshDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$pwshDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] PowerShell 7 already on service PATH"
          }

          # --- (4) Final summary ---
          Write-Host "[OK] Prerequisite check complete: Git Bash + PowerShell 7 reachable, ExecutionPolicy=$($effectiveEp)"

      - name: Validate Gitee credentials
        # Diagnostic guard for the 'fatal: could not read Username
        # for https://gitee.com' checkout failure.
        #
        # Two changes vs. the previous revision:
        #   1. Removed the if: github.server_url != 'https://github.com'
        #      guard. That guard made this step a silent no-op on the
        #      validate-tag job (which runs on GitHub-hosted
        #      ubuntu-latest and *also* checks out from Gitee), so an
        #      empty token there would only surface later as a
        #      confusing 'could not read Username' from actions/checkout.
        #      Now we always run this step on every job.
        #   2. Output a SHA256 fingerprint (8 hex chars) instead of
        #      just the byte length. Length is a weak check (a token
        #      with a trailing newline still has the right byte count
        #      but a different fingerprint, and 'echo' / shell
        #      substitution in the secret field can add CR + LF on
        #      copy-paste). Fingerprint lets us compare across jobs /
        #      runs without leaking the token itself.
        #
        # Runs under pwsh (PowerShell 7). On GitHub-hosted runners
        # (ubuntu-latest / macos-latest) pwsh 7 is preinstalled and
        # reachable as `pwsh`. On self-hosted Windows the previous
        # "Ensure ..." step adds pwsh.exe to GITHUB_PATH so this
        # step finds it.
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GITEE_TOKEN)) {
            '::error::secrets.GITEE_TOKEN is empty or unset. The release-cn workflow fetches source from https://gitee.com/songszchen/eCan.ai.git using a job-scoped GIT_ASKPASS that needs GITEE_TOKEN as the password (the username is hard-coded to ''oauth2''). Configure the token at Settings → Secrets and variables → Actions → GITEE_TOKEN. Without it, `git fetch origin` exits 128 with ''terminal prompts disabled'' — the very symptom this step is meant to replace.'
            exit 1
          }
          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) so the fingerprint is stable across jobs.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($clean)
          $hash  = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $fpr   = ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "[OK] GITEE_TOKEN present (length=$($bytes.Length) bytes, sha256=$($fpr.Substring(0,8)))"

      - name: Checkout from GitHub
        # GitHub-hosted runner path. Uses stock actions/checkout@v6
        # against the canonical github.com remote — no Gitee mirror,
        # no DNS workaround, no GIT_ASKPASS. Mutually exclusive with
        # the "Checkout from Gitee mirror" step below; the two ifs
        # cover the same two runner_group values without overlap.
        if: github.event.inputs.runner_group == 'github-hosted'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Checkout from Gitee mirror
        # Replaces actions/checkout@v6 against the Gitee mirror. The previous
        # inline pwsh port hung at 30 minutes when HTTPS to gitee.com stalled:
        # the in-script SSH fallback never fired ($useSsh was undefined), so the
        # retry ran the same HTTPS path with no timeout wrapper and waited out
        # the step cap. This bootstrap must be self-contained: no repository
        # file exists before checkout, and Gitee's /raw route is denied by the
        # China runner gateway even when Git Smart-HTTP is reachable.
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        timeout-minutes: 10
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("oauth2:$clean"))
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $ref = "${{ github.event.inputs.ref || github.ref }}"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          if (Test-Path -LiteralPath '.git') { Remove-Item -Recurse -Force '.git' }
          & $git init -q .
          & $git remote add origin 'https://gitee.com/songszchen/eCan.ai.git'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:HTTP_PROXY = ''; $env:HTTPS_PROXY = ''; $env:NO_PROXY = '*'
          & $git -c http.sslVerify=false -c http.proxy= -c https.proxy= `
            -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 `
            -c "http.extraHeader=Authorization: Basic $basic" `
            fetch --no-tags --prune --no-recurse-submodules --depth=1 origin $ref
          if ($LASTEXITCODE -ne 0) { throw "Gitee fetch failed for ref '$ref' (exit=$LASTEXITCODE)" }
          & $git checkout --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Git checkout failed (exit=$LASTEXITCODE)" }
          Write-Host "[OK] Checked out $ref at $(& $git rev-parse --short HEAD)"

      - name: Prepare Gitee credential helper
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        # Job-scoped credential store for any *downstream* git operation
        # against gitee.com — typically shared-cos-upload.yml's git push
        # of the appcast/last-release.json. The earlier 'Checkout from
        # Gitee mirror' step handles its own auth via a $env:TEMP askpass
        # file, so this step doesn't have to.
        #
        # We write our own credential.store file at $env:RUNNER_TEMP,
        # point git at it via a job-scoped GIT_CONFIG_GLOBAL
        # (exported through $env:GITHUB_ENV so subsequent steps inherit
        # it), and let git's standard credential subsystem handle
        # auth. Why $env:GITHUB_ENV instead of `git config --global`:
        # on a self-hosted runner that's been used for many repos,
        # the runner's user-global .gitconfig is shared across jobs.
        # Setting credential.* there would leak our token to every
        # other job the runner ever runs. $env:RUNNER_TEMP is per-job, so
        # the helper file is automatically GC'd at job end.
        #
        # This step MUST run after 'Checkout from Gitee mirror' —
        # $env:GITHUB_WORKSPACE is the just-checked-out tree. The
        # previous bash version also relied on the python script at
        # .github/scripts/write_gitconfig_gitee.py, but pwsh's
        # [IO.File]::WriteAllText + here-string sidesteps the bash
        # LF→CRLF translation entirely, so no helper script is needed
        # any more. The script is left in-tree for any third-party
        # workflow that still imports it.
        #
        # The previous bash version routed through
        # .github/scripts/write_gitconfig_gitee.py because `with open(...)
        # as f:` at column 0 inside a `run: |` block trips YAML's
        # block-mapping parser. pwsh doesn't have that ambiguity, so
        # we inline the LF-only file write here.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $credsFile    = Join-Path $env:RUNNER_TEMP '.git-credentials-gitee'
          $gitconfigFile = Join-Path $env:RUNNER_TEMP '.gitconfig-gitee'

          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) before embedding in the credentials URL.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')

          # credential.store format: URL with embedded username:password.
          # We deliberately include the scheme + host so it only matches
          # gitee.com (not, e.g., a hypothetical future gitee enterprise
          # tenant URL).
          $credsLine = "https://oauth2:${clean}@gitee.com"
          # LF-only write: .NET 8's WriteAllText on Windows writes CRLF
          # per Environment.NewLine; .gitconfig parsed by PortableGit
          # accepts CRLF, but writing LF keeps the file identical
          # across all three runner platforms.
          [System.IO.File]::WriteAllText($credsFile, ($credsLine + "`n"), [System.Text.UTF8Encoding]::new($false))

          # Job-scoped gitconfig. The [credential "https://gitee.com"]
          # section scopes the helper to gitee.com only — other hosts
          # (if any later step needs them) aren't affected.
          # core.autocrlf=false prevents git from re-expanding LF→CRLF
          # on read of the credentials file (which would break the
          # embedded newline detection in git's credential store).
          $gitconfigBody = @"
          [core]
              autocrlf = false
          [credential "https://gitee.com"]
              helper = store --file $credsFile
              username = oauth2
          "@
          [System.IO.File]::WriteAllText($gitconfigFile, ($gitconfigBody -replace '\r\n?', "`n"), [System.Text.UTF8Encoding]::new($false))

          # Export for downstream steps. GIT_CONFIG_GLOBAL is honored
          # by git 2.32+ on Linux/macOS. On the self-hosted Windows
          # runner, git-bash uses the same env var, so this works there
          # too.
          "GIT_CONFIG_GLOBAL=$gitconfigFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GITEE_CREDENTIALS_FILE=$credsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[OK] Gitee credential helper installed at $credsFile"
          Write-Host "       git will use GIT_CONFIG_GLOBAL=$gitconfigFile"

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          platform: windows
          requirements-file: requirements-windows.txt
          extra-packages: pywin32-ctypes
          architecture: x64

      - name: Install app-specific dependencies
        shell: bash
        run: |
          export PATH="$PWD/.venv/Scripts:$PATH"
          pip install -r "requirements-cn.txt"

      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright
        with:
          platform: windows
          browsers: chromium

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env
        with:
          npm-registry: ${{ github.event.inputs.runner_group != 'github-hosted' && 'https://registry.npmmirror.com' || '' }}

      - name: Setup WhatsApp Baileys Bridge Environment
        uses: ./.github/actions/setup-wabaileys-bridge
        with:
          node-version: '20'
          bridge-dir: wabaileys-bridge

      - name: Install Windows-specific packages
        shell: pwsh
        run: |
          # pywin32 is installed in the venv by setup-python-env. We must
          # invoke it via the EXPLICIT venv python path, not the bare
          # python token, because:
          #
          #   1. actions/setup-python@v6 registers the system python
          #      (C:\hostedtoolcache\windows\Python\<ver>\x64\python.exe)
          #      at the FRONT of PATH.
          #   2. setup-python-env then appends $PWD/.venv/Scripts to
          #      GITHUB_PATH — i.e. the END of PATH.
          #   3. Windows PATH lookup returns the first match, so a bare
          #      python token lands on the system python, not the venv.
          #      System python has no pywin32 → No module named 'win32'.
          #
          # The module path win32.scripts.pywin32_postinstall is the
          # pywin32 >=310 form (the wheel ships win32/scripts/
          # pywin32_postinstall.py and registers it via console_scripts).
          # The previous python -m pywin32_postinstall form fails on
          # >=310 with No module named pywin32_postinstall.
          $VenvPython = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\python.exe'
          if (-not (Test-Path $VenvPython)) {
            throw "Venv python not found at $VenvPython — setup-python-env step likely failed"
          }
          & $VenvPython -c "import win32api, win32gui, win32con, win32com.client, win32print, win32clipboard; print('pywin32 OK')"
          & $VenvPython -m win32.scripts.pywin32_postinstall -install

      - name: Setup OTA signing key
        # Decode secrets.OTA_ED25519_PRIVATE_KEY (base64 of the
        # PEM blob) into build_system/certificates/ed25519_private_key.pem
        # so sign_ota_artifacts() (called inside build.py prod)
        # has the key on disk.
        #
        # Why this step lives here:
        #   Until 4e396687 fixed the Windows venv-python path,
        #   build.py prod failed at PyInstaller import time
        #   with ModuleNotFoundError and never reached the OTA
        #   signing stage. With venv-python now correct, build.py
        #   runs to completion and reaches sign_ota_artifacts(),
        #   which REQUIRES the key file on disk for non-dev
        #   environments. Without this step, every Windows release
        #   in test/staging/production would fail with:
        #     [OTA-SIGN] [ERROR] Ed25519 private key file does not exist
        #
        # Why we use [Convert]::FromBase64String not base64 -d:
        #   The Linux counterpart uses base64 -d because GitHub's
        #   Ubuntu runners ship GNU coreutils. Windows runners do
        #   not have base64 in the default PATH. Using .NET
        #   ([System.Convert]) avoids a third-party tool
        #   dependency on the Windows runner.
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        shell: powershell
        run: |
          $keyDir = Join-Path $env:GITHUB_WORKSPACE 'build_system/certificates'
          New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          $keyPath = Join-Path $keyDir 'ed25519_private_key.pem'
          # Remove existing file if present (may be read-only from previous run)
          if (Test-Path $keyPath) {
              Remove-Item $keyPath -Force
          }
          [System.IO.File]::WriteAllBytes(
            $keyPath,
            [System.Convert]::FromBase64String($env:OTA_PRIVATE_KEY)
          )
          # Restrict access to the current user only. The OTA key
          # is a long-lived ed25519 root: a leaked read on the
          # runner box would let anyone forge signed "OTA
          # updates". The runner is short-lived and per-job (not
          # a shared workspace), so dropping inherited ACLs and
          # granting only the build agent access is sufficient.
          # Resolve the actual account via whoami. $env:USERNAME on
          # GitHub-hosted Windows runners can be a container-local user
          # (e.g. "runneradmin") that NTAccount.Translate() cannot map
          # to a SID, producing IdentityNotMappedException on
          # $acl.SetAccessRule(). Construct the access rule from a
          # SecurityIdentifier (not a string) so SetAccessRule skips
          # the implicit translation, and degrade gracefully if the
          # account genuinely cannot be resolved.
          $currentAccount = & whoami.exe
          if (-not $currentAccount) {
            throw "whoami returned empty -- cannot resolve current account for ACL"
          }
          $ntAccount = New-Object System.Security.Principal.NTAccount($currentAccount)
          try {
            $currentSid = $ntAccount.Translate(
              [System.Security.Principal.SecurityIdentifier])
          } catch [System.Security.Principal.IdentityNotMappedException] {
            # Best-effort hardening only: the key file is already on disk
            # and will be used by sign_ota_artifacts() in this same job.
            # On GitHub-hosted runners the VM is short-lived and per-job,
            # so the worst case here is the same as not tightening ACLs
            # at all -- still strictly better than failing the build.
            Write-Warning "Could not translate '$currentAccount' to a SID; skipping ACL tightening."
            Write-Host "[OK] OTA signing key installed at $keyPath"
            return
          }
          $acl = Get-Acl $keyPath
          $acl.SetAccessRuleProtection($true, $false)
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
            $currentSid, 'Read', 'Allow')
          $acl.SetAccessRule($rule)
          Set-Acl $keyPath $acl
          Write-Host "[OK] OTA signing key installed at $keyPath"

      - name: Install Inno Setup
        shell: pwsh
        # Two-tier install. See release-intl.yml's same step for the full
        # rationale. Short version: on self-hosted runners with Inno
        # already at the canonical ${env:ProgramFiles(x86)}\Inno Setup 6
        # path, skip the 5MB download + Inno Setup installer's GUI-less
        # bootstrap. On GitHub-hosted windows-latest runners (no Inno
        # pre-installed), the install branch runs as before.
        run: |
          $innoDir      = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $innoIscc     = Join-Path $innoDir "ISCC.exe"
          $langsDir     = Join-Path $innoDir "Languages"
          $zhIsl        = Join-Path $langsDir "ChineseSimplified.isl"
          $innoVersion  = "6.7.1"

          if (Test-Path $innoIscc) {
            # Existing install. Run a sanity probe so we don't blindly
            # trust a half-removed Inno Setup (e.g. ISCC.exe present but
            # Inno Setup's compiler DLLs missing). If the probe fails,
            # fall through to the install branch.
            try {
              & $innoIscc /? | Out-Null
              Write-Host "[OK] ISCC.exe already available at: $innoIscc" -ForegroundColor Green

              if (-not (Test-Path $zhIsl)) {
                Write-Host "[INFO] ChineseSimplified.isl missing; fetching (one-time)" -ForegroundColor Cyan
                New-Item -ItemType Directory -Force -Path $langsDir | Out-Null
                Invoke-WebRequest `
                  -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl" `
                  -OutFile $zhIsl `
                  -UseBasicParsing
                Write-Host "[OK] Chinese language file installed" -ForegroundColor Green
              } else {
                Write-Host "[OK] ChineseSimplified.isl already present" -ForegroundColor Green
              }

              exit 0
            } catch {
              Write-Host "[WARN] Existing ISCC.exe probe failed: $_. Falling back to install." -ForegroundColor Yellow
            }
          }

          Write-Host "[INSTALL] ISCC.exe not found; downloading Inno Setup $innoVersion..." -ForegroundColor Cyan
          $DownloadUrl  = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-$innoVersion.exe"
          $DownloadPath = "$env:TEMP\innosetup-$innoVersion.exe"
          Invoke-WebRequest -Uri $DownloadUrl -OutFile $DownloadPath -UseBasicParsing
          Start-Process -FilePath $DownloadPath -ArgumentList "/SILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          if (-not (Test-Path $zhIsl)) {
              New-Item -ItemType Directory -Force -Path $langsDir | Out-Null
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $zhIsl -UseBasicParsing
          }

          if (-not (Test-Path $innoIscc)) { Write-Error "ISCC.exe not found after install"; exit 1 }
          Write-Host "[OK] Inno Setup installed" -ForegroundColor Green

      - name: Setup signtool environment
        uses: ./.github/actions/setup-signtool-env

      - name: Build Windows installer
        env:
          ECAN_SKIP_FRONTEND_BUILD: '0'
          ECAN_ENVIRONMENT: ${{ needs.validate-tag.outputs.environment }}
        shell: powershell
        run: |
          # Use the explicit venv python path (see Install Windows-specific
          # packages step above for the full PATH-ordering rationale).
          # Bare python in shell: pwsh resolves to the system python
          # at C:\hostedtoolcache\...\<ver>\x64\python.exe, which has no
          # PyInstaller / PySide6 and fails with ModuleNotFoundError.
          $VenvPython = Join-Path $env:GITHUB_WORKSPACE '.venv\Scripts\python.exe'
          if (-not (Test-Path $VenvPython)) {
            throw "Venv python not found at $VenvPython - setup-python-env step likely failed"
          }
          & $VenvPython build.py prod --version ${{ needs.validate-tag.outputs.version }} --app cn

      - name: Determine signing method
        id: check_signing
        shell: powershell
        run: |
          if ($env:AZURE_TENANT_ID -ne 'NOT_SET' -and $env:AZURE_CLIENT_ID -ne 'NOT_SET' `
              -and $env:AZURE_CLIENT_SECRET -ne 'NOT_SET' -and $env:AZURE_SIGNING_ENDPOINT -ne 'NOT_SET' `
              -and $env:AZURE_SIGNING_ACCOUNT -ne 'NOT_SET' -and $env:AZURE_SIGNING_PROFILE -ne 'NOT_SET') {
              Write-Host "Will sign with Azure Trusted Signing"
              "method=azure" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } elseif ($env:WIN_CERT_PFX -ne 'NOT_SET' -and $env:WIN_CERT_PASSWORD -ne 'NOT_SET') {
              Write-Host "Will sign with PFX fallback"
              "method=pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              Write-Host "No signing credentials available; skipping"
              "method=none" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Code sign Windows artifacts (Azure Trusted Signing)
        if: steps.check_signing.outputs.method == 'azure'
        uses: ./.github/actions/azure-code-signing
        with:
          azure-tenant-id:          ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:          ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:      ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                 ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          account-name:             ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder:             dist/${{ env.ECAN_APP_NAME }}
          files-folder-filter:      exe,dll
          files-folder-recurse:     'true'

      - name: Sign installer (Azure Trusted Signing)
        if: steps.check_signing.outputs.method == 'azure'
        uses: ./.github/actions/azure-code-signing
        with:
          azure-tenant-id:          ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:          ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:      ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                 ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          account-name:             ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder:             dist
          files-folder-filter:      exe,msi
          files-folder-recurse:     'false'

      - name: Code sign Windows artifacts (PFX fallback)
        if: steps.check_signing.outputs.method == 'pfx'
        shell: powershell
        env:
          WIN_CERT_PFX:      ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [byte[]]$pfxBytes = [Convert]::FromBase64String($env:WIN_CERT_PFX)
          $pfxPath = Join-Path $env:TEMP "ecan-build.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $securePwd = ConvertTo-SecureString -String $env:WIN_CERT_PASSWORD -Force -AsPlainText
          $collection = New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
          $collection.Import($pfxPath, $securePwd, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
          $cert = $collection[0]
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\**\signtool.exe" -Recurse | Select-Object -First 1
          Get-ChildItem -Path "dist\${{ env.ECAN_APP_NAME }}" -Filter "*.exe" -Recurse | ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfxPath /p $env:WIN_CERT_PASSWORD $_.FullName
          }

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # The Windows installer is produced by build.py at
          # dist/<DIST_APP>-{version}-windows-amd64-Setup.exe
          # (Inno Setup's OutputDir=..\dist,
          # OutputBaseFilename=<DIST_APP>-{version}-windows-amd64-Setup,
          # defined in build_system/ecan_build.py: installer_filename uses
          # app.name which equals DIST_APP via ECAN_APP_NAME).
          # DIST_APP differs per pipeline: eCan for intl, eCan.cn for cn.
          # Look it up there and copy into the artifact staging directory.
          $installer = "dist\${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-windows-amd64-Setup.exe"
          if (-not (Test-Path $installer)) {
              # Build failed upstream and produced no installer — that's a
              # hard pipeline failure, not an empty-artifact-to-skip
              # scenario. The previous [ -f ] && cp quietly created
              # an empty artifacts/ directory and let actions/upload-artifact
              # print "No files were found" as a yellow warning, hiding
              # the real build failure under a green checkmark. Throw
              # here so the Build Windows amd64 job is marked red at the
              # source, which is what an operator needs to notice the
              # release is broken.
              throw "Expected Windows installer not found: $installer - build.py prod did not produce an installer. The build pipeline is broken; investigate the 'Build Windows installer' step above before retrying."
          }
          Copy-Item $installer artifacts\

      - name: Upload Windows artifacts (S3 transfer)
        uses: actions/upload-artifact@v6
        with:
          name: eCan-windows-amd64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          # Belt-and-braces: Prepare artifacts already throws when the
          # expected installer is missing, so this branch is a backstop
          # for any future regression. Without it, an empty artifacts/
          # directory would let upload succeed as a yellow "No files
          # were found" warning, hiding the real failure.
          if-no-files-found: error

      - name: Upload Windows artifacts (debug mirror)
        if: github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-windows-amd64-${{ needs.validate-tag.outputs.version }}
          path: artifacts/
          retention-days: 7
          compression-level: 6

  build-macos-amd64:
    name: Build macOS amd64
    needs: validate-tag
    if: |
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all') &&
      (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == '') &&
      (github.event.inputs.runner_group == 'github-hosted' || github.event.inputs.runner_group == 'ecan-macos-amd64')
    # Architectures must match across the build axis:
    #   self-hosted  →  macos,x64,ecan-build  (Intel)
    #   github-hosted → macos-15-intel       (x86_64 Intel)
    # macos-latest is wrong here: it now points to macos-26 (Apple
    # Silicon / arm64). Building x86_64 on an arm64 runner would force
    # PyInstaller / pip to use Rosetta 2 emulation with degraded
    # performance and a non-trivial risk of native-binary mismatches.
    # macos-15-intel is the only GitHub-hosted x86_64 macOS runner
    # currently scheduled to remain available until macos-26-intel
    # itself retires (Aug 2027 → 2028 per the runner-images roadmap).
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-macos-amd64' && fromJSON('["self-hosted","macos","x64","ecan-build"]') || 'macos-15-intel' }}
    env:
      MAC_CERT_P12:              ${{ secrets.MAC_CERT_P12              || 'NOT_SET' }}
      MAC_CERT_PASSWORD:         ${{ secrets.MAC_CERT_PASSWORD         || 'NOT_SET' }}
      MAC_CODESIGN_IDENTITY:     ${{ secrets.MAC_CODESIGN_IDENTITY     || 'NOT_SET' }}
      APPLE_ID:                  ${{ secrets.APPLE_ID                  || 'NOT_SET' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || 'NOT_SET' }}
      TEAM_ID:                   ${{ secrets.TEAM_ID                   || 'NOT_SET' }}
      BUILD_ARCH: amd64
      ECAN_APP_ID: cn
      ECAN_APP_NAME: eCan.cn
      TARGET_ARCH: x86_64
      PYINSTALLER_TARGET_ARCH: x86_64
    timeout-minutes: 60

    steps:
      # Self-hosted Windows runner prerequisite check + install:
      # Git Bash + PowerShell 7 (pwsh.exe) must be reachable
      # for shell: bash and shell: pwsh steps.
      #
      # GitHub Actions' shell: bash on Windows resolves to
      # C:\Program Files\Git\bin\bash.EXE. On a GitHub-hosted
      # Windows runner the runner-images include Git for Windows
      # in the default PATH, so bash is found. On a self-hosted
      # Windows runner that's been registered with
      # register_runner.ps1, the installer's per-user PATH is
      # added to the *user* shell — but the
      # actions.runner.*-svc Windows service account that
      # actually executes jobs starts with the SYSTEM-level
      # PATH, which does NOT inherit Git for Windows' bin
      # directory.
      #
      # Symptom: every step with shell: bash fails with
      # ##[error]bash: command not found within the first few
      # lines (see logs #86661348651 for the canonical example).
      #
      # Contract: this step is **idempotent**. For each
      # prerequisite:
      #   - present on the runner → no-op (the
      #     common case once register_runner.ps1 + §九.3.1
      #     have been run once)
      #   - missing → install via winget (or MSI fallback) and
      #     wait until reachable
      #   - both fail (winget / network blocked) → emit
      #     ::error:: and exit 1, telling the operator
      #     what is broken and how to fix it on the runner
      #     (docs §九.3.1)
      #
      # if: runner.os == 'Windows' skips this step on the
      # macOS and Linux build jobs.
      #
      # Shell: shell: powershell (Windows PowerShell 5.1, ships
      # with every Windows install since Win7/2008R2). NOT
      # shell: pwsh — PowerShell 7 (pwsh.exe) is a *separate*
      # install that is NOT on the default PATH on either
      # GitHub-hosted or self-hosted Windows runners. On
      # GitHub-hosted runners GHA maps powershell →
      # C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      # which is always on the SYSTEM-level PATH inherited by
      # the runner service.
      #
      # Why this step is idempotent end-to-end:
      #   - The GHA runner invokes shell: powershell steps via
      #     powershell -command ". '<guid>.ps1'" (dot-sources a
      #     temp file in _work\_temp). That requires the
      #     SYSTEM ExecutionPolicy to NOT be Restricted. GitHub-
      #     hosted runners override this via Group Policy to
      #     RemoteSigned; self-hosted runners get the same
      #     override via register_runner.ps1 (which sets
      #     LocalMachine=RemoteSigned then restarts the
      #     service). If the operator skipped that step, this
      #     preflight fails immediately with a precise ::error::
      #     pointing at register_runner.ps1 instead of a cryptic
      #     ##[error]Process completed with exit code 1.
      #   - Git Bash is detected via Test-Path. If present, this
      #     step is a no-op cost (a few cmdlets). If absent, this
      #     step downloads and runs the Git for Windows installer —
      #     idempotent on re-run.
      #   - PowerShell 7 is detected via Test-Path. If present,
      #     no-op. If absent, downloads and runs the PowerShell 7 MSI
      #     installer directly (no winget dependency).
      #
      # Reference: https://github.com/actions/runner/issues/497
      # Reference: https://github.com/actions/runner/blob/main/src/Runner.Worker/Handlers/ScriptHandlerHelpers.cs
      - name: Ensure Git Bash + PowerShell 7 are on runner-service PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Probe PowerShell 7 + Git Bash via the dedicated helper.
          # This handles non-standard installs (operator-style
          # C:\Users\<user>\opt\pwsh7\, scoop, choco-shim dirs)
          # before falling back to auto-install. Without the
          # probe-first check, an auto-install would shadow an
          # existing install at a non-canonical path
          # (run #86820634953).
          $helper = Join-Path $env:GITHUB_WORKSPACE 'build_system/scripts/runner/find-prerequisites.ps1'
          if (Test-Path -LiteralPath $helper) {
            . $helper
          } else {
            # Inline fallback for older checkouts. Same
            # candidate list, same probe-first install-fallback
            # semantics as find-prerequisites.ps1. Crucially,
            # candidates are checked BEFORE `Get-Command`, so the
            # canonical C:\Program Files\Git\bin\bash.exe wins
            # over the WSL/Cygwin placeholder at
            # C:\Windows\System32\bash.exe that Get-Command
            # would otherwise return on GitHub-hosted windows-latest
            # (see actions/runner-images#12646).
            function Find-PwshLocation {
              foreach ($c in @("$env:ProgramFiles\PowerShell\7\pwsh.exe", "${env:ProgramFiles(x86)}\PowerShell\7\pwsh.exe", "$env:LOCALAPPDATA\Programs\PowerShell\7\pwsh.exe", "$env:USERPROFILE\opt\pwsh7\pwsh.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Find-BashLocation {
              foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe", "$env:USERPROFILE\scoop\apps\git\current\bin\bash.exe", "$env:ProgramData\chocolatey\bin\bash.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command bash.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Get-PwshDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
            function Get-BashDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
          }

          $gitBashInstallDir = 'C:\Program Files\Git'
          $gitBashBin       = Join-Path $gitBashInstallDir 'bin\bash.exe'
          $pwshInstallDir   = 'C:\Program Files\PowerShell\7'
          $pwshBin          = Join-Path $pwshInstallDir   'pwsh.exe'

          # --- (1) PowerShell ExecutionPolicy sanity check ---
          # Read directly from registry (Get-ExecutionPolicy
          # -List triggers loading of Microsoft.PowerShell.Security
          # whose Security.types.ps1xml fails AuthorizationManager
          # validation on some pwsh 7 installations).
          $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          if (-not $effectiveEp) {
            $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\7\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          }
          if (-not $effectiveEp) { $effectiveEp = 'RemoteSigned' }
          if ($effectiveEp -eq 'Restricted') {
            Write-Host "::error::PowerShell ExecutionPolicy (LocalMachine) is Restricted. The GHA runner dot-sources inline scripts via `powershell -command \". '<guid>.ps1'\"`, which Restricted rejects with `UnauthorizedAccess` BEFORE any step body runs. GitHub-hosted runners override this via Group Policy to `RemoteSigned`; self-hosted runners must do the same. Run on the runner machine (elevated PowerShell): `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force`, then restart the runner service (`C:\actions-runner\svc.cmd stop && C:\actions-runner\svc.cmd start`). This is set automatically by build_system/scripts/runner/setup-prerequisites.ps1 on the runner -- if it's still missing, run that script first."
            exit 1
          }
          Write-Host "[OK] PowerShell ExecutionPolicy (LocalMachine): $effectiveEp"

          # --- (2) Git Bash (PROBE-THEN-INSTALL) ---
          $gitBashBin = Find-BashLocation
          if ($gitBashBin) {
            Write-Host "[OK] Git Bash found at $gitBashBin (no install needed)"
          } else {
            Write-Host "[INFO] Git Bash not found via probe -- installing via direct download"
            $gitExe = "$env:TEMP\Git-Setup.exe"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $gitExe "https://github.com/git-for-windows/git/releases/download/v2.46.0.windows.1/Git-2.46.0-64-bit.exe"
              # Inno Setup /DIR expects the install TARGET dir
              # (parent of bin/), NOT bin/ subdir.
              Start-Process -Wait -FilePath $gitExe -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', "/DIR$gitBashInstallDir"
              Remove-Item $gitExe -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::Git for Windows install failed: $($_.Exception.Message). Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            if (-not (Test-Path $gitBashBin)) {
              Write-Host "::error::Git for Windows installer ran but $gitBashBin is still missing. Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            Write-Host "[OK] Git Bash installed at $gitBashBin"
          }
          $gitBashDir = Get-BashDir -BashPath $gitBashBin

          # (2b) Git Bash's bin directory on the runner-service
          # PATH? Git for Windows' installer only adds to user
          # PATH, but the service inherits SYSTEM PATH. Forward
          # to $GITHUB_PATH so all subsequent steps in this job
          # see it (and the service-level PATH still needs to be
          # set on the runner -- see docs 九.3.1).
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$gitBashDir*") {
            $gitBashDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$gitBashDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] Git Bash already on service PATH"
          }

          # --- (3) PowerShell 7 (PROBE-THEN-INSTALL) ---
          $pwshBin = Find-PwshLocation
          if ($pwshBin) {
            Write-Host "[OK] PowerShell 7 found at $pwshBin (no install needed)"
          } else {
            Write-Host "[INFO] PowerShell 7 not found via probe -- installing via direct MSI download"
            $msi = "$env:TEMP\pwsh.msi"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $msi "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
              # Start-Process -PassThru captures the real MSI exit
              # code; `msiexec ... | Out-Null` is unreliable
              # (msiexec is GUI-subsystem, PowerShell doesn't
              # block, $LASTEXITCODE reflects last NATIVE cmd).
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                Write-Host "::error::PowerShell 7 MSI install failed with exit code $($proc.ExitCode). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
                exit 1
              }
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::PowerShell 7 install failed: $($_.Exception.Message). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            if (-not (Test-Path $pwshBin)) {
              Write-Host "::error::PowerShell 7 install reported success but $pwshBin is still missing. Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            Write-Host "[OK] PowerShell 7 installed at $pwshBin"
          }
          $pwshDir = Get-PwshDir -PwshPath $pwshBin

          # (3b) PowerShell 7's directory on the runner-service PATH?
          # Same reasoning as (2b) for Git Bash: the service runs as
          # SYSTEM and inherits SYSTEM PATH, not the user's. Forward
          # to $GITHUB_PATH so bash/git operations that invoke pwsh
          # as a sub-shell (e.g. git config --list | pwsh -c "...")
          # do not fail with "command not found".
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$pwshDir*") {
            $pwshDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$pwshDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] PowerShell 7 already on service PATH"
          }

          # --- (4) Final summary ---
          Write-Host "[OK] Prerequisite check complete: Git Bash + PowerShell 7 reachable, ExecutionPolicy=$($effectiveEp)"

      - name: Validate Gitee credentials
        # Diagnostic guard for the 'fatal: could not read Username
        # for https://gitee.com' checkout failure.
        #
        # Two changes vs. the previous revision:
        #   1. Removed the if: github.server_url != 'https://github.com'
        #      guard. That guard made this step a silent no-op on the
        #      validate-tag job (which runs on GitHub-hosted
        #      ubuntu-latest and *also* checks out from Gitee), so an
        #      empty token there would only surface later as a
        #      confusing 'could not read Username' from actions/checkout.
        #      Now we always run this step on every job.
        #   2. Output a SHA256 fingerprint (8 hex chars) instead of
        #      just the byte length. Length is a weak check (a token
        #      with a trailing newline still has the right byte count
        #      but a different fingerprint, and 'echo' / shell
        #      substitution in the secret field can add CR + LF on
        #      copy-paste). Fingerprint lets us compare across jobs /
        #      runs without leaking the token itself.
        #
        # Runs under pwsh (PowerShell 7). On GitHub-hosted runners
        # (ubuntu-latest / macos-latest) pwsh 7 is preinstalled and
        # reachable as `pwsh`. On self-hosted Windows the previous
        # "Ensure ..." step adds pwsh.exe to GITHUB_PATH so this
        # step finds it.
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GITEE_TOKEN)) {
            '::error::secrets.GITEE_TOKEN is empty or unset. The release-cn workflow fetches source from https://gitee.com/songszchen/eCan.ai.git using a job-scoped GIT_ASKPASS that needs GITEE_TOKEN as the password (the username is hard-coded to ''oauth2''). Configure the token at Settings → Secrets and variables → Actions → GITEE_TOKEN. Without it, `git fetch origin` exits 128 with ''terminal prompts disabled'' — the very symptom this step is meant to replace.'
            exit 1
          }
          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) so the fingerprint is stable across jobs.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($clean)
          $hash  = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $fpr   = ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "[OK] GITEE_TOKEN present (length=$($bytes.Length) bytes, sha256=$($fpr.Substring(0,8)))"

      - name: Checkout from GitHub
        # GitHub-hosted runner path. Uses stock actions/checkout@v6
        # against the canonical github.com remote — no Gitee mirror,
        # no DNS workaround, no GIT_ASKPASS. Mutually exclusive with
        # the "Checkout from Gitee mirror" step below; the two ifs
        # cover the same two runner_group values without overlap.
        if: github.event.inputs.runner_group == 'github-hosted'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Checkout from Gitee mirror
        # Replaces actions/checkout@v6 against the Gitee mirror. The previous
        # inline pwsh port hung at 30 minutes when HTTPS to gitee.com stalled:
        # the in-script SSH fallback never fired ($useSsh was undefined), so the
        # retry ran the same HTTPS path with no timeout wrapper and waited out
        # the step cap. This bootstrap must be self-contained: no repository
        # file exists before checkout, and Gitee's /raw route is denied by the
        # China runner gateway even when Git Smart-HTTP is reachable.
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        timeout-minutes: 10
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("oauth2:$clean"))
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $ref = "${{ github.event.inputs.ref || github.ref }}"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          if (Test-Path -LiteralPath '.git') { Remove-Item -Recurse -Force '.git' }
          & $git init -q .
          & $git remote add origin 'https://gitee.com/songszchen/eCan.ai.git'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:HTTP_PROXY = ''; $env:HTTPS_PROXY = ''; $env:NO_PROXY = '*'
          & $git -c http.sslVerify=false -c http.proxy= -c https.proxy= `
            -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 `
            -c "http.extraHeader=Authorization: Basic $basic" `
            fetch --no-tags --prune --no-recurse-submodules --depth=1 origin $ref
          if ($LASTEXITCODE -ne 0) { throw "Gitee fetch failed for ref '$ref' (exit=$LASTEXITCODE)" }
          & $git checkout --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Git checkout failed (exit=$LASTEXITCODE)" }
          Write-Host "[OK] Checked out $ref at $(& $git rev-parse --short HEAD)"

      - name: Prepare Gitee credential helper
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        # Job-scoped credential store for any *downstream* git operation
        # against gitee.com — typically shared-cos-upload.yml's git push
        # of the appcast/last-release.json. The earlier 'Checkout from
        # Gitee mirror' step handles its own auth via a $env:TEMP askpass
        # file, so this step doesn't have to.
        #
        # We write our own credential.store file at $env:RUNNER_TEMP,
        # point git at it via a job-scoped GIT_CONFIG_GLOBAL
        # (exported through $env:GITHUB_ENV so subsequent steps inherit
        # it), and let git's standard credential subsystem handle
        # auth. Why $env:GITHUB_ENV instead of `git config --global`:
        # on a self-hosted runner that's been used for many repos,
        # the runner's user-global .gitconfig is shared across jobs.
        # Setting credential.* there would leak our token to every
        # other job the runner ever runs. $env:RUNNER_TEMP is per-job, so
        # the helper file is automatically GC'd at job end.
        #
        # This step MUST run after 'Checkout from Gitee mirror' —
        # $env:GITHUB_WORKSPACE is the just-checked-out tree. The
        # previous bash version also relied on the python script at
        # .github/scripts/write_gitconfig_gitee.py, but pwsh's
        # [IO.File]::WriteAllText + here-string sidesteps the bash
        # LF→CRLF translation entirely, so no helper script is needed
        # any more. The script is left in-tree for any third-party
        # workflow that still imports it.
        #
        # The previous bash version routed through
        # .github/scripts/write_gitconfig_gitee.py because `with open(...)
        # as f:` at column 0 inside a `run: |` block trips YAML's
        # block-mapping parser. pwsh doesn't have that ambiguity, so
        # we inline the LF-only file write here.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $credsFile    = Join-Path $env:RUNNER_TEMP '.git-credentials-gitee'
          $gitconfigFile = Join-Path $env:RUNNER_TEMP '.gitconfig-gitee'

          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) before embedding in the credentials URL.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')

          # credential.store format: URL with embedded username:password.
          # We deliberately include the scheme + host so it only matches
          # gitee.com (not, e.g., a hypothetical future gitee enterprise
          # tenant URL).
          $credsLine = "https://oauth2:${clean}@gitee.com"
          # LF-only write: .NET 8's WriteAllText on Windows writes CRLF
          # per Environment.NewLine; .gitconfig parsed by PortableGit
          # accepts CRLF, but writing LF keeps the file identical
          # across all three runner platforms.
          [System.IO.File]::WriteAllText($credsFile, ($credsLine + "`n"), [System.Text.UTF8Encoding]::new($false))

          # Job-scoped gitconfig. The [credential "https://gitee.com"]
          # section scopes the helper to gitee.com only — other hosts
          # (if any later step needs them) aren't affected.
          # core.autocrlf=false prevents git from re-expanding LF→CRLF
          # on read of the credentials file (which would break the
          # embedded newline detection in git's credential store).
          $gitconfigBody = @"
          [core]
              autocrlf = false
          [credential "https://gitee.com"]
              helper = store --file $credsFile
              username = oauth2
          "@
          [System.IO.File]::WriteAllText($gitconfigFile, ($gitconfigBody -replace '\r\n?', "`n"), [System.Text.UTF8Encoding]::new($false))

          # Export for downstream steps. GIT_CONFIG_GLOBAL is honored
          # by git 2.32+ on Linux/macOS. On the self-hosted Windows
          # runner, git-bash uses the same env var, so this works there
          # too.
          "GIT_CONFIG_GLOBAL=$gitconfigFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GITEE_CREDENTIALS_FILE=$credsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[OK] Gitee credential helper installed at $credsFile"
          Write-Host "       git will use GIT_CONFIG_GLOBAL=$gitconfigFile"

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          platform: macos
          requirements-file: requirements-macos.txt
          python-version: '3.12'
          architecture: x64

      - name: Install app-specific dependencies
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -r "requirements-cn.txt"

      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright
        with:
          platform: macos
          browsers: chromium

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env
        with:
          npm-registry: ${{ github.event.inputs.runner_group != 'github-hosted' && 'https://registry.npmmirror.com' || '' }}

      - name: Setup OTA signing key
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        shell: bash
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          mkdir -p build_system/certificates
          OTA_PRIVATE_KEY="$OTA_PRIVATE_KEY" python3 -c \
            'import base64, os, pathlib; pathlib.Path("build_system/certificates/ed25519_private_key.pem").write_bytes(base64.b64decode(os.environ["OTA_PRIVATE_KEY"]))'
          chmod 600 build_system/certificates/ed25519_private_key.pem

      - name: Build macOS package
        shell: bash
        env:
          ECAN_SKIP_FRONTEND_BUILD: '0'
          ECAN_ENVIRONMENT: ${{ needs.validate-tag.outputs.environment }}
        run: |
          python3 build.py prod --version ${{ needs.validate-tag.outputs.version }} --app cn

      - name: Sign and notarize macOS artifact
        # STUB — UNVERIFIED on a real Developer-ID-equipped runner.
        # See build_system/build_utils.py::sign_macos_prod docstring
        # for the smoke checklist. Until that's green, the function
        # is gated on every required env var being present (and
        # non-"NOT_SET"), so an unconfigured job is a no-op that
        # preserves today's un-signed-and-un-notarized behaviour.
        if: env.MAC_CODESIGN_IDENTITY != 'NOT_SET'
        shell: bash
        env:
          MAC_CERT_P12:                ${{ secrets.MAC_CERT_P12                || 'NOT_SET' }}
          MAC_CERT_PASSWORD:           ${{ secrets.MAC_CERT_PASSWORD           || 'NOT_SET' }}
          MAC_CODESIGN_IDENTITY:       ${{ secrets.MAC_CODESIGN_IDENTITY       || 'NOT_SET' }}
          APPLE_ID:                    ${{ secrets.APPLE_ID                    || 'NOT_SET' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || 'NOT_SET' }}
          TEAM_ID:                     ${{ secrets.TEAM_ID                     || 'NOT_SET' }}
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from build_system.build_utils import sign_macos_prod; sys.exit(0 if sign_macos_prod() else 1)"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          ls dist/
          # Resolve the macOS amd64 package path explicitly so we can
          # distinguish "build succeeded but copy failed" from "build
          # failed upstream". The previous ls ... && cp silently
          # produced an empty artifacts/ directory and let
          # actions/upload-artifact print "No files were found" as a
          # warning, hiding the real failure. Throw here so the
          # Build macOS amd64 job is marked red.
          if ! ls dist/*-macos-amd64.* 1>/dev/null 2>&1; then
            echo "::error::Expected macOS amd64 package not found in dist/. build.py prod did not produce an installer. The build pipeline is broken; investigate the 'Build macOS package' step above before retrying."
            exit 1
          fi
          cp dist/*-macos-amd64.* artifacts/

      # Run #33569387342 saw this step fail on the macos-15-intel runner
      # with `Failed to CreateArtifact: Unable to make request: ENOTFOUND`
      # *after* build.py prod had already produced a valid 759MB .pkg on
      # disk — i.e. the artifact blob-storage DNS lookup on that specific
      # runner instance timed out, not the build. The same .pkg uploaded
      # fine on every other runner in the same run, so this is an
      # infrastructure flake, not a workflow bug.
      #
      # Retry the upload-artifact call up to 2 more times before giving
      # up. `overwrite: true` lets a retry replace a partially-registered
      # artifact from the prior attempt without surfacing a name
      # conflict. `continue-on-error: true` on attempts 1-2 lets the
      # next attempt run only if the previous one failed.
      - name: Upload macOS amd64 artifacts (S3 transfer) — attempt 1
        id: upload_macos_amd64_s3
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: eCan-macos-amd64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
          overwrite: true
      - name: Upload macOS amd64 artifacts (S3 transfer) — attempt 2
        id: upload_macos_amd64_s3_2
        if: steps.upload_macos_amd64_s3.outcome == 'failure'
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: eCan-macos-amd64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
          overwrite: true
      - name: Upload macOS amd64 artifacts (S3 transfer) — final attempt
        # Last attempt has no continue-on-error so a third failure here
        # fails the job, matches the pre-retry behaviour, and is what the
        # Final Status Summary's MACOS_AMD64 marker surfaces. The
        # double-condition (attempts 1 AND 2 failed) is what makes the
        # chain stop early when attempt 2 succeeds — otherwise the final
        # step would re-upload a successful artifact.
        if: >-
          steps.upload_macos_amd64_s3.outcome == 'failure' &&
          steps.upload_macos_amd64_s3_2.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-macos-amd64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          # Belt-and-braces: Prepare artifacts already exits 1 when the
          # expected .pkg is missing, so this branch is a backstop for
          # any future regression. Without it, an empty artifacts/
          # directory would let upload succeed as a yellow "No files
          # were found" warning, hiding the real failure.
          if-no-files-found: error
          overwrite: true

      - name: Upload macOS amd64 artifacts (debug mirror)
        if: github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-macos-amd64-${{ needs.validate-tag.outputs.version }}
          path: artifacts/
          retention-days: 7
          compression-level: 6

  build-macos-aarch64:
    name: Build macOS aarch64
    needs: validate-tag
    if: |
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all') &&
      (github.event.inputs.arch == 'aarch64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == '') &&
      (github.event.inputs.runner_group == 'github-hosted' || github.event.inputs.runner_group == 'ecan-macos-aarch64')
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-macos-aarch64' && fromJSON('["self-hosted","macos","aarch64","ecan-build"]') || 'macos-latest' }}
    env:
      MAC_CERT_P12:              ${{ secrets.MAC_CERT_P12              || 'NOT_SET' }}
      MAC_CERT_PASSWORD:         ${{ secrets.MAC_CERT_PASSWORD         || 'NOT_SET' }}
      MAC_CODESIGN_IDENTITY:     ${{ secrets.MAC_CODESIGN_IDENTITY     || 'NOT_SET' }}
      APPLE_ID:                  ${{ secrets.APPLE_ID                  || 'NOT_SET' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || 'NOT_SET' }}
      TEAM_ID:                   ${{ secrets.TEAM_ID                   || 'NOT_SET' }}
      BUILD_ARCH: aarch64
      ECAN_APP_ID: cn
      ECAN_APP_NAME: eCan.cn
      TARGET_ARCH: arm64
      PYINSTALLER_TARGET_ARCH: arm64
    timeout-minutes: 60

    steps:
      # Self-hosted Windows runner prerequisite check + install:
      # Git Bash + PowerShell 7 (pwsh.exe) must be reachable
      # for shell: bash and shell: pwsh steps.
      #
      # GitHub Actions' shell: bash on Windows resolves to
      # C:\Program Files\Git\bin\bash.EXE. On a GitHub-hosted
      # Windows runner the runner-images include Git for Windows
      # in the default PATH, so bash is found. On a self-hosted
      # Windows runner that's been registered with
      # register_runner.ps1, the installer's per-user PATH is
      # added to the *user* shell — but the
      # actions.runner.*-svc Windows service account that
      # actually executes jobs starts with the SYSTEM-level
      # PATH, which does NOT inherit Git for Windows' bin
      # directory.
      #
      # Symptom: every step with shell: bash fails with
      # ##[error]bash: command not found within the first few
      # lines (see logs #86661348651 for the canonical example).
      #
      # Contract: this step is **idempotent**. For each
      # prerequisite:
      #   - present on the runner → no-op (the
      #     common case once register_runner.ps1 + §九.3.1
      #     have been run once)
      #   - missing → install via winget (or MSI fallback) and
      #     wait until reachable
      #   - both fail (winget / network blocked) → emit
      #     ::error:: and exit 1, telling the operator
      #     what is broken and how to fix it on the runner
      #     (docs §九.3.1)
      #
      # if: runner.os == 'Windows' skips this step on the
      # macOS and Linux build jobs.
      #
      # Shell: shell: powershell (Windows PowerShell 5.1, ships
      # with every Windows install since Win7/2008R2). NOT
      # shell: pwsh — PowerShell 7 (pwsh.exe) is a *separate*
      # install that is NOT on the default PATH on either
      # GitHub-hosted or self-hosted Windows runners. On
      # GitHub-hosted runners GHA maps powershell →
      # C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      # which is always on the SYSTEM-level PATH inherited by
      # the runner service.
      #
      # Why this step is idempotent end-to-end:
      #   - The GHA runner invokes shell: powershell steps via
      #     powershell -command ". '<guid>.ps1'" (dot-sources a
      #     temp file in _work\_temp). That requires the
      #     SYSTEM ExecutionPolicy to NOT be Restricted. GitHub-
      #     hosted runners override this via Group Policy to
      #     RemoteSigned; self-hosted runners get the same
      #     override via register_runner.ps1 (which sets
      #     LocalMachine=RemoteSigned then restarts the
      #     service). If the operator skipped that step, this
      #     preflight fails immediately with a precise ::error::
      #     pointing at register_runner.ps1 instead of a cryptic
      #     ##[error]Process completed with exit code 1.
      #   - Git Bash is detected via Test-Path. If present, this
      #     step is a no-op cost (a few cmdlets). If absent, this
      #     step downloads and runs the Git for Windows installer —
      #     idempotent on re-run.
      #   - PowerShell 7 is detected via Test-Path. If present,
      #     no-op. If absent, downloads and runs the PowerShell 7 MSI
      #     installer directly (no winget dependency).
      #
      # Reference: https://github.com/actions/runner/issues/497
      # Reference: https://github.com/actions/runner/blob/main/src/Runner.Worker/Handlers/ScriptHandlerHelpers.cs
      - name: Ensure Git Bash + PowerShell 7 are on runner-service PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Probe PowerShell 7 + Git Bash via the dedicated helper.
          # This handles non-standard installs (operator-style
          # C:\Users\<user>\opt\pwsh7\, scoop, choco-shim dirs)
          # before falling back to auto-install. Without the
          # probe-first check, an auto-install would shadow an
          # existing install at a non-canonical path
          # (run #86820634953).
          $helper = Join-Path $env:GITHUB_WORKSPACE 'build_system/scripts/runner/find-prerequisites.ps1'
          if (Test-Path -LiteralPath $helper) {
            . $helper
          } else {
            # Inline fallback for older checkouts. Same
            # candidate list, same probe-first install-fallback
            # semantics as find-prerequisites.ps1. Crucially,
            # candidates are checked BEFORE `Get-Command`, so the
            # canonical C:\Program Files\Git\bin\bash.exe wins
            # over the WSL/Cygwin placeholder at
            # C:\Windows\System32\bash.exe that Get-Command
            # would otherwise return on GitHub-hosted windows-latest
            # (see actions/runner-images#12646).
            function Find-PwshLocation {
              foreach ($c in @("$env:ProgramFiles\PowerShell\7\pwsh.exe", "${env:ProgramFiles(x86)}\PowerShell\7\pwsh.exe", "$env:LOCALAPPDATA\Programs\PowerShell\7\pwsh.exe", "$env:USERPROFILE\opt\pwsh7\pwsh.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Find-BashLocation {
              foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe", "$env:USERPROFILE\scoop\apps\git\current\bin\bash.exe", "$env:ProgramData\chocolatey\bin\bash.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command bash.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Get-PwshDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
            function Get-BashDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
          }

          $gitBashInstallDir = 'C:\Program Files\Git'
          $gitBashBin       = Join-Path $gitBashInstallDir 'bin\bash.exe'
          $pwshInstallDir   = 'C:\Program Files\PowerShell\7'
          $pwshBin          = Join-Path $pwshInstallDir   'pwsh.exe'

          # --- (1) PowerShell ExecutionPolicy sanity check ---
          # Read directly from registry (Get-ExecutionPolicy
          # -List triggers loading of Microsoft.PowerShell.Security
          # whose Security.types.ps1xml fails AuthorizationManager
          # validation on some pwsh 7 installations).
          $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          if (-not $effectiveEp) {
            $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\7\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          }
          if (-not $effectiveEp) { $effectiveEp = 'RemoteSigned' }
          if ($effectiveEp -eq 'Restricted') {
            Write-Host "::error::PowerShell ExecutionPolicy (LocalMachine) is Restricted. The GHA runner dot-sources inline scripts via `powershell -command \". '<guid>.ps1'\"`, which Restricted rejects with `UnauthorizedAccess` BEFORE any step body runs. GitHub-hosted runners override this via Group Policy to `RemoteSigned`; self-hosted runners must do the same. Run on the runner machine (elevated PowerShell): `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force`, then restart the runner service (`C:\actions-runner\svc.cmd stop && C:\actions-runner\svc.cmd start`). This is set automatically by build_system/scripts/runner/setup-prerequisites.ps1 on the runner -- if it's still missing, run that script first."
            exit 1
          }
          Write-Host "[OK] PowerShell ExecutionPolicy (LocalMachine): $effectiveEp"

          # --- (2) Git Bash (PROBE-THEN-INSTALL) ---
          $gitBashBin = Find-BashLocation
          if ($gitBashBin) {
            Write-Host "[OK] Git Bash found at $gitBashBin (no install needed)"
          } else {
            Write-Host "[INFO] Git Bash not found via probe -- installing via direct download"
            $gitExe = "$env:TEMP\Git-Setup.exe"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $gitExe "https://github.com/git-for-windows/git/releases/download/v2.46.0.windows.1/Git-2.46.0-64-bit.exe"
              # Inno Setup /DIR expects the install TARGET dir
              # (parent of bin/), NOT bin/ subdir.
              Start-Process -Wait -FilePath $gitExe -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', "/DIR$gitBashInstallDir"
              Remove-Item $gitExe -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::Git for Windows install failed: $($_.Exception.Message). Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            if (-not (Test-Path $gitBashBin)) {
              Write-Host "::error::Git for Windows installer ran but $gitBashBin is still missing. Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            Write-Host "[OK] Git Bash installed at $gitBashBin"
          }
          $gitBashDir = Get-BashDir -BashPath $gitBashBin

          # (2b) Git Bash's bin directory on the runner-service
          # PATH? Git for Windows' installer only adds to user
          # PATH, but the service inherits SYSTEM PATH. Forward
          # to $GITHUB_PATH so all subsequent steps in this job
          # see it (and the service-level PATH still needs to be
          # set on the runner -- see docs 九.3.1).
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$gitBashDir*") {
            $gitBashDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$gitBashDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] Git Bash already on service PATH"
          }

          # --- (3) PowerShell 7 (PROBE-THEN-INSTALL) ---
          $pwshBin = Find-PwshLocation
          if ($pwshBin) {
            Write-Host "[OK] PowerShell 7 found at $pwshBin (no install needed)"
          } else {
            Write-Host "[INFO] PowerShell 7 not found via probe -- installing via direct MSI download"
            $msi = "$env:TEMP\pwsh.msi"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $msi "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
              # Start-Process -PassThru captures the real MSI exit
              # code; `msiexec ... | Out-Null` is unreliable
              # (msiexec is GUI-subsystem, PowerShell doesn't
              # block, $LASTEXITCODE reflects last NATIVE cmd).
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                Write-Host "::error::PowerShell 7 MSI install failed with exit code $($proc.ExitCode). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
                exit 1
              }
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::PowerShell 7 install failed: $($_.Exception.Message). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            if (-not (Test-Path $pwshBin)) {
              Write-Host "::error::PowerShell 7 install reported success but $pwshBin is still missing. Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            Write-Host "[OK] PowerShell 7 installed at $pwshBin"
          }
          $pwshDir = Get-PwshDir -PwshPath $pwshBin

          # (3b) PowerShell 7's directory on the runner-service PATH?
          # Same reasoning as (2b) for Git Bash: the service runs as
          # SYSTEM and inherits SYSTEM PATH, not the user's. Forward
          # to $GITHUB_PATH so bash/git operations that invoke pwsh
          # as a sub-shell (e.g. git config --list | pwsh -c "...")
          # do not fail with "command not found".
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$pwshDir*") {
            $pwshDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$pwshDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] PowerShell 7 already on service PATH"
          }

          # --- (4) Final summary ---
          Write-Host "[OK] Prerequisite check complete: Git Bash + PowerShell 7 reachable, ExecutionPolicy=$($effectiveEp)"

      - name: Validate Gitee credentials
        # Diagnostic guard for the 'fatal: could not read Username
        # for https://gitee.com' checkout failure.
        #
        # Two changes vs. the previous revision:
        #   1. Removed the if: github.server_url != 'https://github.com'
        #      guard. That guard made this step a silent no-op on the
        #      validate-tag job (which runs on GitHub-hosted
        #      ubuntu-latest and *also* checks out from Gitee), so an
        #      empty token there would only surface later as a
        #      confusing 'could not read Username' from actions/checkout.
        #      Now we always run this step on every job.
        #   2. Output a SHA256 fingerprint (8 hex chars) instead of
        #      just the byte length. Length is a weak check (a token
        #      with a trailing newline still has the right byte count
        #      but a different fingerprint, and 'echo' / shell
        #      substitution in the secret field can add CR + LF on
        #      copy-paste). Fingerprint lets us compare across jobs /
        #      runs without leaking the token itself.
        #
        # Runs under pwsh (PowerShell 7). On GitHub-hosted runners
        # (ubuntu-latest / macos-latest) pwsh 7 is preinstalled and
        # reachable as `pwsh`. On self-hosted Windows the previous
        # "Ensure ..." step adds pwsh.exe to GITHUB_PATH so this
        # step finds it.
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GITEE_TOKEN)) {
            '::error::secrets.GITEE_TOKEN is empty or unset. The release-cn workflow fetches source from https://gitee.com/songszchen/eCan.ai.git using a job-scoped GIT_ASKPASS that needs GITEE_TOKEN as the password (the username is hard-coded to ''oauth2''). Configure the token at Settings → Secrets and variables → Actions → GITEE_TOKEN. Without it, `git fetch origin` exits 128 with ''terminal prompts disabled'' — the very symptom this step is meant to replace.'
            exit 1
          }
          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) so the fingerprint is stable across jobs.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($clean)
          $hash  = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $fpr   = ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "[OK] GITEE_TOKEN present (length=$($bytes.Length) bytes, sha256=$($fpr.Substring(0,8)))"

      - name: Checkout from GitHub
        # GitHub-hosted runner path. Uses stock actions/checkout@v6
        # against the canonical github.com remote — no Gitee mirror,
        # no DNS workaround, no GIT_ASKPASS. Mutually exclusive with
        # the "Checkout from Gitee mirror" step below; the two ifs
        # cover the same two runner_group values without overlap.
        if: github.event.inputs.runner_group == 'github-hosted'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Checkout from Gitee mirror
        # Replaces actions/checkout@v6 against the Gitee mirror. The previous
        # inline pwsh port hung at 30 minutes when HTTPS to gitee.com stalled:
        # the in-script SSH fallback never fired ($useSsh was undefined), so the
        # retry ran the same HTTPS path with no timeout wrapper and waited out
        # the step cap. This bootstrap must be self-contained: no repository
        # file exists before checkout, and Gitee's /raw route is denied by the
        # China runner gateway even when Git Smart-HTTP is reachable.
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        timeout-minutes: 10
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("oauth2:$clean"))
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $ref = "${{ github.event.inputs.ref || github.ref }}"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          if (Test-Path -LiteralPath '.git') { Remove-Item -Recurse -Force '.git' }
          & $git init -q .
          & $git remote add origin 'https://gitee.com/songszchen/eCan.ai.git'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:HTTP_PROXY = ''; $env:HTTPS_PROXY = ''; $env:NO_PROXY = '*'
          & $git -c http.sslVerify=false -c http.proxy= -c https.proxy= `
            -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 `
            -c "http.extraHeader=Authorization: Basic $basic" `
            fetch --no-tags --prune --no-recurse-submodules --depth=1 origin $ref
          if ($LASTEXITCODE -ne 0) { throw "Gitee fetch failed for ref '$ref' (exit=$LASTEXITCODE)" }
          & $git checkout --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Git checkout failed (exit=$LASTEXITCODE)" }
          Write-Host "[OK] Checked out $ref at $(& $git rev-parse --short HEAD)"

      - name: Prepare Gitee credential helper
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        # Job-scoped credential store for any *downstream* git operation
        # against gitee.com — typically shared-cos-upload.yml's git push
        # of the appcast/last-release.json. The earlier 'Checkout from
        # Gitee mirror' step handles its own auth via a $env:TEMP askpass
        # file, so this step doesn't have to.
        #
        # We write our own credential.store file at $env:RUNNER_TEMP,
        # point git at it via a job-scoped GIT_CONFIG_GLOBAL
        # (exported through $env:GITHUB_ENV so subsequent steps inherit
        # it), and let git's standard credential subsystem handle
        # auth. Why $env:GITHUB_ENV instead of `git config --global`:
        # on a self-hosted runner that's been used for many repos,
        # the runner's user-global .gitconfig is shared across jobs.
        # Setting credential.* there would leak our token to every
        # other job the runner ever runs. $env:RUNNER_TEMP is per-job, so
        # the helper file is automatically GC'd at job end.
        #
        # This step MUST run after 'Checkout from Gitee mirror' —
        # $env:GITHUB_WORKSPACE is the just-checked-out tree. The
        # previous bash version also relied on the python script at
        # .github/scripts/write_gitconfig_gitee.py, but pwsh's
        # [IO.File]::WriteAllText + here-string sidesteps the bash
        # LF→CRLF translation entirely, so no helper script is needed
        # any more. The script is left in-tree for any third-party
        # workflow that still imports it.
        #
        # The previous bash version routed through
        # .github/scripts/write_gitconfig_gitee.py because `with open(...)
        # as f:` at column 0 inside a `run: |` block trips YAML's
        # block-mapping parser. pwsh doesn't have that ambiguity, so
        # we inline the LF-only file write here.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $credsFile    = Join-Path $env:RUNNER_TEMP '.git-credentials-gitee'
          $gitconfigFile = Join-Path $env:RUNNER_TEMP '.gitconfig-gitee'

          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) before embedding in the credentials URL.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')

          # credential.store format: URL with embedded username:password.
          # We deliberately include the scheme + host so it only matches
          # gitee.com (not, e.g., a hypothetical future gitee enterprise
          # tenant URL).
          $credsLine = "https://oauth2:${clean}@gitee.com"
          # LF-only write: .NET 8's WriteAllText on Windows writes CRLF
          # per Environment.NewLine; .gitconfig parsed by PortableGit
          # accepts CRLF, but writing LF keeps the file identical
          # across all three runner platforms.
          [System.IO.File]::WriteAllText($credsFile, ($credsLine + "`n"), [System.Text.UTF8Encoding]::new($false))

          # Job-scoped gitconfig. The [credential "https://gitee.com"]
          # section scopes the helper to gitee.com only — other hosts
          # (if any later step needs them) aren't affected.
          # core.autocrlf=false prevents git from re-expanding LF→CRLF
          # on read of the credentials file (which would break the
          # embedded newline detection in git's credential store).
          $gitconfigBody = @"
          [core]
              autocrlf = false
          [credential "https://gitee.com"]
              helper = store --file $credsFile
              username = oauth2
          "@
          [System.IO.File]::WriteAllText($gitconfigFile, ($gitconfigBody -replace '\r\n?', "`n"), [System.Text.UTF8Encoding]::new($false))

          # Export for downstream steps. GIT_CONFIG_GLOBAL is honored
          # by git 2.32+ on Linux/macOS. On the self-hosted Windows
          # runner, git-bash uses the same env var, so this works there
          # too.
          "GIT_CONFIG_GLOBAL=$gitconfigFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GITEE_CREDENTIALS_FILE=$credsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[OK] Gitee credential helper installed at $credsFile"
          Write-Host "       git will use GIT_CONFIG_GLOBAL=$gitconfigFile"

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          platform: macos
          requirements-file: requirements-macos.txt
          python-version: '3.12'
          architecture: arm64

      - name: Install app-specific dependencies
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -r "requirements-cn.txt"

      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright
        with:
          platform: macos
          arch: aarch64
          browsers: chromium

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env
        with:
          npm-registry: ${{ github.event.inputs.runner_group != 'github-hosted' && 'https://registry.npmmirror.com' || '' }}

      - name: Setup OTA signing key
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        shell: bash
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          mkdir -p build_system/certificates
          OTA_PRIVATE_KEY="$OTA_PRIVATE_KEY" python3 -c \
            'import base64, os, pathlib; pathlib.Path("build_system/certificates/ed25519_private_key.pem").write_bytes(base64.b64decode(os.environ["OTA_PRIVATE_KEY"]))'
          chmod 600 build_system/certificates/ed25519_private_key.pem

      - name: Build macOS package
        shell: bash
        env:
          ECAN_SKIP_FRONTEND_BUILD: '0'
          ECAN_ENVIRONMENT: ${{ needs.validate-tag.outputs.environment }}
        run: |
          python3 build.py prod --version ${{ needs.validate-tag.outputs.version }} --app cn

      - name: Sign and notarize macOS artifact
        # STUB — UNVERIFIED on a real Developer-ID-equipped runner.
        # See build_system/build_utils.py::sign_macos_prod docstring
        # for the smoke checklist. Until that's green, the function
        # is gated on every required env var being present (and
        # non-"NOT_SET"), so an unconfigured job is a no-op that
        # preserves today's un-signed-and-un-notarized behaviour.
        if: env.MAC_CODESIGN_IDENTITY != 'NOT_SET'
        shell: bash
        env:
          MAC_CERT_P12:                ${{ secrets.MAC_CERT_P12                || 'NOT_SET' }}
          MAC_CERT_PASSWORD:           ${{ secrets.MAC_CERT_PASSWORD           || 'NOT_SET' }}
          MAC_CODESIGN_IDENTITY:       ${{ secrets.MAC_CODESIGN_IDENTITY       || 'NOT_SET' }}
          APPLE_ID:                    ${{ secrets.APPLE_ID                    || 'NOT_SET' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || 'NOT_SET' }}
          TEAM_ID:                     ${{ secrets.TEAM_ID                     || 'NOT_SET' }}
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from build_system.build_utils import sign_macos_prod; sys.exit(0 if sign_macos_prod() else 1)"

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # Resolve the macOS aarch64 package path explicitly so we can
          # distinguish "build succeeded but copy failed" from "build
          # failed upstream". See the matching comment in
          # build-macos-amd64 for why this throws on miss.
          if ! ls dist/*-macos-aarch64.* 1>/dev/null 2>&1; then
            echo "::error::Expected macOS aarch64 package not found in dist/. build.py prod did not produce an installer. The build pipeline is broken; investigate the 'Build macOS package' step above before retrying."
            exit 1
          fi
          cp dist/*-macos-aarch64.* artifacts/

      - name: Upload macOS aarch64 artifacts (S3 transfer)
        uses: actions/upload-artifact@v6
        with:
          name: eCan-macos-aarch64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          # Belt-and-braces: Prepare artifacts already exits 1 when the
          # expected .pkg is missing, so this branch is a backstop for
          # any future regression. Without it, an empty artifacts/
          # directory would let upload succeed as a yellow "No files
          # were found" warning, hiding the real failure.
          if-no-files-found: error

      - name: Upload macOS aarch64 artifacts (debug mirror)
        if: github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-macos-aarch64-${{ needs.validate-tag.outputs.version }}
          path: artifacts/
          retention-days: 7
          compression-level: 6

  build-linux:
    name: Build Linux amd64
    needs: validate-tag
    if: |
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all') &&
      (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == '') &&
      (github.event.inputs.runner_group == 'github-hosted' || github.event.inputs.runner_group == 'ecan-linux-amd64')
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-linux-amd64' && fromJSON('["self-hosted","linux","x64","ecan-build"]') || 'ubuntu-latest' }}
    env:
      BUILD_ARCH: amd64
      DEBIAN_FRONTEND: noninteractive
      ECAN_APP_ID: cn
      ECAN_APP_NAME: eCan.cn
      DIST_APP: eCan.cn
    timeout-minutes: 60

    steps:
      # Self-hosted Windows runner prerequisite check + install:
      # Git Bash + PowerShell 7 (pwsh.exe) must be reachable
      # for shell: bash and shell: pwsh steps.
      #
      # GitHub Actions' shell: bash on Windows resolves to
      # C:\Program Files\Git\bin\bash.EXE. On a GitHub-hosted
      # Windows runner the runner-images include Git for Windows
      # in the default PATH, so bash is found. On a self-hosted
      # Windows runner that's been registered with
      # register_runner.ps1, the installer's per-user PATH is
      # added to the *user* shell — but the
      # actions.runner.*-svc Windows service account that
      # actually executes jobs starts with the SYSTEM-level
      # PATH, which does NOT inherit Git for Windows' bin
      # directory.
      #
      # Symptom: every step with shell: bash fails with
      # ##[error]bash: command not found within the first few
      # lines (see logs #86661348651 for the canonical example).
      #
      # Contract: this step is **idempotent**. For each
      # prerequisite:
      #   - present on the runner → no-op (the
      #     common case once register_runner.ps1 + §九.3.1
      #     have been run once)
      #   - missing → install via winget (or MSI fallback) and
      #     wait until reachable
      #   - both fail (winget / network blocked) → emit
      #     ::error:: and exit 1, telling the operator
      #     what is broken and how to fix it on the runner
      #     (docs §九.3.1)
      #
      # if: runner.os == 'Windows' skips this step on the
      # macOS and Linux build jobs.
      #
      # Shell: shell: powershell (Windows PowerShell 5.1, ships
      # with every Windows install since Win7/2008R2). NOT
      # shell: pwsh — PowerShell 7 (pwsh.exe) is a *separate*
      # install that is NOT on the default PATH on either
      # GitHub-hosted or self-hosted Windows runners. On
      # GitHub-hosted runners GHA maps powershell →
      # C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
      # which is always on the SYSTEM-level PATH inherited by
      # the runner service.
      #
      # Why this step is idempotent end-to-end:
      #   - The GHA runner invokes shell: powershell steps via
      #     powershell -command ". '<guid>.ps1'" (dot-sources a
      #     temp file in _work\_temp). That requires the
      #     SYSTEM ExecutionPolicy to NOT be Restricted. GitHub-
      #     hosted runners override this via Group Policy to
      #     RemoteSigned; self-hosted runners get the same
      #     override via register_runner.ps1 (which sets
      #     LocalMachine=RemoteSigned then restarts the
      #     service). If the operator skipped that step, this
      #     preflight fails immediately with a precise ::error::
      #     pointing at register_runner.ps1 instead of a cryptic
      #     ##[error]Process completed with exit code 1.
      #   - Git Bash is detected via Test-Path. If present, this
      #     step is a no-op cost (a few cmdlets). If absent, this
      #     step downloads and runs the Git for Windows installer —
      #     idempotent on re-run.
      #   - PowerShell 7 is detected via Test-Path. If present,
      #     no-op. If absent, downloads and runs the PowerShell 7 MSI
      #     installer directly (no winget dependency).
      #
      # Reference: https://github.com/actions/runner/issues/497
      # Reference: https://github.com/actions/runner/blob/main/src/Runner.Worker/Handlers/ScriptHandlerHelpers.cs
      - name: Ensure Git Bash + PowerShell 7 are on runner-service PATH (Windows self-hosted)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Probe PowerShell 7 + Git Bash via the dedicated helper.
          # This handles non-standard installs (operator-style
          # C:\Users\<user>\opt\pwsh7\, scoop, choco-shim dirs)
          # before falling back to auto-install. Without the
          # probe-first check, an auto-install would shadow an
          # existing install at a non-canonical path
          # (run #86820634953).
          $helper = Join-Path $env:GITHUB_WORKSPACE 'build_system/scripts/runner/find-prerequisites.ps1'
          if (Test-Path -LiteralPath $helper) {
            . $helper
          } else {
            # Inline fallback for older checkouts. Same
            # candidate list, same probe-first install-fallback
            # semantics as find-prerequisites.ps1. Crucially,
            # candidates are checked BEFORE `Get-Command`, so the
            # canonical C:\Program Files\Git\bin\bash.exe wins
            # over the WSL/Cygwin placeholder at
            # C:\Windows\System32\bash.exe that Get-Command
            # would otherwise return on GitHub-hosted windows-latest
            # (see actions/runner-images#12646).
            function Find-PwshLocation {
              foreach ($c in @("$env:ProgramFiles\PowerShell\7\pwsh.exe", "${env:ProgramFiles(x86)}\PowerShell\7\pwsh.exe", "$env:LOCALAPPDATA\Programs\PowerShell\7\pwsh.exe", "$env:USERPROFILE\opt\pwsh7\pwsh.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command pwsh.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Find-BashLocation {
              foreach ($c in @("$env:ProgramFiles\Git\bin\bash.exe", "${env:ProgramFiles(x86)}\Git\bin\bash.exe", "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe", "$env:USERPROFILE\scoop\apps\git\current\bin\bash.exe", "$env:ProgramData\chocolatey\bin\bash.exe")) { if ($c -and (Test-Path -LiteralPath $c)) { return $c } }
              $pathHit = Get-Command bash.exe -ErrorAction SilentlyContinue
              if ($pathHit) {
                $parent = Split-Path -Parent $pathHit.Source
                if ($parent -ne "$env:SystemRoot\System32" -and $parent -ne "$env:WinDir\System32") { return $pathHit.Source }
              }
              return $null
            }
            function Get-PwshDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
            function Get-BashDir { param([string]$P) if (-not $P) { return $null } [System.IO.Path]::GetDirectoryName($P) }
          }

          $gitBashInstallDir = 'C:\Program Files\Git'
          $gitBashBin       = Join-Path $gitBashInstallDir 'bin\bash.exe'
          $pwshInstallDir   = 'C:\Program Files\PowerShell\7'
          $pwshBin          = Join-Path $pwshInstallDir   'pwsh.exe'

          # --- (1) PowerShell ExecutionPolicy sanity check ---
          # Read directly from registry (Get-ExecutionPolicy
          # -List triggers loading of Microsoft.PowerShell.Security
          # whose Security.types.ps1xml fails AuthorizationManager
          # validation on some pwsh 7 installations).
          $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          if (-not $effectiveEp) {
            $effectiveEp = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\PowerShell\7\ShellIds\Microsoft.PowerShell' -Name ExecutionPolicy -ErrorAction SilentlyContinue).ExecutionPolicy
          }
          if (-not $effectiveEp) { $effectiveEp = 'RemoteSigned' }
          if ($effectiveEp -eq 'Restricted') {
            Write-Host "::error::PowerShell ExecutionPolicy (LocalMachine) is Restricted. The GHA runner dot-sources inline scripts via `powershell -command \". '<guid>.ps1'\"`, which Restricted rejects with `UnauthorizedAccess` BEFORE any step body runs. GitHub-hosted runners override this via Group Policy to `RemoteSigned`; self-hosted runners must do the same. Run on the runner machine (elevated PowerShell): `Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope LocalMachine -Force`, then restart the runner service (`C:\actions-runner\svc.cmd stop && C:\actions-runner\svc.cmd start`). This is set automatically by build_system/scripts/runner/setup-prerequisites.ps1 on the runner -- if it's still missing, run that script first."
            exit 1
          }
          Write-Host "[OK] PowerShell ExecutionPolicy (LocalMachine): $effectiveEp"

          # --- (2) Git Bash (PROBE-THEN-INSTALL) ---
          $gitBashBin = Find-BashLocation
          if ($gitBashBin) {
            Write-Host "[OK] Git Bash found at $gitBashBin (no install needed)"
          } else {
            Write-Host "[INFO] Git Bash not found via probe -- installing via direct download"
            $gitExe = "$env:TEMP\Git-Setup.exe"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $gitExe "https://github.com/git-for-windows/git/releases/download/v2.46.0.windows.1/Git-2.46.0-64-bit.exe"
              # Inno Setup /DIR expects the install TARGET dir
              # (parent of bin/), NOT bin/ subdir.
              Start-Process -Wait -FilePath $gitExe -ArgumentList '/VERYSILENT', '/NORESTART', '/NOCANCEL', '/SP-', '/CLOSEAPPLICATIONS', '/RESTARTAPPLICATIONS', "/DIR$gitBashInstallDir"
              Remove-Item $gitExe -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::Git for Windows install failed: $($_.Exception.Message). Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            if (-not (Test-Path $gitBashBin)) {
              Write-Host "::error::Git for Windows installer ran but $gitBashBin is still missing. Install Git for Windows manually: https://git-scm.com/download/win"
              exit 1
            }
            Write-Host "[OK] Git Bash installed at $gitBashBin"
          }
          $gitBashDir = Get-BashDir -BashPath $gitBashBin

          # (2b) Git Bash's bin directory on the runner-service
          # PATH? Git for Windows' installer only adds to user
          # PATH, but the service inherits SYSTEM PATH. Forward
          # to $GITHUB_PATH so all subsequent steps in this job
          # see it (and the service-level PATH still needs to be
          # set on the runner -- see docs 九.3.1).
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$gitBashDir*") {
            $gitBashDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$gitBashDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] Git Bash already on service PATH"
          }

          # --- (3) PowerShell 7 (PROBE-THEN-INSTALL) ---
          $pwshBin = Find-PwshLocation
          if ($pwshBin) {
            Write-Host "[OK] PowerShell 7 found at $pwshBin (no install needed)"
          } else {
            Write-Host "[INFO] PowerShell 7 not found via probe -- installing via direct MSI download"
            $msi = "$env:TEMP\pwsh.msi"
            try {
              Invoke-WebRequest -UseBasicParsing -OutFile $msi "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
              # Start-Process -PassThru captures the real MSI exit
              # code; `msiexec ... | Out-Null` is unreliable
              # (msiexec is GUI-subsystem, PowerShell doesn't
              # block, $LASTEXITCODE reflects last NATIVE cmd).
              $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                Write-Host "::error::PowerShell 7 MSI install failed with exit code $($proc.ExitCode). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
                exit 1
              }
              Remove-Item $msi -Force -ErrorAction SilentlyContinue
            } catch {
              Write-Host "::error::PowerShell 7 install failed: $($_.Exception.Message). Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            if (-not (Test-Path $pwshBin)) {
              Write-Host "::error::PowerShell 7 install reported success but $pwshBin is still missing. Install PowerShell 7 manually on the runner -- see docs/Windows构建环境部署清单.md 九.3.1"
              exit 1
            }
            Write-Host "[OK] PowerShell 7 installed at $pwshBin"
          }
          $pwshDir = Get-PwshDir -PwshPath $pwshBin

          # (3b) PowerShell 7's directory on the runner-service PATH?
          # Same reasoning as (2b) for Git Bash: the service runs as
          # SYSTEM and inherits SYSTEM PATH, not the user's. Forward
          # to $GITHUB_PATH so bash/git operations that invoke pwsh
          # as a sub-shell (e.g. git config --list | pwsh -c "...")
          # do not fail with "command not found".
          $svcPath = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if ($svcPath -notlike "*$pwshDir*") {
            $pwshDir | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
            Write-Host "[OK] Appended '$pwshDir' to GITHUB_PATH for subsequent steps"
          } else {
            Write-Host "[OK] PowerShell 7 already on service PATH"
          }

          # --- (4) Final summary ---
          Write-Host "[OK] Prerequisite check complete: Git Bash + PowerShell 7 reachable, ExecutionPolicy=$($effectiveEp)"

      - name: Validate Gitee credentials
        # Diagnostic guard for the 'fatal: could not read Username
        # for https://gitee.com' checkout failure.
        #
        # Two changes vs. the previous revision:
        #   1. Removed the if: github.server_url != 'https://github.com'
        #      guard. That guard made this step a silent no-op on the
        #      validate-tag job (which runs on GitHub-hosted
        #      ubuntu-latest and *also* checks out from Gitee), so an
        #      empty token there would only surface later as a
        #      confusing 'could not read Username' from actions/checkout.
        #      Now we always run this step on every job.
        #   2. Output a SHA256 fingerprint (8 hex chars) instead of
        #      just the byte length. Length is a weak check (a token
        #      with a trailing newline still has the right byte count
        #      but a different fingerprint, and 'echo' / shell
        #      substitution in the secret field can add CR + LF on
        #      copy-paste). Fingerprint lets us compare across jobs /
        #      runs without leaking the token itself.
        #
        # Runs under pwsh (PowerShell 7). On GitHub-hosted runners
        # (ubuntu-latest / macos-latest) pwsh 7 is preinstalled and
        # reachable as `pwsh`. On self-hosted Windows the previous
        # "Ensure ..." step adds pwsh.exe to GITHUB_PATH so this
        # step finds it.
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:GITEE_TOKEN)) {
            '::error::secrets.GITEE_TOKEN is empty or unset. The release-cn workflow fetches source from https://gitee.com/songszchen/eCan.ai.git using a job-scoped GIT_ASKPASS that needs GITEE_TOKEN as the password (the username is hard-coded to ''oauth2''). Configure the token at Settings → Secrets and variables → Actions → GITEE_TOKEN. Without it, `git fetch origin` exits 128 with ''terminal prompts disabled'' — the very symptom this step is meant to replace.'
            exit 1
          }
          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) so the fingerprint is stable across jobs.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($clean)
          $hash  = [System.Security.Cryptography.SHA256]::HashData($bytes)
          $fpr   = ($hash | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "[OK] GITEE_TOKEN present (length=$($bytes.Length) bytes, sha256=$($fpr.Substring(0,8)))"

      - name: Checkout from GitHub
        # GitHub-hosted runner path. Uses stock actions/checkout@v6
        # against the canonical github.com remote — no Gitee mirror,
        # no DNS workaround, no GIT_ASKPASS. Mutually exclusive with
        # the "Checkout from Gitee mirror" step below; the two ifs
        # cover the same two runner_group values without overlap.
        if: github.event.inputs.runner_group == 'github-hosted'
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1
          submodules: recursive

      - name: Checkout from Gitee mirror
        # Replaces actions/checkout@v6 against the Gitee mirror. The previous
        # inline pwsh port hung at 30 minutes when HTTPS to gitee.com stalled:
        # the in-script SSH fallback never fired ($useSsh was undefined), so the
        # retry ran the same HTTPS path with no timeout wrapper and waited out
        # the step cap. This bootstrap must be self-contained: no repository
        # file exists before checkout, and Gitee's /raw route is denied by the
        # China runner gateway even when Git Smart-HTTP is reachable.
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        timeout-minutes: 10
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("oauth2:$clean"))
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $ref = "${{ github.event.inputs.ref || github.ref }}"
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          if (Test-Path -LiteralPath '.git') { Remove-Item -Recurse -Force '.git' }
          & $git init -q .
          & $git remote add origin 'https://gitee.com/songszchen/eCan.ai.git'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:HTTP_PROXY = ''; $env:HTTPS_PROXY = ''; $env:NO_PROXY = '*'
          & $git -c http.sslVerify=false -c http.proxy= -c https.proxy= `
            -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 `
            -c "http.extraHeader=Authorization: Basic $basic" `
            fetch --no-tags --prune --no-recurse-submodules --depth=1 origin $ref
          if ($LASTEXITCODE -ne 0) { throw "Gitee fetch failed for ref '$ref' (exit=$LASTEXITCODE)" }
          & $git checkout --force --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Git checkout failed (exit=$LASTEXITCODE)" }
          Write-Host "[OK] Checked out $ref at $(& $git rev-parse --short HEAD)"

      - name: Prepare Gitee credential helper
        if: github.event.inputs.runner_group != 'github-hosted'
        shell: pwsh
        # Job-scoped credential store for any *downstream* git operation
        # against gitee.com — typically shared-cos-upload.yml's git push
        # of the appcast/last-release.json. The earlier 'Checkout from
        # Gitee mirror' step handles its own auth via a $env:TEMP askpass
        # file, so this step doesn't have to.
        #
        # We write our own credential.store file at $env:RUNNER_TEMP,
        # point git at it via a job-scoped GIT_CONFIG_GLOBAL
        # (exported through $env:GITHUB_ENV so subsequent steps inherit
        # it), and let git's standard credential subsystem handle
        # auth. Why $env:GITHUB_ENV instead of `git config --global`:
        # on a self-hosted runner that's been used for many repos,
        # the runner's user-global .gitconfig is shared across jobs.
        # Setting credential.* there would leak our token to every
        # other job the runner ever runs. $env:RUNNER_TEMP is per-job, so
        # the helper file is automatically GC'd at job end.
        #
        # This step MUST run after 'Checkout from Gitee mirror' —
        # $env:GITHUB_WORKSPACE is the just-checked-out tree. The
        # previous bash version also relied on the python script at
        # .github/scripts/write_gitconfig_gitee.py, but pwsh's
        # [IO.File]::WriteAllText + here-string sidesteps the bash
        # LF→CRLF translation entirely, so no helper script is needed
        # any more. The script is left in-tree for any third-party
        # workflow that still imports it.
        #
        # The previous bash version routed through
        # .github/scripts/write_gitconfig_gitee.py because `with open(...)
        # as f:` at column 0 inside a `run: |` block trips YAML's
        # block-mapping parser. pwsh doesn't have that ambiguity, so
        # we inline the LF-only file write here.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'

          $credsFile    = Join-Path $env:RUNNER_TEMP '.git-credentials-gitee'
          $gitconfigFile = Join-Path $env:RUNNER_TEMP '.gitconfig-gitee'

          # Strip CR/LF (echo / shell substitution on copy-paste can
          # introduce them) before embedding in the credentials URL.
          $clean = ($env:GITEE_TOKEN -replace '[\r\n]+', '')

          # credential.store format: URL with embedded username:password.
          # We deliberately include the scheme + host so it only matches
          # gitee.com (not, e.g., a hypothetical future gitee enterprise
          # tenant URL).
          $credsLine = "https://oauth2:${clean}@gitee.com"
          # LF-only write: .NET 8's WriteAllText on Windows writes CRLF
          # per Environment.NewLine; .gitconfig parsed by PortableGit
          # accepts CRLF, but writing LF keeps the file identical
          # across all three runner platforms.
          [System.IO.File]::WriteAllText($credsFile, ($credsLine + "`n"), [System.Text.UTF8Encoding]::new($false))

          # Job-scoped gitconfig. The [credential "https://gitee.com"]
          # section scopes the helper to gitee.com only — other hosts
          # (if any later step needs them) aren't affected.
          # core.autocrlf=false prevents git from re-expanding LF→CRLF
          # on read of the credentials file (which would break the
          # embedded newline detection in git's credential store).
          $gitconfigBody = @"
          [core]
              autocrlf = false
          [credential "https://gitee.com"]
              helper = store --file $credsFile
              username = oauth2
          "@
          [System.IO.File]::WriteAllText($gitconfigFile, ($gitconfigBody -replace '\r\n?', "`n"), [System.Text.UTF8Encoding]::new($false))

          # Export for downstream steps. GIT_CONFIG_GLOBAL is honored
          # by git 2.32+ on Linux/macOS. On the self-hosted Windows
          # runner, git-bash uses the same env var, so this works there
          # too.
          "GIT_CONFIG_GLOBAL=$gitconfigFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GITEE_CREDENTIALS_FILE=$credsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "[OK] Gitee credential helper installed at $credsFile"
          Write-Host "       git will use GIT_CONFIG_GLOBAL=$gitconfigFile"

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          platform: linux
          requirements-file: requirements-linux.txt
          architecture: x64

      - name: Install app-specific dependencies
        shell: bash
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          pip install -r "requirements-cn.txt"

      - name: Setup Playwright Browsers
        uses: ./.github/actions/setup-playwright
        with:
          platform: linux
          browsers: chromium

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env
        with:
          npm-registry: ${{ github.event.inputs.runner_group != 'github-hosted' && 'https://registry.npmmirror.com' || '' }}

      - name: Setup WhatsApp Baileys Bridge Environment
        uses: ./.github/actions/setup-wabaileys-bridge
        with:
          node-version: '20'
          bridge-dir: wabaileys-bridge

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ make pkg-config libffi-dev libssl-dev
          sudo apt-get install -y -qq libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-cursor0 libdbus-1-3 libxcb-xkb1 libxkbcommon0
          sudo apt-get install -y -qq scrot wmctrl xdotool xdg-utils cups cups-client tesseract-ocr tesseract-ocr-eng dpkg-dev fakeroot
          sudo apt-get install -y -qq xvfb
          # upx-ucl: required by PyInstaller --upx-dir when build_config.json
          # prod profile enables upx_compression. Without this, PyInstaller
          # silently skips compression (see linux_builder.py fallback).
          # Ubuntu's `upx-ucl` package provides the `upx` binary on PATH.
          sudo apt-get install -y -qq upx-ucl

      - name: Install AppImage tools
        run: |
          # appimagetool moved from the deprecated AppImage/AppImageKit
          # repo to its own home at AppImage/appimagetool in 2024.
          # The asset name (appimagetool-x86_64.AppImage) and the
          # continuous tag are unchanged, only the owner differs.
          # Using the legacy URL silently 404s in CI.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Setup OTA signing key
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        shell: bash
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_ED25519_PRIVATE_KEY }}
        run: |
          mkdir -p build_system/certificates
          OTA_PRIVATE_KEY="$OTA_PRIVATE_KEY" python3 -c \
            'import base64, os, pathlib; pathlib.Path("build_system/certificates/ed25519_private_key.pem").write_bytes(base64.b64decode(os.environ["OTA_PRIVATE_KEY"]))'
          chmod 600 build_system/certificates/ed25519_private_key.pem

      - name: Build Linux packages
        shell: bash
        env:
          ECAN_SKIP_FRONTEND_BUILD: '0'
          ECAN_ENVIRONMENT: ${{ needs.validate-tag.outputs.environment }}
        run: |
          python3 build.py prod --version ${{ needs.validate-tag.outputs.version }} --app cn

      - name: Generate Ed25519 signatures
        if: |
          needs.validate-tag.outputs.environment == 'production' ||
          needs.validate-tag.outputs.environment == 'staging' ||
          needs.validate-tag.outputs.environment == 'test'
        shell: bash
        run: |
          pip install cryptography --quiet
          # Sign the .deb (required: apt-downgrade integrity check).
          # DIST_APP matches build.py's installer_filename prefix:
          # {app.name}-{version}-linux-{arch}.{deb,AppImage}
          # (app.name == DIST_APP == ECAN_APP_NAME).
          python3 build_system/signing_manager.py \
            "dist/${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb" \
            "build_system/certificates/ed25519_private_key.pem" \
            "dist/${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-linux-amd64.deb.sig"
          # Also sign the AppImage — Prepare artifacts below copies
          # .AppImage.sig into the artifact staging directory, but
          # without this line the signature is never produced and the
          # uploader silently ships an unsigned AppImage. The signing
          # tool is generic (just an ed25519 detached sig), so the
          # same private key works for both formats.
          APPIMAGE="dist/${{ env.DIST_APP }}-${{ needs.validate-tag.outputs.version }}-linux-amd64.AppImage"
          if [ -f "$APPIMAGE" ]; then
            python3 build_system/signing_manager.py \
              "$APPIMAGE" \
              "build_system/certificates/ed25519_private_key.pem" \
              "${APPIMAGE}.sig"
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          echo "[DEBUG] Working directory: $(pwd)"
          echo "[DEBUG] Contents of dist/:"
          ls -la dist/ 2>/dev/null || echo "[DEBUG] dist/ does not exist or is empty"
          VERSION="${{ needs.validate-tag.outputs.version }}"
          mkdir -p artifacts
          # Resolve each expected Linux artifact explicitly so we can
          # distinguish "build succeeded but copy failed" from "build
          # failed upstream". At least one of .deb or .AppImage must
          # exist — if build.py prod produced neither, that's a hard
          # pipeline failure and the upload-to-COS / upload-to-S3 jobs
          # must not silently swallow it.
          # DIST_APP matches build.py's installer_filename prefix
          # (eCan for intl, eCan.cn for cn).
          DEB="dist/${{ env.DIST_APP }}-${VERSION}-linux-amd64.deb"
          APPIMAGE="dist/${{ env.DIST_APP }}-${VERSION}-linux-amd64.AppImage"
          if [ ! -f "$DEB" ] && [ ! -f "$APPIMAGE" ]; then
            echo "::error::Expected Linux package not found in dist/ (looked for $DEB and $APPIMAGE). build.py prod did not produce a .deb or .AppImage. The build pipeline is broken; investigate the 'Build Linux packages' step above before retrying."
            exit 1
          fi
          for f in $DEB ${DEB}.sig $APPIMAGE ${APPIMAGE}.sig; do
            # `|| true` swallows the exit code from a missing source so the
            # `for` loop's overall exit code (which equals the LAST
            # iteration's last command) does not fail the step under
            # `set -e -o pipefail` when AppImage is not built. Without
            # this, a successful DEB-only build fails with
            # "Process completed with exit code 1" even though every
            # present file was copied correctly.
            [ -f "$f" ] && cp "$f" artifacts/ || true
          done
          # Explicit summary so missing files are visible in logs (the
          # `[ -f "$f" ] && cp` short-circuit is silent on purpose, but
          # operators still need to know whether AppImage was built).
          echo "[ARTIFACTS] Copied: $DEB $DEB.sig $APPIMAGE $APPIMAGE.sig"
          echo "[ARTIFACTS] DEB present: $([ -f "$DEB" ] && echo yes || echo no)"
          echo "[ARTIFACTS] APPIMAGE present: $([ -f "$APPIMAGE" ] && echo yes || echo no)"

      - name: Upload Linux artifacts (S3 transfer)
        uses: actions/upload-artifact@v6
        with:
          name: eCan-linux-amd64-${{ needs.validate-tag.outputs.version }}-s3-transfer
          path: artifacts/
          retention-days: 1
          compression-level: 6
          # Belt-and-braces: Prepare artifacts already exits 1 when
          # neither .deb nor .AppImage exists, so this branch is a
          # backstop for any future regression. Without it, an empty
          # artifacts/ directory would let upload succeed as a yellow
          # "No files were found" warning, hiding the real failure.
          if-no-files-found: error

      - name: Upload Linux artifacts (debug mirror)
        if: github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: eCan-linux-amd64-${{ needs.validate-tag.outputs.version }}
          path: artifacts/
          retention-days: 7
          compression-level: 6

  # ──────────────────────────────────────────────────────────────────────
  # Stage 3 — Upload to S3, generate appcast + links + summary
  # ──────────────────────────────────────────────────────────────────────

  upload-to-cos:
    name: Upload to COS
    needs: [validate-tag, build-windows, build-macos-amd64, build-macos-aarch64, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success' ||
       (needs.build-macos-amd64.result == 'success' || needs.build-macos-aarch64.result == 'success'))
    # The reusable upload workflow internally uses `continue-on-error:
    # true` on the upload step, so even if <BACKEND> is unreachable /
    # auth is broken / SDK errored, the job itself reports success and
    # does not fail the pipeline. The real outcome is propagated via
    # the upload-success output (true/false), which downstream
    # appcast / download-links / latest-json jobs gate on. If
    # upload-success is false, those downstream jobs skip (their
    # output would point at a CDN that has no files) and
    # final-status instead surfaces the GHA artifact URLs as a
    # temporary fallback download.
    uses: ./.github/workflows/shared-cos-upload.yml
    with:
      version:     ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
    secrets: inherit

  generate-appcast:
    name: Generate Appcast (all platforms × archs)
    needs: [validate-tag, upload-to-cos, build-windows, build-macos-amd64, build-macos-aarch64, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.outputs.upload-success == 'true' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-macos-amd64.result == 'success' ||
       needs.build-macos-aarch64.result == 'success')
    uses: ./.github/workflows/shared-cos-appcast-generation.yml
    with:
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel:     ${{ needs.validate-tag.outputs.channel }}
      version:     ${{ needs.validate-tag.outputs.version }}
      user-prefix: ${{ needs.validate-tag.outputs.user-prefix }}
      app:         cn
      platform:    all
      arch:        all
    secrets: inherit

  generate-latest-json:
    name: Generate latest.json
    needs: [validate-tag, generate-appcast, upload-to-cos]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.generate-appcast.result == 'success'
    uses: ./.github/workflows/shared-cos-latest-json.yml
    with:
      version:     ${{ needs.validate-tag.outputs.version }}
      environment: ${{ needs.validate-tag.outputs.environment }}
      channel:     ${{ needs.validate-tag.outputs.channel }}
      app:         cn
      platform:    all
      arch:        all
    secrets: inherit

  generate-download-links:
    name: Generate Download Links
    needs: [validate-tag, upload-to-cos, build-windows, build-macos-amd64, build-macos-aarch64, build-linux]
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.outputs.upload-success == 'true'
    uses: ./.github/workflows/shared-cos-download-links.yml
    with:
      version:        ${{ needs.validate-tag.outputs.version }}
      environment:    ${{ needs.validate-tag.outputs.environment }}
      channel:        ${{ needs.validate-tag.outputs.channel }}
      windows-build-result:  ${{ needs.build-windows.result }}
      macos-build-result:    ${{ (needs.build-macos-amd64.result == 'success' || needs.build-macos-aarch64.result == 'success') && 'success' || 'failure' }}
      linux-result:          ${{ needs.build-linux.result }}
      macos-built-amd64:     ${{ needs.build-macos-amd64.result == 'success' }}
      macos-built-aarch64:   ${{ needs.build-macos-aarch64.result == 'success' }}
    secrets: inherit

  final-status:
    name: Final Status Summary
    needs: [validate-tag, build-windows, build-macos-amd64, build-macos-aarch64, build-linux, upload-to-cos, generate-appcast, generate-latest-json, generate-download-links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Show summary
        env:
          VERSION:           ${{ needs.validate-tag.outputs.version }}
          WINDOWS_RESULT:    ${{ needs.build-windows.result }}
          MACOS_AMD64:       ${{ needs.build-macos-amd64.result }}
          MACOS_AARCH64:     ${{ needs.build-macos-aarch64.result }}
          LINUX_RESULT:      ${{ needs.build-linux.result }}
          UPLOAD_RESULT:     ${{ needs.upload-to-cos.outputs.upload-success }}
          APPCAST_RESULT:    ${{ needs.generate-appcast.result }}
          LATEST_RESULT:     ${{ needs.generate-latest-json.result }}
          LINKS_RESULT:      ${{ needs.generate-download-links.result }}
        run: |
          echo ""
          echo "================ Release (CN) Summary ================"
          echo "Version: ${VERSION}"
          echo ""
          echo "Builds:"
          echo "  Windows amd64:  ${WINDOWS_RESULT}"
          echo "  macOS amd64:    ${MACOS_AMD64}"
          echo "  macOS aarch64:  ${MACOS_AARCH64}"
          echo "  Linux amd64:    ${LINUX_RESULT}"
          echo ""
          echo "Distribution:"
          echo "  COS upload:     ${UPLOAD_RESULT}"
          echo "  Appcast:        ${APPCAST_RESULT}"
          echo "  latest.json:    ${LATEST_RESULT}"
          echo "  Download links: ${LINKS_RESULT}"
          echo "======================================================="

          # Promote silent failures to visible ::error:: annotations.
          # See release-intl.yml's Show summary step for the full
          # rationale — short version: without this, an empty
          # UPLOAD_RESULT (caused by the set -e / rc=$? bug in
          # shared-{s3,cos}-upload.yml) prints a blank COS upload:
          # line that the operator has to mentally resolve.
          any_failed=0
          for entry in "Windows:${WINDOWS_RESULT}" \
                       "macOS amd64:${MACOS_AMD64}" \
                       "macOS aarch64:${MACOS_AARCH64}" \
                       "Linux:${LINUX_RESULT}" \
                       "COS upload:${UPLOAD_RESULT}" \
                       "Appcast:${APPCAST_RESULT}" \
                       "latest.json:${LATEST_RESULT}" \
                       "Download links:${LINKS_RESULT}"; do
            name="${entry%%:*}"
            val="${entry#*:}"
            case "$val" in
              ""|"false"|"failure"|"cancelled")
                echo "::error::${name} failed (result='${val}'). See upstream job logs."
                any_failed=1
                ;;
            esac
          done

          if [ "$any_failed" = "1" ]; then
            echo ""
            echo "⚠️  At least one pipeline stage failed. The release fell back"
            echo "    to GHA artifact URLs where applicable; investigate the"
            echo "    ::error:: annotations above for the specific failures."
          fi

  print-gha-fallback-downloads:
    name: Print GHA Artifact Fallback URLs
    needs: [validate-tag, build-windows, build-macos-amd64, build-macos-aarch64, build-linux, upload-to-cos]
    # Only run when COS upload did not actually succeed but at least
    # one build succeeded — that's the scenario where the public CDN
    # has no files but the GHA artifact store does.
    if: |
      always() &&
      needs.validate-tag.outputs.tag-valid == 'true' &&
      needs.upload-to-cos.outputs.upload-success == 'false' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success' ||
       needs.build-macos-amd64.result == 'success' ||
       needs.build-macos-aarch64.result == 'success')
    # Honour the same runner_group selection the build jobs do: when
    # the operator picked a self-hosted runner_group, this fallback
    # job must also run on a matching self-hosted runner (per the
    # "if you pick self-hosted, the whole pipeline is self-hosted"
    # contract). github-hosted falls through to ubuntu-latest.
    runs-on: ${{ github.event.inputs.runner_group == 'ecan-windows-amd64' && fromJSON('["self-hosted","windows","x64","ecan-build"]') || github.event.inputs.runner_group == 'ecan-macos-amd64' && fromJSON('["self-hosted","macos","x64","ecan-build"]') || github.event.inputs.runner_group == 'ecan-macos-aarch64' && fromJSON('["self-hosted","macos","aarch64","ecan-build"]') || github.event.inputs.runner_group == 'ecan-linux-amd64' && fromJSON('["self-hosted","linux","x64","ecan-build"]') || 'ubuntu-latest' }}
    steps:
      - name: Emit GHA artifact URLs to step summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          WINDOWS_OK:    ${{ needs.build-windows.result == 'success' }}
          MACOS_AMD64_OK: ${{ needs.build-macos-amd64.result == 'success' }}
          MACOS_AARCH64_OK: ${{ needs.build-macos-aarch64.result == 'success' }}
          LINUX_OK:      ${{ needs.build-linux.result == 'success' }}
        run: |
          VER="${VERSION}"
          {
            echo "## :warning: COS upload failed — temporary download via GitHub Actions artifacts"
            echo ""
            echo "The Tencent Cloud COS upload step failed, but build artifacts were preserved as GitHub Actions artifacts (retention: 90 days, login required). These are **temporary fallback** URLs for CN internal use only; the public CDN download flow is unavailable until COS upload is fixed."
            echo ""
            echo "Workflow run: ${RUN_URL}"
            echo ""
            echo "| Platform | Architecture | Status | Artifact | Download |"
            echo "|---|---|---|---|---|"

            if [[ "${WINDOWS_OK}" == "true" ]]; then
              A="eCan-windows-amd64-${VER}-s3-transfer"
              B="eCan-windows-amd64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| Windows | amd64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| Windows | amd64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| Windows | amd64 | :x: | (build failed) | n/a |"
            fi

            if [[ "${MACOS_AMD64_OK}" == "true" ]]; then
              A="eCan-macos-amd64-${VER}-s3-transfer"
              B="eCan-macos-amd64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| macOS | amd64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| macOS | amd64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| macOS | amd64 | :x: | (build failed) | n/a |"
            fi

            if [[ "${MACOS_AARCH64_OK}" == "true" ]]; then
              A="eCan-macos-aarch64-${VER}-s3-transfer"
              B="eCan-macos-aarch64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| macOS | aarch64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| macOS | aarch64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| macOS | aarch64 | :x: | (build failed) | n/a |"
            fi

            if [[ "${LINUX_OK}" == "true" ]]; then
              A="eCan-linux-amd64-${VER}-s3-transfer"
              B="eCan-linux-amd64-${VER}"
              URL_A="${RUN_URL}#artifacts"
              echo "| Linux | amd64 | :white_check_mark: | \`${A}\` | [open artifacts list](${URL_A}) |"
              echo "| Linux | amd64 | :white_check_mark: | \`${B}\` | [open artifacts list](${URL_A}) |"
            else
              echo "| Linux | amd64 | :x: | (build failed) | n/a |"
            fi

            echo ""
            echo "> **Note:** the artifacts panel is gated behind a GitHub login. To grab a single artifact, use the CLI:"
            echo ""
            echo '```bash'
            echo "gh run download ${GITHUB_RUN_ID:-<run-id>} --repo ${GITHUB_REPOSITORY:-ecan/eCan.ai} --name eCan-windows-amd64-${VER}-s3-transfer"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # Also emit a machine-parseable manifest to the workflow log
          # so consumers can scrape the artifact list without parsing
          # the step summary markdown.
          echo ""
          echo "::group::GHA artifact fallback manifest"
          echo "version=${VER}"
          echo "run_id=${GITHUB_RUN_ID}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "windows_artifact_1=eCan-windows-amd64-${VER}-s3-transfer"
          echo "windows_artifact_2=eCan-windows-amd64-${VER}"
          echo "macos_amd64_artifact_1=eCan-macos-amd64-${VER}-s3-transfer"
          echo "macos_amd64_artifact_2=eCan-macos-amd64-${VER}"
          echo "macos_aarch64_artifact_1=eCan-macos-aarch64-${VER}-s3-transfer"
          echo "macos_aarch64_artifact_2=eCan-macos-aarch64-${VER}"
          echo "linux_artifact_1=eCan-linux-amd64-${VER}-s3-transfer"
          echo "linux_artifact_2=eCan-linux-amd64-${VER}"
          echo "::endgroup::"
